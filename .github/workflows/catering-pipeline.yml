name: Catering Pipeline + Agent Contract

on:
  pull_request:
    paths:
      - 'catering.php'
      - 'catering-pipeline.php'
      - 'api/public-catering.php'
      - 'api/catering.php'
      - 'api/catering-agent.php'
      - 'includes/catering-brain.php'
      - 'js/catering-module.js'
      - 'js/floor-planner-module.js'
      - 'database/20260913_catering_pipeline.sql'
      - '.github/workflows/catering-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'catering.php'
      - 'catering-pipeline.php'
      - 'api/public-catering.php'
      - 'api/catering.php'
      - 'api/catering-agent.php'
      - 'includes/catering-brain.php'
      - 'js/catering-module.js'
      - 'js/floor-planner-module.js'
      - 'database/20260913_catering_pipeline.sql'
      - '.github/workflows/catering-pipeline.yml'

jobs:
  catering-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium

      - name: Syntax checks
        run: |
          php -l catering.php
          php -l catering-pipeline.php
          php -l api/public-catering.php
          php -l api/catering.php
          php -l api/catering-agent.php
          php -l includes/catering-brain.php
          node --check js/catering-module.js
          node --check js/floor-planner-module.js

      - name: Catering feature contract
        run: |
          grep -q "public_catering_form" api/public-catering.php
          grep -q "catering.manage" api/catering.php
          grep -q "catering.agent" api/catering-agent.php
          grep -q "catering_brain_sync" api/public-catering.php
          grep -q "catering_brain_sync" api/catering.php
          grep -q "catering.pipeline" includes/catering-brain.php
          grep -q "catering.upcoming" includes/catering-brain.php
          grep -q "Catering Pipeline" catering-pipeline.php
          grep -q "Submit catering request" catering.php
          grep -q "catering-pipeline.php" js/floor-planner-module.js
          grep -q "js/catering-module.js" js/floor-planner-module.js
          grep -q "api/catering-agent.php" js/catering-module.js

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app' => ['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database' => ['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security' => ['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service = new UpgradeService(app_pdo(), __DIR__);
          $service->ensureTrackingTables();
          $service->bootstrapLegacyHistory(null);
          $service->applyPending(null);
          if ($service->pendingMigrations()) exit(1);
          PHP

      - name: Verify catering schema and upgrade ledger
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('catering_leads','catering_lead_activities');")" = "2"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('catering.view','catering.manage','catering.agent');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260913_catering_pipeline';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SHOW INDEX FROM catering_leads WHERE Key_name='idx_catering_event_date';" | wc -l)" -ge "1"
