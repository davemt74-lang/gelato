name: AR Glasses Build Definitions

on:
  pull_request:
    paths:
      - 'api/glasses-definitions.php'
      - 'includes/glasses-definition.php'
      - 'includes/glasses-build.php'
      - 'database/20261013_glasses_build_definitions.sql'
      - 'tests/glasses-build-definition-contract.php'
      - 'docs/GLASSES-BUILD-DEFINITIONS.md'
      - '.github/workflows/glasses-build-definitions.yml'
  push:
    branches: [main, 'feature/glasses-build-definitions']

jobs:
  glasses-build-definitions:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l api/glasses-definitions.php
          php -l includes/glasses-definition.php
          php -l includes/glasses-build.php
          php -l tests/glasses-build-definition-contract.php
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE glasses_build_definitions' database/20261013_glasses_build_definitions.sql
          grep -q 'build_definition_id' database/20261013_glasses_build_definitions.sql
          grep -q 'function glasses_definition_compile' includes/glasses-definition.php
          grep -q 'function glasses_definition_for_menu_item' includes/glasses-definition.php
          grep -q 'gelato.ar_build_definition.v1' includes/glasses-definition.php
          grep -q "action==='definition.compile'" api/glasses-definitions.php
          grep -q 'glasses_definition_for_menu_item' includes/glasses-build.php
          grep -q 'buildDefinition' includes/glasses-build.php
          ! grep -q 'LIKE CONCAT' includes/glasses-definition.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Build definition behavioral contract
        run: php tests/glasses-build-definition-contract.php
      - name: Glasses + KDS regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/glasses-work-api-contract.php
          php tests/glasses-build-session-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php
      - name: Upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
