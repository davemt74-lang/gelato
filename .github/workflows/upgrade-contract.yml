name: One-Click Upgrade Contract

on:
  pull_request:
    paths:
      - 'upgrade.php'
      - 'includes/UpgradeService.php'
      - 'database/*.sql'
      - '.github/workflows/upgrade-contract.yml'
  push:
    branches: [main]
    paths:
      - 'upgrade.php'
      - 'includes/UpgradeService.php'
      - 'database/*.sql'
      - '.github/workflows/upgrade-contract.yml'

jobs:
  upgrade-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_upgrade_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium

      - name: PHP syntax
        run: |
          php -l upgrade.php
          php -l includes/UpgradeService.php
          php -l prep-intelligence.php
          php -l api/prep-intelligence.php
          php -l api/prep-intelligence-agent.php
          php -l api/proactive-agent.php
          php -l includes/prep-intelligence-core.php
          php -l includes/agent-workspace-core.php
          php -l tests/prep-inventory-intelligence-contract.php
          node --check js/prep-intelligence.js

      - name: Upgrade security and behavior contract
        run: |
          grep -q "is_owner_role" upgrade.php
          grep -q "app_verify_csrf" upgrade.php
          grep -q "Run Gelato Upgrade" upgrade.php
          grep -q "schema_migrations" includes/UpgradeService.php
          grep -q "upgrade_runs" includes/UpgradeService.php
          grep -q "GET_LOCK" includes/UpgradeService.php
          grep -q "checksum_changed" includes/UpgradeService.php
          grep -q "DELIMITER" includes/UpgradeService.php
          grep -q "_demo_" includes/UpgradeService.php
          grep -q "20260912_canonical_floor_equipment" includes/UpgradeService.php
          grep -q "api/prep-intelligence-agent.php" includes/agent-workspace-core.php
          grep -q "prep.plan_missing" api/proactive-agent.php
          grep -q "inventory.shortage_forecast" api/proactive-agent.php
          grep -q "app_verify_request_csrf" api/prep-intelligence.php
          if grep -Ev '^[[:space:]]*--' database/20261008_menu_manager_food_builder.sql | grep -Eiq 'ADD[[:space:]]+COLUMN[[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS'; then
            echo 'Menu Manager migration uses ADD COLUMN IF NOT EXISTS, which is not portable to the production MySQL target.' >&2
            exit 1
          fi
          grep -Eiq 'ALTER[[:space:]]+TABLE[[:space:]]+pos_check_items[[:space:]]+ADD[[:space:]]+COLUMN[[:space:]]+modifier_amount' database/20261008_menu_manager_food_builder.sql

      - name: Install MariaDB client and base schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_upgrade_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app' => ['name'=>'Gelato Upgrade CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database' => ['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_upgrade_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security' => ['session_name'=>'gelato_upgrade_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP

      - name: Run one-click upgrader from base install
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service = new UpgradeService(app_pdo(), __DIR__);
          $service->ensureTrackingTables();
          $service->bootstrapLegacyHistory(null);
          $results = $service->applyPending(null);
          echo 'Applied: ' . count($results) . PHP_EOL;
          $pending = $service->pendingMigrations();
          if ($pending) {
              fwrite(STDERR, 'Pending migrations remain: ' . implode(', ', array_column($pending, 'filename')) . PHP_EOL);
              exit(1);
          }
          foreach ($service->migrationStatus() as $row) {
              if (!empty($row['checksum_changed'])) {
                  fwrite(STDERR, 'Checksum drift: ' . $row['filename'] . PHP_EOL);
                  exit(1);
              }
          }
          PHP

      - name: Verify upgraded schema
        run: |
          expected=$(find database -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{8}_.*\.sql' ! -iname '*_demo_*' ! -iname '*_sample_*' ! -iname '*_seed_*' | wc -l | tr -d ' ')
          tracked=$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM schema_migrations")
          test "$tracked" = "$expected"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_upgrade_ci' AND table_name IN ('floor_plans','equipment_assets','equipment_service_contacts','equipment_service_events','agent_knowledge_records');")" = "5"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='gelato_upgrade_ci' AND trigger_name IN ('trg_equipment_assets_canonical_insert','trg_equipment_assets_canonical_update','trg_floor_plans_canonical_archive');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('floorplans.view','floorplans.edit','equipment.view','equipment.edit','equipment.service','equipment.contacts','agent.equipment_skills');")" = "7"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_upgrade_ci' AND table_name IN ('prep_plans','prep_recommendations','prep_plan_tasks','prep_plan_events','prep_demand_signals','inventory_forecasts');")" = "6"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('prep.intelligence.view','prep.intelligence.manage','prep.intelligence.agent','inventory.forecast.view');")" = "4"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260913_zzzzzzzz_prep_inventory_intelligence';")" = "1"

      - name: Verify Menu Manager partial-upgrade recovery
        run: |
          mariadb -h 127.0.0.1 -uroot -proot gelato_upgrade_ci <<'SQL'
          DELETE FROM schema_migrations WHERE migration_key='20261008_menu_manager_food_builder';
          DROP TABLE IF EXISTS pos_check_item_modifiers;
          ALTER TABLE pos_check_items DROP COLUMN modifier_amount;
          SQL
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service = new UpgradeService(app_pdo(), __DIR__);
          $results = $service->applyPending(null);
          if (count($results) !== 1 || ($results[0]['key'] ?? '') !== '20261008_menu_manager_food_builder') {
              fwrite(STDERR, 'Expected only the Menu Manager migration to recover from the simulated partial install.' . PHP_EOL);
              exit(1);
          }
          if ($service->pendingMigrations()) {
              fwrite(STDERR, 'Pending migrations remain after partial Menu Manager recovery.' . PHP_EOL);
              exit(1);
          }
          echo "Menu Manager partial migration recovery: ok\n";
          PHP
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_upgrade_ci' AND table_name='pos_check_items' AND column_name='modifier_amount';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_upgrade_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_upgrade_ci' AND table_name='pos_check_item_modifiers';")" = "1"

      - name: Verify Prep + Inventory Intelligence behavior
        run: php tests/prep-inventory-intelligence-contract.php

      - name: Verify second run is idempotent
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service = new UpgradeService(app_pdo(), __DIR__);
          $service->assertAppliedChecksumsUnchanged();
          $results = $service->applyPending(null);
          if (count($results) !== 0) {
              fwrite(STDERR, 'Second run unexpectedly applied migrations.' . PHP_EOL);
              exit(1);
          }
          echo "Second run: database already current.\n";
          PHP
