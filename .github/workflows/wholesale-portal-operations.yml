name: Wholesale Portal + Operations

on:
  pull_request:
    paths:
      - 'includes/wholesale-portal-operations.php'
      - 'api/wholesale-portal.php'
      - 'api/wholesale-customer-360.php'
      - 'wholesale-portal.php'
      - 'wholesale-customer-360.php'
      - 'tests/wholesale-portal-operations-contract.php'
      - '.github/workflows/wholesale-portal-operations.yml'
  push:
    branches: [main]

jobs:
  wholesale-portal-operations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: PHP syntax checks
        run: |
          php -l includes/wholesale-portal-operations.php
          php -l api/wholesale-portal.php
          php -l api/wholesale-customer-360.php
          php -l wholesale-portal.php
          php -l wholesale-customer-360.php
          php -l tests/wholesale-portal-operations-contract.php
      - name: Buyer portal JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('wholesale-portal.php').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/wholesale-portal-inline.js').write_text(scripts[-1])
          PY
          node --check /tmp/wholesale-portal-inline.js
      - name: Architecture and privacy contract
        run: |
          grep -q 'function wholesale_portal_repeat_order' includes/wholesale-portal-operations.php
          grep -q 'function wholesale_portal_catalog_request' includes/wholesale-portal-operations.php
          grep -q 'function wholesale_portal_safe_fulfillment' includes/wholesale-portal-operations.php
          grep -q 'function wholesale_portal_safe_invoice' includes/wholesale-portal-operations.php
          grep -q 'function wholesale_operations_account_360' includes/wholesale-portal-operations.php
          grep -q "action==='repeat_order'" api/wholesale-portal.php
          grep -q "action==='catalog_request'" api/wholesale-portal.php
          grep -q "app_require_permission('wholesale.view')" api/wholesale-customer-360.php
          ! grep -q 'CREATE TABLE' includes/wholesale-portal-operations.php
          ! grep -q 'INSERT INTO pos_checks' includes/wholesale-portal-operations.php
          ! grep -q 'INSERT INTO pos_tenders' includes/wholesale-portal-operations.php
          ! grep -q 'wholesale_inventory' includes/wholesale-portal-operations.php
          ! grep -q 'internalNote' wholesale-portal.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: W5 portal + operations behavior
        run: php tests/wholesale-portal-operations-contract.php
      - name: W4 receivables regression
        run: php tests/wholesale-receivables-contract.php
      - name: W3 fulfillment regression
        run: php tests/wholesale-allocation-fulfillment-contract.php
      - name: W2 demand regression
        run: php tests/wholesale-demand-commitments-contract.php
      - name: W1 commerce regression
        run: php tests/wholesale-commerce-acquisition-contract.php
      - name: Wholesale lifecycle regression
        run: php tests/wholesale-purchasing-lifecycle-contract.php
      - name: Wholesale Operations regression
        run: php tests/operations-wholesale-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
