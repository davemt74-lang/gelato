name: Table Cleaning + Ready Lifecycle

on:
  pull_request:
    paths:
      - 'database/20260924_table_cleaning_lifecycle.sql'
      - 'includes/table-cleaning-lifecycle.php'
      - 'includes/service-ops-map.php'
      - 'includes/service-ops-atomic.php'
      - 'includes/service-seatability.php'
      - 'api/table-service.php'
      - 'api/host-stand.php'
      - 'table-service.php'
      - 'host-stand.php'
      - 'js/table-cleaning-controls.js'
      - 'tests/table-cleaning-lifecycle-contract.php'
      - '.github/workflows/table-cleaning-lifecycle.yml'
  push:
    branches: [main]

jobs:
  table-cleaning-lifecycle:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/table-cleaning-lifecycle.php
          php -l includes/service-ops-map.php
          php -l includes/service-ops-atomic.php
          php -l includes/service-seatability.php
          php -l api/table-service.php
          php -l api/host-stand.php
          php -l table-service.php
          php -l host-stand.php
          php -l tests/table-cleaning-lifecycle-contract.php
          node --check js/table-cleaning-controls.js
          node --check js/table-service.js
          node --check js/host-stand.js
      - name: Cleaning architecture contract
        run: |
          grep -q 'ADD COLUMN dirty_at' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'ADD COLUMN cleaning_started_at' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'ADD COLUMN cleaning_started_by' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'ADD COLUMN ready_at' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'ADD COLUMN ready_by' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'CREATE TRIGGER trg_service_table_cleaning_update' database/20260924_table_cleaning_lifecycle.sql
          grep -q 'function table_cleaning_start' includes/table-cleaning-lifecycle.php
          grep -q 'function table_cleaning_mark_ready' includes/table-cleaning-lifecycle.php
          grep -q 'function table_cleaning_enrich_map' includes/table-cleaning-lifecycle.php
          grep -q 'Use the table cleaning workflow and Table Ready' includes/service-ops-atomic.php
          grep -q "table.cleaning_start" api/table-service.php
          grep -q "table.ready" api/table-service.php
          grep -q "table.cleaning_start" api/host-stand.php
          grep -q "table.ready" api/host-stand.php
          grep -q 'table-cleaning-controls.js' table-service.php
          grep -q 'table-cleaning-controls.js' host-stand.php
          grep -q 'data-cleaning-control' js/table-cleaning-controls.js
          grep -q 'data-host-cleaning-action' js/table-cleaning-controls.js
          grep -q 'Cleaning table must reject immediate seating' tests/table-cleaning-lifecycle-contract.php
          grep -q 'combined paid check must release both physical tables Dirty' tests/table-cleaning-lifecycle-contract.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify cleaning schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e \"SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='service_tables' AND column_name IN ('dirty_at','cleaning_started_at','cleaning_started_by','ready_at','ready_by');\")" = "5"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e \"SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='gelato_restaurant_ai_ci' AND trigger_name='trg_service_table_cleaning_update';\")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e \"SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260924_table_cleaning_lifecycle';\")" = "1"
      - name: Table cleaning lifecycle behavioral contract
        run: php tests/table-cleaning-lifecycle-contract.php
      - name: Table concurrency regression
        run: php tests/table-concurrency-contract.php
      - name: Upcoming reservation protection regression
        run: php tests/upcoming-reservation-protection-contract.php
      - name: Seatability regression
        run: php tests/table-seatability-contract.php
      - name: Dining visit lifecycle regression
        run: php tests/dining-visit-lifecycle-contract.php
      - name: Recent table-host hardening regression
        run: php tests/table-host-hardening-contract.php
      - name: Host Stand regression
        run: php tests/host-stand-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: Table Service reconciliation regression
        run: php tests/table-service-reconcile-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Daily Manager regression
        run: php tests/daily-manager-contract.php
      - name: Upgrader checksum and idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
