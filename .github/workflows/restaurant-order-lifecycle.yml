name: Restaurant Order Lifecycle

on:
  pull_request:
    paths:
      - 'api/pos.php'
      - 'api/kds.php'
      - 'includes/online-order-core.php'
      - 'includes/online-order-lifecycle.php'
      - 'includes/customer-inbox-core.php'
      - 'includes/customer-crm-core.php'
      - 'includes/pos-core.php'
      - 'includes/kds-core.php'
      - 'includes/kds-production.php'
      - 'tests/restaurant-order-lifecycle-contract.php'
      - '.github/workflows/restaurant-order-lifecycle.yml'
  push:
    branches: [main]

jobs:
  lifecycle:
    name: Lifecycle PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l api/pos.php
          php -l api/kds.php
          php -l includes/online-order-core.php
          php -l includes/online-order-lifecycle.php
          php -l tests/restaurant-order-lifecycle-contract.php
      - name: Lifecycle architecture contract
        run: |
          grep -q 'function online_order_lifecycle_derive' includes/online-order-lifecycle.php
          grep -q 'function online_order_lifecycle_sync' includes/online-order-lifecycle.php
          grep -q '\$progress>0 || \$ready>0 || \$completed>0' includes/online-order-lifecycle.php
          grep -q 'online_order_lifecycle_sync_safe' api/pos.php
          grep -q 'online_order_lifecycle_sync_by_check_id_safe' api/kds.php
          grep -q 'online_order_lifecycle_sync_safe' api/kds.php
          grep -q 'online_order_lifecycle_display_status(online_order_lifecycle_derive' includes/online-order-core.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_lifecycle_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: End-to-end lifecycle contract
        run: php tests/restaurant-order-lifecycle-contract.php
      - name: Online ordering regression
        run: php tests/online-ordering-inbox-contract.php
      - name: KDS regression
        run: php tests/kds-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP

  deploy-package:
    name: Lifecycle Deploy Package
    needs: lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependency-complete deploy ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip
          rm -rf deploy-patch stonefellows-order-lifecycle-deploy.zip
          mkdir -p deploy-patch/includes deploy-patch/api deploy-patch/assets/js deploy-patch/assets/css deploy-patch/database
          cp online-order.php customer-account.php customer-login.php customer-signup.php customer-promotions.php online-orders-admin.php upgrade.php deploy-patch/
          cp api/pos.php api/kds.php api/online-order-customizations.php deploy-patch/api/
          cp includes/*.php deploy-patch/includes/
          cp assets/js/online-order.js deploy-patch/assets/js/
          cp assets/css/online-order.css assets/css/customer-account.css assets/css/customer-inbox.css deploy-patch/assets/css/
          for migration in database/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            name="$(basename "$migration")"
            case "$name" in
              *_demo_*|*_sample_*|*_seed_*) continue ;;
            esac
            cp "$migration" deploy-patch/database/
          done
          test -f deploy-patch/api/pos.php
          test -f deploy-patch/api/kds.php
          test -f deploy-patch/includes/online-order-core.php
          test -f deploy-patch/includes/online-order-lifecycle.php
          test -f deploy-patch/includes/customer-inbox-core.php
          test -f deploy-patch/includes/pos-core.php
          test -f deploy-patch/includes/kds-core.php
          cat > deploy-patch/README-DEPLOY.txt <<'EOF'
          Stonefellows / Gelato restaurant order lifecycle deploy

          Extract this package directly into the application web root, preserving
          folders and overwriting the included files. Then sign in as owner/admin
          and run upgrade.php -> Upgrade once.

          This package keeps one canonical POS check across online ordering, KDS,
          CRM, Sales Intelligence, and customer order history. Online order status
          now advances through Submitted, In kitchen, Preparing, Ready, Kitchen
          complete, Completed, or Cancelled from the live POS/KDS state.

          Ready is an all-live-lines milestone: one ready item cannot make a
          partially cooking ticket appear ready. Transactional customer Inbox
          updates are deduplicated across Preparing, Ready, Completed, and Cancelled.
          EOF
          (cd deploy-patch && zip -qr ../stonefellows-order-lifecycle-deploy.zip .)
          unzip -t stonefellows-order-lifecycle-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-order-lifecycle-deploy
          path: stonefellows-order-lifecycle-deploy.zip
          if-no-files-found: error
          retention-days: 30
