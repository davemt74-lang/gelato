name: AR Glasses Vision Lab V2

on:
  pull_request:
    paths:
      - 'database/20261026_vision_lab_v2.sql'
      - 'includes/glasses-vision-lab.php'
      - 'includes/glasses-learning.php'
      - 'includes/glasses-vision-operations.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'glasses-learning.php'
      - 'assets/js/glasses-vision-lab.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'assets/js/glasses-vision-operations.js'
      - 'includes/admin-control-core.php'
      - 'tests/glasses-vision-lab-v2-contract.php'
      - 'docs/GLASSES-VISION-LAB.md'
      - '.github/workflows/glasses-vision-lab-v2.yml'
  push:
    branches: [main, 'feature/vision-lab-v2-user-training-governance']

jobs:
  vision-lab-v2:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          php -l includes/glasses-vision-lab.php
          php -l includes/glasses-learning.php
          php -l includes/glasses-vision-operations.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-vision-lab-v2-contract.php
          node --check assets/js/glasses-vision-lab.js
      - name: Governance architecture
        run: |
          grep -q 'CREATE TABLE glasses_user_device_assignments' database/20261026_vision_lab_v2.sql
          grep -q 'CREATE TABLE glasses_vision_training_missions' database/20261026_vision_lab_v2.sql
          grep -q 'CREATE TABLE glasses_vision_training_samples' database/20261026_vision_lab_v2.sql
          grep -q 'CREATE TABLE glasses_vision_dataset_versions' database/20261026_vision_lab_v2.sql
          grep -q 'function glasses_vision_lab_assign_device' includes/glasses-vision-lab.php
          grep -q 'function glasses_vision_lab_import_corrected' includes/glasses-vision-lab.php
          grep -q 'function glasses_vision_lab_freeze_dataset' includes/glasses-vision-lab.php
          grep -q 'dataset_hash' database/20261026_vision_lab_v2.sql
          grep -q 'wearer_user_id' includes/glasses-learning.php
          grep -q 'corrector_user_id' includes/glasses-learning.php
          grep -q 'app_verify_request_csrf' api/glasses-vision-lab.php
          ! grep -q 'kds_transition' api/glasses-vision-lab.php
          ! grep -q 'glasses_build_observe' api/glasses-vision-lab.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Vision Lab V2 behavior contract
        run: php tests/glasses-vision-lab-v2-contract.php
      - name: Existing learning and operations regressions
        run: |
          php tests/glasses-learning-analytics-contract.php
          php tests/glasses-vision-operations-contract.php
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/kds-contract.php
      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
