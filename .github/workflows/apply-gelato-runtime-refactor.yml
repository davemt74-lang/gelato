name: Apply Gelato runtime refactor

on:
  push:
    branches:
      - gelato-menu-sync
    paths:
      - scripts/apply-gelato-runtime-refactor.py
      - .github/workflows/apply-gelato-runtime-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: gelato-menu-sync
          fetch-depth: 0

      - name: Refresh legacy agent sample prompts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
            'Show sandwich ingredients': 'Show panini ingredients',
            'Allergens in Great White': 'Allergens in Nutella',
            'What has no red sauce?': 'Show wood-fired pizzas',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected legacy sample prompt: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply runtime refactor
        shell: bash
        run: |
          set -o pipefail
          if ! python3 scripts/apply-gelato-runtime-refactor.py; then
            echo "Legacy context still present after attempted refactor:"
            grep -n -C 3 -E "Great White|Fatso|Belly Buster|French Connection|Fresh Baked Wings|Fat Boy Special" index.html js/advanced-training.js || true
            exit 1
          fi

      - name: Remove one-time patch machinery
        shell: bash
        run: |
          rm -f scripts/apply-gelato-runtime-refactor.py
          rm -f .github/workflows/apply-gelato-runtime-refactor.yml

      - name: Commit refactored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refactor training runtime for live Gelato menu"
          git push origin HEAD:gelato-menu-sync
