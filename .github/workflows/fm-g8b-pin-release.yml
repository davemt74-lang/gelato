name: FM-G8B PIN Permanent Full Deployment
on:
  push:
    branches:
      - delivery/fm-g8b-face-pin
    paths:
      - .github/workflows/fm-g8b-pin-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check permanent release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gelato-fm-g8b-pin --repo davemt74-lang/gelato >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tested merged application source
        if: steps.release.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          ref: 368604f5f6162b700f06179769537a5842f33f0a
          fetch-depth: 1

      - name: Build and verify exact merged complete deployment
        shell: bash
        if: steps.release.outputs.exists != 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '368604f5f6162b700f06179769537a5842f33f0a'
          deploy_root="${RUNNER_TEMP}/gelato-fm-g8b"
          mkdir -p "$deploy_root"
          rsync -a ./ "$deploy_root/" --exclude '.git/' --exclude 'config.php' --exclude '.env' --exclude 'uploads/' --exclude 'storage/'
          vendor_dir="$deploy_root/assets/vendor/mediapipe"
          mkdir -p "$vendor_dir" "${RUNNER_TEMP}/mediapipe-src"
          archive="$(npm pack @mediapipe/tasks-vision@0.10.32 --silent --pack-destination "${RUNNER_TEMP}")"
          tar -xzf "${RUNNER_TEMP}/$archive" -C "${RUNNER_TEMP}/mediapipe-src"
          cp "${RUNNER_TEMP}/mediapipe-src/package/vision_bundle.mjs" "$vendor_dir/vision_bundle.mjs"
          cp -R "${RUNNER_TEMP}/mediapipe-src/package/wasm" "$vendor_dir/wasm"
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            'https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/LICENSE' \
            --output "$vendor_dir/LICENSE"
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' \
            --output "$vendor_dir/hand_landmarker.task"
          test "$(stat -c %s "$vendor_dir/hand_landmarker.task")" -gt 1000000
          test -s "$vendor_dir/vision_bundle.mjs"
          test -s "$vendor_dir/wasm/vision_wasm_internal.wasm"
          sha256sum "$vendor_dir/vision_bundle.mjs" "$vendor_dir/hand_landmarker.task" > "$vendor_dir/ASSET-SHA256SUMS.txt"
          test -s "$deploy_root/database/20261015_fm_g8b_face_pin.sql"
          test -s "$deploy_root/api/fm-pin.php"
          test -s "$deploy_root/includes/food-monster-pin.php"
          test -s "$deploy_root/js/fm-face-pin.js"
          php -l "$deploy_root/api/fm-pin.php"
          php -l "$deploy_root/login.php"
          php -l "$deploy_root/reset-password.php"
          php -l "$deploy_root/profile-pin.php"
          node --check "$deploy_root/js/fm-face-pin.js"
          test ! -e "$deploy_root/config.php"
          test ! -e "$deploy_root/.env"
          test ! -e "$deploy_root/uploads"
          test ! -e "$deploy_root/storage"
          printf '%s\n' 368604f5f6162b700f06179769537a5842f33f0a > "$deploy_root/DEPLOY_SHA.txt"
          (cd "$deploy_root" && zip -qr "$GITHUB_WORKSPACE/gelato-full-deploy.zip" .)
          unzip -tq gelato-full-deploy.zip
          test "$(unzip -p gelato-full-deploy.zip DEPLOY_SHA.txt | tr -d '\r\n')" = '368604f5f6162b700f06179769537a5842f33f0a'
          for asset in assets/vendor/mediapipe/hand_landmarker.task assets/vendor/mediapipe/vision_bundle.mjs assets/vendor/mediapipe/wasm/vision_wasm_internal.wasm; do
            unzip -p gelato-full-deploy.zip "$asset" | cmp - "$deploy_root/$asset"
          done
          sha256sum gelato-full-deploy.zip > gelato-full-deploy.sha256

      - name: Publish permanent direct ZIP
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create gelato-fm-g8b-pin \
            gelato-full-deploy.zip gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target 368604f5f6162b700f06179769537a5842f33f0a \
            --title 'Gelato FM-G8B — Employee Face + PIN Sign-in' \
            --notes 'Complete Gelato application ZIP with MediaPipe and FM-G8B trusted terminal PIN login. PR #321: 14/14 green. Tested source tree equals merged commit 368604f5f6162b700f06179769537a5842f33f0a. After installation preserve config.php, .env, uploads and storage, then run owner-only upgrade.php. Enroll photos only with consent; face selection requires PIN and a Super Admin registered on-site terminal. Physical camera spoof/liveness tests remain pending.'
