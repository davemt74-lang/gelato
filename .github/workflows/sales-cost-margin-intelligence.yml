name: Sales Cost + Margin Intelligence

on:
  pull_request:
    paths:
      - 'sales-cost-intelligence.php'
      - 'sales-intelligence.php'
      - 'api/sales-cost-intelligence.php'
      - 'api/sales-cost-agent.php'
      - 'api/agent-workspace.php'
      - 'includes/sales-cost-core.php'
      - 'js/sales-cost-intelligence.js'
      - 'database/20260914_zzzzzzzz_sales_cost_margin_intelligence.sql'
      - 'tests/sales-cost-margin-contract.php'
      - '.github/workflows/sales-cost-margin-intelligence.yml'
  push:
    branches: [main]

jobs:
  sales-cost-margin-intelligence:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l sales-cost-intelligence.php
          php -l api/sales-cost-intelligence.php
          php -l api/sales-cost-agent.php
          php -l api/agent-workspace.php
          php -l includes/sales-cost-core.php
          php -l tests/sales-cost-margin-contract.php
          node --check js/sales-cost-intelligence.js
      - name: Architecture and accounting-boundary contract
        run: |
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS sales_cost_profiles' database/20260914_zzzzzzzz_sales_cost_margin_intelligence.sql)" = "1"
          grep -q "sales.costs.view" database/20260914_zzzzzzzz_sales_cost_margin_intelligence.sql
          grep -q "sales.costs.manage" database/20260914_zzzzzzzz_sales_cost_margin_intelligence.sql
          grep -q "function sales_cost_convert" includes/sales-cost-core.php
          grep -q "Theoretical COGS uses current mapped" includes/sales-cost-core.php
          grep -q "Purchase receipts are cash/inventory inflow, not period COGS" includes/sales-cost-core.php
          grep -q "grossProfitKnownItemsBeforeLaborOverhead" includes/sales-cost-core.php
          grep -q "api/sales-cost-agent.php" api/agent-workspace.php
          grep -q "food cost" api/agent-workspace.php
          grep -q "cost_method" database/20260914_zzzzzzzz_sales_cost_margin_intelligence.sql
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify schema and permissions
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='sales_cost_profiles';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('sales.costs.view','sales.costs.manage');")" = "2"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260914_zzzzzzzz_sales_cost_margin_intelligence';")" = "1"
      - name: Cost, margin, purchasing and waste contract
        run: php tests/sales-cost-margin-contract.php
      - name: Existing Sales + Demand regression
        run: php tests/sales-demand-intelligence-contract.php
      - name: Existing Operations regression
        run: php tests/operations-wholesale-contract.php
      - name: Existing Prep Intelligence regression
        run: php tests/prep-inventory-intelligence-contract.php
      - name: Existing Agent Workspace regression
        run: php tests/agent-workspace-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
