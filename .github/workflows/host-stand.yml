name: Floor Table Assets + Reservations + Host Stand

on:
  pull_request:
    paths:
      - 'host-stand.php'
      - 'api/host-stand.php'
      - 'includes/host-stand-core.php'
      - 'js/host-stand.js'
      - 'database/20260921_floor_table_reservations.sql'
      - 'tests/host-stand-contract.php'
      - '.github/workflows/host-stand.yml'
  push:
    branches: [main]

jobs:
  host-stand:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l host-stand.php
          php -l api/host-stand.php
          php -l includes/host-stand-core.php
          php -l tests/host-stand-contract.php
          node --check js/host-stand.js
      - name: Architecture contract
        run: |
          grep -q 'ADD COLUMN equipment_asset_id' database/20260921_floor_table_reservations.sql
          grep -q 'DROP INDEX uq_service_table_active_check' database/20260921_floor_table_reservations.sql
          grep -q 'CREATE TABLE IF NOT EXISTS table_combinations' database/20260921_floor_table_reservations.sql
          grep -q 'CREATE TABLE IF NOT EXISTS guest_reservations' database/20260921_floor_table_reservations.sql
          grep -q 'CREATE TABLE IF NOT EXISTS guest_reservation_tables' database/20260921_floor_table_reservations.sql
          grep -q 'CREATE TABLE IF NOT EXISTS guest_reservation_events' database/20260921_floor_table_reservations.sql
          grep -q "'host.view'" database/20260921_floor_table_reservations.sql
          grep -q "'host.use'" database/20260921_floor_table_reservations.sql
          grep -q "'host.manage'" database/20260921_floor_table_reservations.sql
          grep -q "'dining_table'" includes/host-stand-core.php
          grep -q 'function host_create_managed_table' includes/host-stand-core.php
          grep -q 'function host_availability' includes/host-stand-core.php
          grep -q 'function host_seat' includes/host-stand-core.php
          grep -q 'table_service_seat' includes/host-stand-core.php
          grep -q "customer_id=?" includes/host-stand-core.php
          grep -q 'service_visit_reconcile_live' api/host-stand.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify schema and permissions
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('table_combinations','table_combination_members','guest_reservations','guest_reservation_tables','guest_reservation_events');")" = "5"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='service_tables' AND column_name='equipment_asset_id';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('host.view','host.use','host.manage');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260921_floor_table_reservations';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT NON_UNIQUE FROM information_schema.statistics WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='service_tables' AND index_name='idx_service_table_active_check' LIMIT 1;")" = "1"
      - name: Host Stand behavioral contract
        run: php tests/host-stand-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: Table Service reconciliation regression
        run: php tests/table-service-reconcile-contract.php
      - name: Kitchen Display regression
        run: php tests/kds-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Daily Manager regression
        run: php tests/daily-manager-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
