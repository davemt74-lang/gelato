name: Time Clock Agent Source Finalizer

on:
  push:
    branches: [timeclock-attendance-agent-20260916]
    paths:
      - 'tools/timeclock-agent-finalizer.py'
      - '.github/workflows/timeclock-agent-finalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeclock-attendance-agent-20260916
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded integration patch
        run: python tools/timeclock-agent-finalizer.py
      - name: Validate patched source
        run: |
          php -l timeclock.php
          php -l api/timeclock-agent.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l includes/timeclock-agent-core.php
          php -l includes/timeclock-agent-brain.php
          php -l tests/timeclock-agent-lifecycle.php
          node --check js/timeclock-voice.js
          node --check js/timeclock-agent-context.js
      - name: Commit validated source only
        run: |
          set -euo pipefail
          git config user.name "Stonefellows CI"
          git config user.email "actions@users.noreply.github.com"
          git add timeclock.php api/timeclock-agent.php api/agent-workspace.php api/brain-orchestrator.php includes/agent-node-registry.php includes/agent-workspace-core.php includes/timeclock-agent-core.php includes/timeclock-agent-brain.php js/timeclock-voice.js js/timeclock-agent-context.js tests/timeclock-agent-lifecycle.php
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Integrate first-class Time Clock Attendance Agent"
          git push origin HEAD:timeclock-attendance-agent-20260916
