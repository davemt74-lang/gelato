name: AR Glasses Calibration Studio

on:
  pull_request:
    paths:
      - 'glasses-calibration-studio.php'
      - 'includes/glasses-calibration-studio.php'
      - 'includes/admin-control-core.php'
      - 'assets/js/glasses-calibration-geometry.js'
      - 'assets/js/glasses-calibration-studio.js'
      - 'assets/css/glasses-calibration-studio.css'
      - 'tests/glasses-calibration-studio-contract.php'
      - 'tests/glasses-calibration-geometry.test.js'
      - 'docs/GLASSES-CALIBRATION-STUDIO.md'
      - '.github/workflows/glasses-calibration-studio.yml'
  push:
    branches: [main, 'feature/glasses-calibration-studio']

jobs:
  calibration-studio:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          php -l glasses-calibration-studio.php
          php -l includes/glasses-calibration-studio.php
          php -l includes/admin-control-core.php
          php -l tests/glasses-calibration-studio-contract.php
          node --check assets/js/glasses-calibration-geometry.js
          node --check assets/js/glasses-calibration-studio.js

      - name: UI architecture contract
        run: |
          grep -q 'Station Calibration Studio' glasses-calibration-studio.php
          grep -q 'gcsReferenceFile' glasses-calibration-studio.php
          grep -q 'gcsDrawIngredient' glasses-calibration-studio.php
          grep -q 'data-region-tool="build_surface"' glasses-calibration-studio.php
          grep -q 'gcsVersions' glasses-calibration-studio.php
          grep -q 'glasses-calibration-geometry.js' glasses-calibration-studio.php
          grep -q 'glasses-calibration-studio.js' glasses-calibration-studio.php
          grep -q 'glasses-calibration-studio.css' glasses-calibration-studio.php
          grep -q 'URL.createObjectURL' assets/js/glasses-calibration-studio.js
          grep -q 'G.buildPayload' assets/js/glasses-calibration-studio.js
          grep -q "'calibration.save'" assets/js/glasses-calibration-geometry.js
          grep -q 'build_surface' assets/js/glasses-calibration-geometry.js
          grep -q 'glasses-calibration-studio.php' includes/admin-control-core.php
          ! grep -q 'FormData' assets/js/glasses-calibration-studio.js

      - name: Geometry behavioral contract
        run: node tests/glasses-calibration-geometry.test.js

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Calibration Studio backend contract
        run: php tests/glasses-calibration-studio-contract.php

      - name: Glasses calibration + workflow regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/glasses-work-api-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-build-definition-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/glasses-expo-handoff-contract.php
          php tests/glasses-station-calibration-contract.php
          php tests/glasses-transfer-sequence-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
