name: Wholesale Allocation + Fulfillment

on:
  pull_request:
    paths:
      - 'database/20260929_wholesale_allocation_fulfillment.sql'
      - 'includes/wholesale-demand.php'
      - 'includes/wholesale-fulfillment.php'
      - 'includes/operations-wholesale.php'
      - 'api/wholesale-fulfillment.php'
      - 'wholesale-fulfillment.php'
      - 'tests/wholesale-allocation-fulfillment-contract.php'
      - '.github/workflows/wholesale-allocation-fulfillment.yml'
  push:
    branches: [main]

jobs:
  wholesale-allocation-fulfillment:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/wholesale-demand.php
          php -l includes/wholesale-fulfillment.php
          php -l includes/operations-wholesale.php
          php -l api/wholesale-fulfillment.php
          php -l wholesale-fulfillment.php
          php -l tests/wholesale-allocation-fulfillment-contract.php
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_fulfillments' database/20260929_wholesale_allocation_fulfillment.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_fulfillment_items' database/20260929_wholesale_allocation_fulfillment.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_fulfillment_consumptions' database/20260929_wholesale_allocation_fulfillment.sql
          grep -q 'wholesale_account_location_id' database/20260929_wholesale_allocation_fulfillment.sql
          grep -q "source_type='wholesale_order'" includes/wholesale-demand.php
          grep -q "'wholesale_fulfillment'" includes/wholesale-fulfillment.php
          grep -q "app_has_permission('inventory.manage'" api/wholesale-fulfillment.php
          grep -q 'wholesale_fulfillment' includes/operations-wholesale.php
          ! grep -q 'CREATE TABLE IF NOT EXISTS wholesale_inventory' database/20260929_wholesale_allocation_fulfillment.sql
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify W3 schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('wholesale_fulfillments','wholesale_fulfillment_items','wholesale_fulfillment_consumptions');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='wholesale_orders' AND column_name IN ('wholesale_account_location_id','requested_window_start','requested_window_end','promised_window_start','promised_window_end');")" = "5"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260929_wholesale_allocation_fulfillment';")" = "1"
      - name: W3 allocation + fulfillment behavior
        run: php tests/wholesale-allocation-fulfillment-contract.php
      - name: W2 demand commitment regression
        run: php tests/wholesale-demand-commitments-contract.php
      - name: W1 commerce + acquisition regression
        run: php tests/wholesale-commerce-acquisition-contract.php
      - name: Wholesale purchasing + lifecycle regression
        run: php tests/wholesale-purchasing-lifecycle-contract.php
      - name: Wholesale Operations regression
        run: php tests/operations-wholesale-contract.php
      - name: Prep + Inventory regression
        run: php tests/prep-inventory-intelligence-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
