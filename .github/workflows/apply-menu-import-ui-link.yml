name: Apply menu import UI link

on:
  push:
    branches: [gelato-menu-sync]
    paths:
      - '.github/workflows/apply-menu-import-ui-link.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gelato-menu-sync
          fetch-depth: 0
      - name: Patch menu UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          replacements={
            '<div class="head-actions"><button class="btn btn-light" id="menuSelectRole">Use position sections</button><button class="btn btn-light" onclick="window.print()">Print guide</button></div>':'<div class="head-actions"><a class="btn btn-dark" href="admin-menu-import.php">Import menu</a><button class="btn btn-light" id="menuSelectRole">Use position sections</button><button class="btn btn-light" onclick="window.print()">Print guide</button></div>',
            '<div class="context-row"><span>Required sections</span><strong id="contextSections">10</strong></div><div class="context-row"><span>Menu records</span><strong>56</strong></div>':'<div class="context-row"><span>Required sections</span><strong id="contextSections">0</strong></div><div class="context-row"><span>Menu source</span><strong>Database</strong></div>',
            '<button class="usage-link prompt-chip">Price of Carnivore</button><button class="usage-link prompt-chip">Which items contain tuna?</button><button class="usage-link prompt-chip">Compare Hawaiian and Luau</button>':'<button class="usage-link prompt-chip">Price of Margherita</button><button class="usage-link prompt-chip">Which items contain pesto?</button><button class="usage-link prompt-chip">Compare Margherita and Honey Basil</button>',
            'Complete Ingredient Catalog':'Ingredient Catalog',
            'Filter the complete ingredient catalog by menu category.':'Filter the current database-derived ingredient catalog by menu category.',
            'See where every listed ingredient appears. Combine category filters with search to isolate pizza ingredients, sandwich ingredients, sauces, cheeses, meats, produce, and more.':'See where listed menu components appear. Combine category filters with search to isolate pizza ingredients, panini ingredients, sauces, cheeses, meats, produce, and more.'
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match for {old[:60]!r}, found {count}')
              text=text.replace(old,new,1)
          banned=['Price of Carnivore','Which items contain tuna?','Compare Hawaiian and Luau','Menu records</span><strong>56']
          remaining=[x for x in banned if x in text]
          if remaining:
              raise SystemExit(f'Stale UI references remain: {remaining}')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-menu-import-ui-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expose scanned menu import in training UI"
          git push origin HEAD:gelato-menu-sync
