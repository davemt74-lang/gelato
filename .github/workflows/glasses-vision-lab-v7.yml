name: AR Glasses Vision Lab V7 Production Feedback

on:
  pull_request:
    paths:
      - 'database/20261103_vision_lab_v7_production_error_ledger.sql'
      - 'database/20261104_vision_lab_v7_failure_analysis.sql'
      - 'database/20261105_vision_lab_v7_hard_example_mining.sql'
      - 'database/20261106_vision_lab_v7_retraining_candidate_builder.sql'
      - 'database/20261107_vision_lab_v7_model_improvement_experiments.sql'
      - 'database/20261108_vision_lab_v7_champion_challenger_review.sql'
      - 'database/20261109_vision_lab_v7_governed_promotion_audit.sql'
      - 'includes/glasses-vision-feedback.php'
      - 'includes/glasses-vision-failure-analysis.php'
      - 'includes/glasses-vision-mining.php'
      - 'includes/glasses-vision-retraining.php'
      - 'includes/glasses-vision-experiments.php'
      - 'includes/glasses-vision-evidence-review.php'
      - 'includes/glasses-vision-promotion.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'assets/js/glasses-vision-feedback.js'
      - 'assets/js/glasses-vision-failure-analysis.js'
      - 'assets/js/glasses-vision-mining.js'
      - 'assets/js/glasses-vision-retraining.js'
      - 'assets/js/glasses-vision-experiments.js'
      - 'assets/js/glasses-vision-evidence-review.js'
      - 'assets/js/glasses-vision-promotion.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'tests/glasses-vision-lab-v7-production-error-ledger-contract.php'
      - 'tests/glasses-vision-lab-v7-failure-analysis-contract.php'
      - 'tests/glasses-vision-lab-v7-hard-example-mining-contract.php'
      - 'tests/glasses-vision-lab-v7-retraining-candidate-builder-contract.php'
      - 'tests/glasses-vision-lab-v7-model-improvement-experiment-contract.php'
      - 'tests/glasses-vision-lab-v7-champion-challenger-review-contract.php'
      - 'tests/glasses-vision-lab-v7-governed-promotion-audit-contract.php'
      - 'docs/GLASSES-VISION-LAB-V7-PRODUCTION-FEEDBACK.md'
      - 'docs/GLASSES-VISION-LAB-V7-FAILURE-ANALYSIS.md'
      - 'docs/GLASSES-VISION-LAB-V7-HARD-EXAMPLE-MINING.md'
      - 'docs/GLASSES-VISION-LAB-V7-RETRAINING-CANDIDATES.md'
      - 'docs/GLASSES-VISION-LAB-V7-MODEL-EXPERIMENTS.md'
      - 'docs/GLASSES-VISION-LAB-V7-EVIDENCE-REVIEW.md'
      - 'docs/GLASSES-VISION-LAB-V7-GOVERNED-PROMOTION.md'
      - '.github/workflows/glasses-vision-lab-v7.yml'
  push:
    branches: [main]

jobs:
  vision-lab-v7:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l includes/glasses-vision-feedback.php
          php -l includes/glasses-vision-failure-analysis.php
          php -l includes/glasses-vision-mining.php
          php -l includes/glasses-vision-retraining.php
          php -l includes/glasses-vision-experiments.php
          php -l includes/glasses-vision-evidence-review.php
          php -l includes/glasses-vision-promotion.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-vision-lab-v7-production-error-ledger-contract.php
          php -l tests/glasses-vision-lab-v7-failure-analysis-contract.php
          php -l tests/glasses-vision-lab-v7-hard-example-mining-contract.php
          php -l tests/glasses-vision-lab-v7-retraining-candidate-builder-contract.php
          php -l tests/glasses-vision-lab-v7-model-improvement-experiment-contract.php
          php -l tests/glasses-vision-lab-v7-champion-challenger-review-contract.php
          php -l tests/glasses-vision-lab-v7-governed-promotion-audit-contract.php
          node --check assets/js/glasses-vision-feedback.js
          node --check assets/js/glasses-vision-failure-analysis.js
          node --check assets/js/glasses-vision-mining.js
          node --check assets/js/glasses-vision-retraining.js
          node --check assets/js/glasses-vision-experiments.js
          node --check assets/js/glasses-vision-evidence-review.js
          node --check assets/js/glasses-vision-promotion.js

      - name: Architecture guardrails
        run: |
          grep -q 'CREATE TABLE glasses_vision_production_errors' database/20261103_vision_lab_v7_production_error_ledger.sql
          grep -q 'UNIQUE KEY uq_glasses_vision_prod_error_event' database/20261103_vision_lab_v7_production_error_ledger.sql
          grep -q 'function glasses_vision_feedback_record' includes/glasses-vision-feedback.php
          grep -q 'function glasses_vision_feedback_sync_corrections' includes/glasses-vision-feedback.php
          grep -q 'produced_error' includes/glasses-vision-feedback.php
          ! grep -q 'kds_transition' includes/glasses-vision-feedback.php
          ! grep -q 'UPDATE glasses_build_observations' includes/glasses-vision-feedback.php
          grep -q 'CREATE TABLE glasses_vision_failure_analyses' database/20261104_vision_lab_v7_failure_analysis.sql
          grep -q 'function glasses_vision_failure_analysis_run' includes/glasses-vision-failure-analysis.php
          grep -q 'sourceFingerprint' includes/glasses-vision-failure-analysis.php
          grep -q "'rateClaimed'=>false" includes/glasses-vision-failure-analysis.php
          ! grep -q 'kds_transition' includes/glasses-vision-failure-analysis.php
          grep -q 'CREATE TABLE glasses_vision_mining_runs' database/20261105_vision_lab_v7_hard_example_mining.sql
          grep -q 'CREATE TABLE glasses_vision_mined_candidates' database/20261105_vision_lab_v7_hard_example_mining.sql
          grep -q 'function glasses_vision_mining_run' includes/glasses-vision-mining.php
          grep -q "'automaticDatasetInclusion'=>false" includes/glasses-vision-mining.php
          ! grep -q 'kds_transition' includes/glasses-vision-mining.php
          grep -q 'CREATE TABLE glasses_vision_retraining_batches' database/20261106_vision_lab_v7_retraining_candidate_builder.sql
          grep -q 'CREATE TABLE glasses_vision_retraining_batch_items' database/20261106_vision_lab_v7_retraining_candidate_builder.sql
          grep -q 'function glasses_vision_retraining_build_dataset' includes/glasses-vision-retraining.php
          grep -q 'requireActiveOptInMedia' includes/glasses-vision-retraining.php
          ! grep -q 'kds_transition' includes/glasses-vision-retraining.php
          grep -q 'CREATE TABLE glasses_vision_model_experiments' database/20261107_vision_lab_v7_model_improvement_experiments.sql
          grep -q 'function glasses_vision_experiment_attach_run' includes/glasses-vision-experiments.php
          grep -q 'qualification_id' includes/glasses-vision-experiments.php
          ! grep -q 'rollout.activate' includes/glasses-vision-experiments.php
          grep -q 'CREATE TABLE glasses_vision_model_evidence_reviews' database/20261108_vision_lab_v7_champion_challenger_review.sql
          grep -q 'function glasses_vision_evidence_review_run' includes/glasses-vision-evidence-review.php
          grep -q 'maximumCriticalRegressions' includes/glasses-vision-evidence-review.php
          ! grep -q 'rollout.activate' includes/glasses-vision-evidence-review.php
          grep -q 'CREATE TABLE glasses_vision_model_promotions' database/20261109_vision_lab_v7_governed_promotion_audit.sql
          grep -q 'CREATE TABLE glasses_vision_model_promotion_events' database/20261109_vision_lab_v7_governed_promotion_audit.sql
          grep -q 'function glasses_vision_promotion_authorize' includes/glasses-vision-promotion.php
          grep -q 'function glasses_vision_promotion_create_rollout' includes/glasses-vision-promotion.php
          ! grep -q 'rollout.activate' includes/glasses-vision-promotion.php
          ! grep -q 'rollout.advance' includes/glasses-vision-promotion.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: V7 production error ledger contract
        run: php tests/glasses-vision-lab-v7-production-error-ledger-contract.php

      - name: V7 lineage-aware failure analysis contract
        run: php tests/glasses-vision-lab-v7-failure-analysis-contract.php

      - name: V7 hard example and counterexample mining contract
        run: php tests/glasses-vision-lab-v7-hard-example-mining-contract.php

      - name: V7 retraining candidate builder contract
        run: php tests/glasses-vision-lab-v7-retraining-candidate-builder-contract.php

      - name: V7 model improvement experiment contract
        run: php tests/glasses-vision-lab-v7-model-improvement-experiment-contract.php

      - name: V7 champion challenger evidence review contract
        run: php tests/glasses-vision-lab-v7-champion-challenger-review-contract.php

      - name: V7 governed promotion and continuous-learning audit contract
        run: php tests/glasses-vision-lab-v7-governed-promotion-audit-contract.php

      - name: V6 lineage and correction regressions
        run: |
          php tests/glasses-vision-lab-v6-lineage-traceability-contract.php
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-vision-model-rollout-contract.php
          php tests/glasses-build-session-contract.php
          php tests/kds-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
