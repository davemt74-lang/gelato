name: KDS Voice Agent

on:
  pull_request:
    paths:
      - 'kds.php'
      - 'api/kds-agent.php'
      - 'includes/agent-node-registry.php'
      - 'js/agent-page-context.js'
      - 'js/global-agent.js'
      - 'js/kds-agent-context.js'
      - 'js/kds-agent-sidebar.js'
      - 'js/kds-voice-listener.js'
      - 'js/voice-turn-taking.js'
      - 'tests/voice-turn-taking.test.js'
      - 'tests/voice-barge-in-contract.php'
      - 'js/kds.js'
      - 'tests/kds-slot-voice-contract.php'
      - 'includes/kds-slot-references.php'
      - 'tests/kds-global-order-reference.php'
      - 'docs/KDS-GLOBAL-ORDER-REFERENCES.md'
      - 'tests/kds-slot-voice.test.js'
      - 'tests/kds-voice-agent-contract.php'
      - '.github/workflows/kds-voice-agent.yml'
  push:
    branches: [main]
    paths:
      - 'kds.php'
      - 'api/kds-agent.php'
      - 'includes/agent-node-registry.php'
      - 'js/agent-page-context.js'
      - 'js/global-agent.js'
      - 'js/kds-agent-context.js'
      - 'js/kds-agent-sidebar.js'
      - 'js/kds-voice-listener.js'
      - 'js/voice-turn-taking.js'
      - 'tests/voice-turn-taking.test.js'
      - 'tests/voice-barge-in-contract.php'
      - 'js/kds.js'
      - 'tests/kds-slot-voice-contract.php'
      - 'includes/kds-slot-references.php'
      - 'tests/kds-global-order-reference.php'
      - 'docs/KDS-GLOBAL-ORDER-REFERENCES.md'
      - 'tests/kds-slot-voice.test.js'
      - 'tests/kds-voice-agent-contract.php'
      - '.github/workflows/kds-voice-agent.yml'

jobs:
  kds-voice-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
      - name: Syntax checks
        run: |
          php -l kds.php
          php -l api/kds-agent.php
          php -l includes/agent-node-registry.php
          php -l tests/kds-voice-agent-contract.php
          node --check js/agent-page-context.js
          node --check js/global-agent.js
          node --check js/kds-agent-context.js
          node --check js/kds-agent-sidebar.js
          node --check js/kds-voice-listener.js
          node --check js/voice-turn-taking.js
          php -l tests/voice-barge-in-contract.php
          node --check js/kds.js
          php -l tests/kds-slot-voice-contract.php
          php -l includes/kds-slot-references.php
          php -l tests/kds-global-order-reference.php
      - name: KDS voice-only Agent contract
        run: |
          php tests/kds-voice-agent-contract.php
          php tests/kds-slot-voice-contract.php
          php tests/kds-global-order-reference.php
          node tests/kds-slot-voice.test.js
          php tests/voice-barge-in-contract.php
          node tests/voice-turn-taking.test.js