name: AR Glasses Work API

on:
  pull_request:
    paths:
      - 'api/glasses-device.php'
      - 'includes/glasses-work.php'
      - 'tests/glasses-work-api-contract.php'
      - 'docs/GLASSES-WORK-API.md'
      - '.github/workflows/glasses-work-api.yml'
  push:
    branches: [main, 'feature/glasses-ar-work-api']

jobs:
  glasses-work-api:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l api/glasses-device.php
          php -l includes/glasses-work.php
          php -l tests/glasses-work-api-contract.php
      - name: Architecture contract
        run: |
          grep -q 'function glasses_current_work' includes/glasses-work.php
          grep -q 'function glasses_work_modifiers' includes/glasses-work.php
          grep -q 'function glasses_work_recipe_source' includes/glasses-work.php
          grep -q 'kds_production_board' includes/glasses-work.php
          grep -q 'menu_training_item' includes/glasses-work.php
          grep -q "action==='current_work'" api/glasses-device.php
          grep -q 'assignmentRequired' includes/glasses-work.php
          ! grep -q 'kds_transition' includes/glasses-work.php
          ! grep -q 'INSERT INTO kds_order_items' includes/glasses-work.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: AR work behavioral contract
        run: php tests/glasses-work-api-contract.php
      - name: Foundation + KDS regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php
      - name: Upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
