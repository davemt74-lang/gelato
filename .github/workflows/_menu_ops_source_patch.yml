        if(!$location)return ['skill'=>'menu.availability','answer'=>'Tell me which restaurant location you mean so I can check its live item and size availability.','data'=>[],'sources'=>[]];$state=menu_operations_location_state($pdo,$organizationId,$locationId);$blocked=[];foreach($state as $item){if(!empty($item['status']['soldOut']))$blocked[]=$item['name'].' — item sold out'.(!empty($item['status']['reason'])?' ('.$item['status']['reason'].')':'');foreach($item['sizes'] as $size)if(!empty($size['status']['soldOut']))$blocked[]=$item['name'].' / '.$size['label'].' — sold out'.(!empty($size['status']['reason'])?' ('.$size['status']['reason'].')':'');}return ['skill'=>'menu.availability','answer'=>$blocked?('Live menu availability at '.$location['name'].":\n- ".implode("\n- ",$blocked)):('No item- or size-level 86s are active at '.$location['name'].'.'),'data'=>$state,'sources'=>[]];
