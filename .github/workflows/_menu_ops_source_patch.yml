name: Menu Operations source integration patch

on:
  push:
    branches:
      - feature/menu-operations-agent-brain
    paths:
      - '.github/workflows/_menu_ops_source_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-operations-agent-brain
          fetch-depth: 0
      - name: Apply source integrations
        run: python3 scripts/_menu_ops_patch.py
      - name: Validate patched PHP
        run: |
          php -l includes/menu-manager-core.php
          php -l includes/agent-workspace-core.php
          php -l api/media.php
          php -l api/menu-manager.php
      - name: Commit source integrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/menu-manager-core.php includes/agent-workspace-core.php api/media.php api/menu-manager.php
          git commit -m 'Integrate Menu Operations with selling paths and main Agent router'
          git push origin HEAD:feature/menu-operations-agent-brain
