    $items=menu_operations_search($pdo,$organizationId,$message,20,$locationId);if(!$items)$items=menu_operations_search($pdo,$organizationId,'',20,$locationId);$lines=[];foreach($items as $item){$price=$item['minPrice']===null?'no active price':('$'.number_format((float)$item['minPrice'],2).(($item['maxPrice']!==null&&(float)$item['maxPrice']!==(float)$item['minPrice'])?'–$'.number_format((float)$item['maxPrice'],2):''));$lines[]=$item['name'].' — '.$item['category'].' — '.$price.(isset($item['operationalStatus'])&&!empty($item['operationalStatus']['soldOut'])?' — SOLD OUT':'');}return ['skill'=>'menu.search','answer'=>$lines?"Matching menu items:\n- ".implode("\n- ",$lines):'No matching menu items were found.','data'=>$items,'sources'=>['menu_operations-current']];
}

