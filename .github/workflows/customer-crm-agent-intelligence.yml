name: Customer CRM Agent Intelligence

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/customer-crm-agent.php'
      - 'api/brain-orchestrator.php'
      - 'api/brain-events.php'
      - 'includes/customer-crm-agent-core.php'
      - 'includes/customer-crm-agent-extensions.php'
      - 'includes/customer-crm-intelligence.php'
      - 'includes/customer-crm-brain.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-node-registry.php'
      - 'tests/customer-crm-agent-intelligence-contract.php'
      - '.github/workflows/customer-crm-agent-intelligence.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  customer-crm-agent-intelligence:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
          coverage: none

      - name: Syntax and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          php -l api/customer-crm-agent.php
          php -l api/brain-orchestrator.php
          php -l api/brain-events.php
          php -l includes/customer-crm-agent-extensions.php
          php -l includes/customer-crm-intelligence.php
          php -l includes/customer-crm-brain.php
          php -l includes/agent-workspace-core.php
          php -l tests/customer-crm-agent-intelligence-contract.php
          grep -q "customer_crm_agent_enhanced_handle" api/customer-crm-agent.php
          grep -q "domain'=>'customer_crm'" includes/agent-workspace-core.php
          grep -q "gac_pending_store('operations'" includes/customer-crm-agent-extensions.php
          grep -q "customer_crm_merge_brain_snapshot" api/brain-orchestrator.php
          grep -q "customer_crm_proactive_events" api/brain-events.php

      - name: Install database and run upgrader
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_crm_agent_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: CRM Agent intelligence behavior contract
        run: php tests/customer-crm-agent-intelligence-contract.php

      - name: Existing Customer CRM regression
        run: php tests/customer-crm-contract.php

      - name: Existing Native POS regression
        run: php tests/native-pos-contract.php

      - name: Agent Workspace routing regression
        run: php tests/agent-workspace-contract.php
