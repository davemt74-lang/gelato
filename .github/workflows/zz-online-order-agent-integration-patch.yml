name: Temporary Online Order Agent Integration Patch

on:
  push:
    branches: [online-order-pickup-agent-20260916]
    paths:
      - '.github/workflows/zz-online-order-agent-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-order-pickup-agent-20260916
      - name: Apply deterministic integration patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:90]!r}')
              p.write_text(s.replace(old,new,1))

          # Registry.
          replace_once('includes/agent-node-registry.php',
          "        'recipes'=>[\n            'label'=>'Recipe + Production Standards',",
          "        'online_orders'=>[\n            'label'=>'Online Ordering + Pickup Fulfillment',\n            'route'=>'api/online-order-agent.php',\n            'domain'=>'online_order_fulfillment',\n            'mode'=>'read_confirmed_write',\n        ],\n        'recipes'=>[\n            'label'=>'Recipe + Production Standards',")

          # Shared fallback routing.
          replace_once('includes/agent-workspace-core.php',
          "    $recipes='/\\b(recipe|recipes|recipe standard|recipe standards|production standard|production standards|recipe yield|recipe ingredients?|recipe instructions?|recipe method|batch formula|scale .*recipe|recipe .*scale|make .*recipe|what recipes? use|which recipes? use|recipe allergens?|allergens?.*recipe)\\b/u';\n",
          "    $recipes='/\\b(recipe|recipes|recipe standard|recipe standards|production standard|production standards|recipe yield|recipe ingredients?|recipe instructions?|recipe method|batch formula|scale .*recipe|recipe .*scale|make .*recipe|what recipes? use|which recipes? use|recipe allergens?|allergens?.*recipe)\\b/u';\n    $onlineOrders='/\\b(online orders?|pickup orders?|web orders?|pickup queue|pickup fulfillment|pickup handoff|ready for pickup|past promise|late pickup|pickup promise|order recovery|pickup recovery)\\b/u';\n")
          replace_once('includes/agent-workspace-core.php',
          "        if($pendingNode==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))return gaw_node_route('recipes','recipe_confirmation');\n",
          "        if($pendingNode==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))return gaw_node_route('recipes','recipe_confirmation');\n        if($pendingNode==='online_orders'&&(app_has_permission('online_orders.fulfill',$user)||app_has_permission('order_recovery.view',$user)||app_has_permission('order_recovery.manage',$user)||app_has_permission('order_recovery.refund',$user)||app_has_permission('pos.use',$user)||app_has_permission('kds.view',$user)||app_has_permission('crm.view',$user)))return gaw_node_route('online_orders','online_order_confirmation');\n")
          replace_once('includes/agent-workspace-core.php',
          "    if(preg_match($recipes,$text)&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))return function_exists('gaw_node_route')?gaw_node_route('recipes'):['route'=>'api/recipe-agent.php','domain'=>'recipe_production_standards'];\n",
          "    if(preg_match($recipes,$text)&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))return function_exists('gaw_node_route')?gaw_node_route('recipes'):['route'=>'api/recipe-agent.php','domain'=>'recipe_production_standards'];\n    if(preg_match($onlineOrders,$text)&&(app_has_permission('online_orders.fulfill',$user)||app_has_permission('order_recovery.view',$user)||app_has_permission('order_recovery.manage',$user)||app_has_permission('order_recovery.refund',$user)||app_has_permission('pos.use',$user)||app_has_permission('kds.view',$user)||app_has_permission('crm.view',$user)))return function_exists('gaw_node_route')?gaw_node_route('online_orders'):['route'=>'api/online-order-agent.php','domain'=>'online_order_fulfillment'];\n")

          # Main Agent workspace dispatcher.
          replace_once('api/agent-workspace.php',
          "// api/customer-crm-agent.php api/catering-agent.php api/wholesale-agent.php api/prep-intelligence-agent.php api/operations-agent.php api/kds-agent.php api/live-shift-agent.php api/front-of-house-agent.php api/equipment-agent.php api/recipe-agent.php",
          "// api/customer-crm-agent.php api/catering-agent.php api/wholesale-agent.php api/prep-intelligence-agent.php api/operations-agent.php api/kds-agent.php api/live-shift-agent.php api/front-of-house-agent.php api/equipment-agent.php api/recipe-agent.php api/online-order-agent.php")
          replace_once('api/agent-workspace.php',
          "        $isRecipesContext=$module==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user);\n        $canLiveShift=",
          "        $isRecipesContext=$module==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user);\n        $canOnlineOrders=app_has_permission('online_orders.fulfill',$user)||app_has_permission('order_recovery.view',$user)||app_has_permission('order_recovery.manage',$user)||app_has_permission('order_recovery.refund',$user)||app_has_permission('pos.use',$user)||app_has_permission('pos.manage',$user)||app_has_permission('kds.view',$user)||app_has_permission('crm.view',$user);\n        $isOnlineOrdersContext=in_array($module,['online_orders','pickup_fulfillment','order_recovery'],true)&&$canOnlineOrders;\n        $canLiveShift=")
          replace_once('api/agent-workspace.php',
          "            if($pendingNode==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))app_json_response(['ok'=>true]+gaw_node_route('recipes','recipe_confirmation'));\n",
          "            if($pendingNode==='recipes'&&app_has_permission('recipes.view',$user)&&app_has_permission('recipes.agent',$user))app_json_response(['ok'=>true]+gaw_node_route('recipes','recipe_confirmation'));\n            if($pendingNode==='online_orders'&&$canOnlineOrders)app_json_response(['ok'=>true]+gaw_node_route('online_orders','online_order_confirmation'));\n")
          replace_once('api/agent-workspace.php',
          "        if($isRecipesContext){\n            $localIntent=preg_match('/\\b(this recipe|selected recipe|ingredients?|instructions?|method|yield|scale|batch|allergen|allergens|production standards?|prep note|production note|add ingredient|add step|add instruction|active|inactive|what needs attention|what should we do|how do we make|how is this made)\\b/u',$text)===1;\n            if($localIntent||$confirmationIntent)app_json_response(['ok'=>true]+gaw_node_route('recipes','recipe_context'));\n        }\n",
          "        if($isRecipesContext){\n            $localIntent=preg_match('/\\b(this recipe|selected recipe|ingredients?|instructions?|method|yield|scale|batch|allergen|allergens|production standards?|prep note|production note|add ingredient|add step|add instruction|active|inactive|what needs attention|what should we do|how do we make|how is this made)\\b/u',$text)===1;\n            if($localIntent||$confirmationIntent)app_json_response(['ok'=>true]+gaw_node_route('recipes','recipe_context'));\n        }\n        if($isOnlineOrdersContext){\n            $localIntent=preg_match('/\\b(this order|selected order|this pickup|selected pickup|pickup|ready|readiness|payment due|paid|promise|promised|late|past promise|handed|hand off|handoff|picked up|fulfill|fulfillment|delay|recovery|exception|what needs attention|what should we do|what(?:\\x27s| is) going on)\\b/u',$text)===1;\n            if($localIntent||$confirmationIntent)app_json_response(['ok'=>true]+gaw_node_route('online_orders','online_order_context'));\n        }\n")
          replace_once('api/agent-workspace.php',
          "        $dashboardIntent=preg_match('/\\b(command center|command centre|dashboard|restaurant overview|operating snapshot|operations snapshot|location performance|compare locations?|active tables?|open (?:pos )?(?:tickets?|checks?)|online orders?|what needs attention|what is happening right now|what\\x27s happening right now|how is wholesale doing|wholesale (?:status|overview|pipeline|orders?|receivables?|accounts?|sales)|catering (?:status|overview|readiness|events?))\\b/u',$text)===1;",
          "        $onlineOrderIntent=preg_match('/\\b(online orders?|pickup orders?|web orders?|pickup queue|pickup fulfillment|pickup handoff|ready for pickup|past promise|late pickup|pickup promise|order recovery|pickup recovery)\\b/u',$text)===1;\n        if($onlineOrderIntent&&$canOnlineOrders)app_json_response(['ok'=>true]+gaw_node_route('online_orders'));\n\n        $dashboardIntent=preg_match('/\\b(command center|command centre|dashboard|restaurant overview|operating snapshot|operations snapshot|location performance|compare locations?|active tables?|open (?:pos )?(?:tickets?|checks?)|online orders?|what needs attention|what is happening right now|what\\x27s happening right now|how is wholesale doing|wholesale (?:status|overview|pipeline|orders?|receivables?|accounts?|sales)|catering (?:status|overview|readiness|events?))\\b/u',$text)===1;")

          # Brain integration.
          replace_once('api/brain-orchestrator.php',
          "require_once __DIR__.'/../includes/recipe-agent-brain.php';\n",
          "require_once __DIR__.'/../includes/recipe-agent-brain.php';\nrequire_once __DIR__.'/../includes/online-order-agent-brain.php';\n")
          old="""    $buildSnapshot=static function() use ($pdo,$user): array {
        return recipe_agent_merge_brain_snapshot(
            $pdo,
            $user,
            equipment_agent_merge_brain_snapshot(
                $pdo,
                $user,
                marketing_merge_brain_snapshot(
                    $pdo,
                    $user,
                    customer_crm_merge_brain_snapshot(
                        $pdo,
                        $user,
                        live_shift_merge_brain_snapshot($pdo,$user,agent_brain_orchestration_snapshot($pdo,$user,null))
                    )
                )
            )
        );
    };
"""
          new="""    $buildSnapshot=static function() use ($pdo,$user): array {
        return online_order_agent_merge_brain_snapshot(
            $pdo,
            $user,
            recipe_agent_merge_brain_snapshot(
                $pdo,
                $user,
                equipment_agent_merge_brain_snapshot(
                    $pdo,
                    $user,
                    marketing_merge_brain_snapshot(
                        $pdo,
                        $user,
                        customer_crm_merge_brain_snapshot(
                            $pdo,
                            $user,
                            live_shift_merge_brain_snapshot($pdo,$user,agent_brain_orchestration_snapshot($pdo,$user,null))
                        )
                    )
                )
            )
        );
    };
"""
          replace_once('api/brain-orchestrator.php',old,new)
          replace_once('api/brain-orchestrator.php',"'recipesIntegrated'=>true]","'recipesIntegrated'=>true,'onlineOrdersIntegrated'=>true]")

          shared='<script src="js/agent-page-context.js?v=20260916-1"></script><script src="js/online-order-agent-context.js?v=20260916-1"></script><script src="js/global-agent.js?v=20260916-1"></script><script src="js/dynamic-agent-canvas.js?v=20260916-1"></script>'
          replace_once('pickup-fulfillment.php','<script src="js/pickup-fulfillment.js?v=20260915-2"></script>','<script src="js/pickup-fulfillment.js?v=20260915-2"></script>'+shared)
          replace_once('order-recovery.php','<script src="js/order-recovery.js?v=20260915-1"></script>','<script src="js/order-recovery.js?v=20260915-1"></script>'+shared)
          replace_once('online-orders-admin.php','</main><script src="js/universal-admin-page-shell.js?v=20260915-1"></script>','</main>'+shared+'<script src="js/universal-admin-page-shell.js?v=20260915-1"></script>')
          replace_once('online-orders-admin.php','<select name="location"><option value="0">All locations</option>','<select name="location" id="locationFilter"><option value="0">All locations</option>')
          replace_once('online-orders-admin.php','<?php foreach($orders as $order):?><tr><td class="admin-order-name">','<?php foreach($orders as $order):?><tr data-order="<?=app_escape((string)$order[\'order_public_id\'])?>"><td class="admin-order-name">')
          replace_once('online-orders-admin.php','<?php foreach($orders as $order):?><article class="admin-order-card">','<?php foreach($orders as $order):?><article class="admin-order-card" data-order="<?=app_escape((string)$order[\'order_public_id\'])?>">')

          # Brain workflow coverage.
          p=Path('.github/workflows/agent-brain-orchestration.yml'); s=p.read_text()
          s=s.replace("      - 'api/recipe-agent.php'\n", "      - 'api/recipe-agent.php'\n      - 'api/online-order-agent.php'\n", 2)
          s=s.replace("      - 'includes/recipe-agent-brain.php'\n", "      - 'includes/recipe-agent-brain.php'\n      - 'includes/online-order-agent-core.php'\n      - 'includes/online-order-agent-brain.php'\n", 2)
          s=s.replace("      - 'js/recipe-agent-context.js'\n", "      - 'js/recipe-agent-context.js'\n      - 'js/online-order-agent-context.js'\n", 2)
          s=s.replace("          php -l api/recipe-agent.php\n", "          php -l api/recipe-agent.php\n          php -l api/online-order-agent.php\n", 1)
          s=s.replace("          php -l includes/recipe-agent-brain.php\n", "          php -l includes/recipe-agent-brain.php\n          php -l includes/online-order-agent-core.php\n          php -l includes/online-order-agent-brain.php\n", 1)
          s=s.replace("          node --check js/recipe-agent-context.js\n", "          node --check js/recipe-agent-context.js\n          node --check js/online-order-agent-context.js\n", 1)
          marker="      - name: Command Center regression\n"
          if marker not in s: raise SystemExit('agent brain workflow integration marker missing')
          s=s.replace(marker,"      - name: Online Order Brain integration contract\n        run: |\n          grep -F \"require_once __DIR__.'/../includes/online-order-agent-brain.php';\" api/brain-orchestrator.php\n          grep -F 'online_order_agent_merge_brain_snapshot' api/brain-orchestrator.php\n          grep -F \"'node'=>'online_orders'\" includes/online-order-agent-brain.php\n"+marker,1)
          p.write_text(s)

          # Production runtime closure.
          p=Path('.github/workflows/production-runtime-deploy.yml'); s=p.read_text()
          s=s.replace("      - 'recipes.php'\n", "      - 'recipes.php'\n      - 'online-orders-admin.php'\n      - 'pickup-fulfillment.php'\n      - 'order-recovery.php'\n",1)
          for occurrence in range(2):
              needle="            recipes.php\n"
              idx=s.find(needle)
              if idx<0: raise SystemExit('deploy recipes.php required marker missing')
              s=s[:idx]+s[idx:].replace(needle,needle+"            online-orders-admin.php\n            pickup-fulfillment.php\n            order-recovery.php\n",1)
          for occurrence in range(2):
              needle="            js/recipe-agent-context.js\n"
              idx=s.find(needle)
              if idx<0: raise SystemExit('deploy recipe context marker missing')
              s=s[:idx]+s[idx:].replace(needle,needle+"            js/online-order-agent-context.js\n",1)
          for occurrence in range(2):
              needle="            api/recipe-agent.php\n"
              idx=s.find(needle)
              if idx<0: raise SystemExit('deploy recipe api marker missing')
              s=s[:idx]+s[idx:].replace(needle,needle+"            api/online-order-agent.php\n",1)
          for occurrence in range(2):
              needle="            includes/recipe-agent-brain.php\n"
              idx=s.find(needle)
              if idx<0: raise SystemExit('deploy recipe brain marker missing')
              s=s[:idx]+s[idx:].replace(needle,needle+"            includes/online-order-agent-core.php\n            includes/online-order-agent-brain.php\n",1)
          s=s.replace("          php -l recipes.php\n","          php -l recipes.php\n          php -l online-orders-admin.php\n          php -l pickup-fulfillment.php\n          php -l order-recovery.php\n",1)
          s=s.replace("          php -l api/recipe-agent.php\n","          php -l api/recipe-agent.php\n          php -l api/online-order-agent.php\n",1)
          s=s.replace("          php -l includes/recipe-agent-brain.php\n","          php -l includes/recipe-agent-brain.php\n          php -l includes/online-order-agent-core.php\n          php -l includes/online-order-agent-brain.php\n",1)
          s=s.replace("          node --check js/recipe-agent-context.js\n","          node --check js/recipe-agent-context.js\n          node --check js/online-order-agent-context.js\n",1)
          s=s.replace('Recipe + Production Standards Agent, and workspace.php','Recipe + Production Standards Agent, Online Ordering + Pickup Fulfillment Agent, and workspace.php',1)
          p.write_text(s)

          Path('.github/workflows/zz-online-order-agent-integration-patch.yml').unlink()
          PY
      - name: Validate patched source
        run: |
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l online-orders-admin.php
          php -l pickup-fulfillment.php
          php -l order-recovery.php
          php -l includes/online-order-agent-core.php
          php -l includes/online-order-agent-brain.php
          php -l api/online-order-agent.php
          node --check js/online-order-agent-context.js
          python3 - <<'PY'
          import yaml
          for path in ['.github/workflows/agent-brain-orchestration.yml','.github/workflows/production-runtime-deploy.yml','.github/workflows/online-order-pickup-agent.yml']:
              yaml.safe_load(open(path))
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate online order Agent across workspace and deploy"
          git push origin HEAD:online-order-pickup-agent-20260916
