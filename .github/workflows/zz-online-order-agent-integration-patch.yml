name: Temporary Online Order Agent Integration Patch

on:
  push:
    branches: [online-order-pickup-agent-20260916]
    paths:
      - '.github/workflows/zz-online-order-agent-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-order-pickup-agent-20260916
      - name: Apply deterministic integration patch
        shell: bash
        run: |
          echo '      iIiIpCg== ' | tr -d ' ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate patched source
        run: |
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l online-orders-admin.php
          php -l pickup-fulfillment.php
          php -l order-recovery.php
          php -l includes/online-order-agent-core.php
          php -l includes/online-order-agent-brain.php
          php -l api/online-order-agent.php
          node --check js/online-order-agent-context.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate online order Agent across workspace and deploy"
          git push origin HEAD:online-order-pickup-agent-20260916
