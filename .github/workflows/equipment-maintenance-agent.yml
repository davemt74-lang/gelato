name: Equipment + Maintenance Agent

on:
  pull_request:
    paths:
      - 'api/equipment-agent.php'
      - 'api/agent-workspace.php'
      - 'api/brain-orchestrator.php'
      - 'api/daily-manager-agent.php'
      - 'includes/equipment-agent-core.php'
      - 'includes/equipment-agent-brain.php'
      - 'includes/equipment-brain.php'
      - 'includes/agent-node-registry.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-confirmation-core.php'
      - 'js/equipment-agent-context.js'
      - 'js/agent-page-context.js'
      - 'js/global-agent.js'
      - 'equipment.php'
      - 'equipment-detail.php'
      - 'tests/equipment-agent-db-lifecycle.php'
      - '.github/workflows/equipment-maintenance-agent.yml'
  push:
    branches: [ main ]
    paths:
      - 'api/equipment-agent.php'
      - 'api/agent-workspace.php'
      - 'api/brain-orchestrator.php'
      - 'api/daily-manager-agent.php'
      - 'includes/equipment-agent-core.php'
      - 'includes/equipment-agent-brain.php'
      - 'includes/equipment-brain.php'
      - 'includes/agent-node-registry.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-confirmation-core.php'
      - 'js/equipment-agent-context.js'
      - 'js/agent-page-context.js'
      - 'js/global-agent.js'
      - 'equipment.php'
      - 'equipment-detail.php'
      - 'tests/equipment-agent-db-lifecycle.php'
      - '.github/workflows/equipment-maintenance-agent.yml'

permissions:
  contents: read

jobs:
  equipment-agent:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: gelato_restaurant_ai_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: PHP syntax
        run: |
          php -l api/equipment-agent.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l api/daily-manager-agent.php
          php -l includes/equipment-agent-core.php
          php -l includes/equipment-agent-brain.php
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l tests/equipment-agent-db-lifecycle.php
      - name: JavaScript syntax
        run: |
          node --check js/equipment-agent-context.js
          node --check js/agent-page-context.js
          node --check js/global-agent.js
      - name: Equipment routing and safety contract
        run: |
          grep -F "'equipment'=>[" includes/agent-node-registry.php
          grep -F "'route'=>'api/equipment-agent.php'" includes/agent-node-registry.php
          grep -F "gac_pending_store('equipment'" includes/equipment-agent-core.php
          grep -F "SELECT * FROM equipment_assets WHERE organization_id=? AND public_id=?" includes/equipment-agent-core.php
          grep -F "equipment_agent_assert_fresh" includes/equipment-agent-core.php
          grep -F "equipment_agent_merge_brain_snapshot" api/brain-orchestrator.php
          grep -F "'node'=>'purchasing'" includes/equipment-agent-core.php
          grep -F 'js/equipment-agent-context.js' equipment.php
          grep -F 'js/global-agent.js' equipment.php
          grep -F 'data-agent-prompt=' equipment.php
          grep -F 'sync: publish' js/equipment-agent-context.js
          grep -F '$isEquipmentContext=' api/agent-workspace.php
          grep -F "gaw_node_route('equipment','equipment_context')" api/agent-workspace.php
          if grep -Eq "INSERT INTO purchase_orders|UPDATE purchase_orders|DELETE FROM purchase_orders" includes/equipment-agent-core.php; then
            echo 'Equipment Agent must not mutate purchasing records directly.' >&2
            exit 1
          fi
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_equipment_agent_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->ensureTrackingTables();
          $service->bootstrapLegacyHistory(null);
          $service->applyPending(null);
          if($service->pendingMigrations()) exit(1);
          PHP
      - name: DB-backed Propose Confirm Execute lifecycle
        run: php tests/equipment-agent-db-lifecycle.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->assertAppliedChecksumsUnchanged();
          if($service->pendingMigrations()) exit(2);
          if($service->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP