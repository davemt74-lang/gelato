name: Publish Food Monster B8D8 Direct Deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-food-monster-b8d8-direct.yml
  pull_request:
    paths:
      - .github/workflows/publish-food-monster-b8d8-direct.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-certified-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify release build reference
        run: test -n 'a4e072bdf1bef561963368f2e974474e7380d3f2'
      - name: Download exact merged-main full deployment
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download 40130977219 --repo davemt74-lang/gelato --name gelato-full-deploy --dir payload
          test -s payload/gelato-full-deploy.zip
          test -s payload/gelato-full-deploy.sha256

      - name: Verify archive, checksum, commit and root-level app layout
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          expected="$(sed -nE 's/^([0-9a-f]{64})[[:space:]]+.*gelato-full-deploy\.zip$/\1/p' gelato-full-deploy.sha256)"
          test "${#expected}" -eq 64
          printf '%s  gelato-full-deploy.zip\n' "$expected" | sha256sum --check -
          printf '%s  gelato-full-deploy.zip\n' "$expected" > gelato-full-deploy.sha256
          unzip -tq gelato-full-deploy.zip
          unzip -p gelato-full-deploy.zip DEPLOY_SHA.txt | grep -Fx 'a4e072bdf1bef561963368f2e974474e7380d3f2'
          for file in index.php upgrade.php api/agent-workspace.php config/food-monster-capability-map.json config/.htaccess tests/food-monster-b8d8-vision-actions.php includes/food-monster-b8d8-vision-actions.php database/20261217_food_monster_b8d8_action_receipts.sql includes/food-monster-b8d3-tool-runtime.php api/food-monster-llm.php; do
            unzip -Z1 gelato-full-deploy.zip | grep -Fx "$file"
          done
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(config\.php$|\.env$|uploads/|storage/)'; then
            echo 'Deployment archive includes a private live path.'
            exit 1
          fi
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(gelato-full-deploy\.zip|deploy\.zip|package\.zip)$'; then
            echo 'Nested deployment ZIP detected.'
            exit 1
          fi

      - name: Publish one direct-download ZIP and checksum
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create gelato-food-monster-b8d8 \
            payload/gelato-full-deploy.zip \
            payload/gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target a4e072bdf1bef561963368f2e974474e7380d3f2 \
            --title 'Gelato Food Monster B8D8 — Governed Vision Lab Routine Actions' \
            --notes 'Verified full single ZIP from merged Gelato main (FM-B8D8). Food Monster Agent Chat may now list Vision Lab missions and datasets, create collection missions, and create DRAFT dataset versions through existing PHP Vision Lab services when the signed-in user has glasses.view and glasses.manage. Every routine write checks active membership, most recent canonical typed or verified same-user voice chat, fresh authority at execution, tenant boundaries, and a durable request receipt to prevent duplicate creations. Camera/device management, dataset freeze, sample approval and model release remain outside these routine skills and retain existing approval controls. Private Vision Lab results stay on the Gelato server, not returned to the AI provider. Includes previous B8D3-B8D7 capabilities. Deploy the ZIP into Gelato app root preserving config.php, .env, uploads and storage; run upgrade.php to apply the action-receipts migration, then hard-refresh. SHA-256 manifest separate. No nested ZIP.'
