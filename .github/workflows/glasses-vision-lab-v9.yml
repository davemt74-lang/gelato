name: AR Glasses Vision Lab V9 Kitchen Intelligence

on:
  pull_request:
    paths:
      - 'database/20261117_vision_lab_v9_live_scene_understanding.sql'
      - 'database/20261118_vision_lab_v9_recipe_step_recognition.sql'
      - 'includes/glasses-vision-scene.php'
      - 'includes/glasses-vision-step-recognition.php'
      - 'api/glasses-device.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'assets/js/glasses-vision-scene.js'
      - 'assets/js/glasses-vision-step-recognition.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'tests/glasses-vision-lab-v9-live-scene-understanding-contract.php'
      - 'tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php'
      - 'docs/GLASSES-VISION-LAB-V9-LIVE-SCENE.md'
      - 'docs/GLASSES-VISION-LAB-V9-RECIPE-STEP-RECOGNITION.md'
      - '.github/workflows/glasses-vision-lab-v9.yml'
  push:
    branches: [main]

jobs:
  vision-lab-v9-scene:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l includes/glasses-vision-scene.php
          php -l includes/glasses-vision-step-recognition.php
          php -l api/glasses-device.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-vision-lab-v9-live-scene-understanding-contract.php
          php -l tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php
          node --check assets/js/glasses-vision-scene.js
          node --check assets/js/glasses-vision-step-recognition.js

      - name: Architecture guardrails
        run: |
          grep -q 'CREATE TABLE glasses_vision_scene_snapshots' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q 'CREATE TABLE glasses_vision_scene_entities' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q 'source_type VARCHAR(32)' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q "glasses-vision-lineage.php" includes/glasses-vision-scene.php
          grep -q 'function glasses_vision_scene_capture' includes/glasses-vision-scene.php
          grep -q 'Live scene frame is stale' includes/glasses-vision-scene.php
          grep -q 'buildContextHash' includes/glasses-vision-scene.php
          grep -q 'Scene tracking IDs must be unique' includes/glasses-vision-scene.php
          grep -q 'function glasses_vision_scene_verify' includes/glasses-vision-scene.php
          grep -q 'reserved_for_v9_section_2' includes/glasses-vision-scene.php
          grep -q 'glasses_vision_profile_for_build' includes/glasses-vision-scene.php
          grep -q 'Vision Label Profile' includes/glasses-vision-scene.php
          grep -q 'normalized_label VARCHAR(180)' database/20261117_vision_lab_v9_live_scene_understanding.sql
          ! grep -q "'operator'" includes/glasses-vision-scene.php
          grep -q 'vision.scene.capture' api/glasses-device.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-scene.php
          ! grep -q 'kds_transition' includes/glasses-vision-scene.php
          ! grep -q 'glasses_vision_model_rollout_rollback' includes/glasses-vision-scene.php
          grep -q 'CREATE TABLE glasses_vision_step_recognitions' database/20261118_vision_lab_v9_recipe_step_recognition.sql
          grep -q 'function glasses_vision_step_recognize' includes/glasses-vision-step-recognition.php
          grep -q 'function glasses_vision_step_verify' includes/glasses-vision-step-recognition.php
          grep -q "'recognizedMin'=>0.65" includes/glasses-vision-step-recognition.php
          grep -q "'recognizedMarginMin'=>0.12" includes/glasses-vision-step-recognition.php
          grep -q "'advancesRecipeStep'=>false" includes/glasses-vision-step-recognition.php
          grep -q 'current canonical build state' includes/glasses-vision-step-recognition.php
          grep -q 'vision.step.recognize' api/glasses-device.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-step-recognition.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-step-recognition.php
          ! grep -q 'kds_transition' includes/glasses-vision-step-recognition.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: V9 live scene understanding contract
        run: php tests/glasses-vision-lab-v9-live-scene-understanding-contract.php

      - name: V9 recipe step recognition contract
        run: php tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php

      - name: V8 governance regressions
        run: |
          php tests/glasses-vision-lab-v8-production-model-health-contract.php
          php tests/glasses-vision-lab-v8-context-aware-drift-contract.php
          php tests/glasses-vision-lab-v8-calibration-profile-runtime-contract.php
          php tests/glasses-vision-lab-v8-adaptive-confidence-policy-contract.php
          php tests/glasses-vision-lab-v8-active-perception-recovery-contract.php
          php tests/glasses-vision-lab-v8-fleet-health-rollback-contract.php
          php tests/glasses-vision-lab-v8-production-autonomy-audit-contract.php

      - name: Build, calibration and rollout regressions
        run: |
          php tests/glasses-build-session-contract.php
          php tests/glasses-station-calibration-contract.php
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-vision-model-rollout-contract.php
          php tests/kds-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
