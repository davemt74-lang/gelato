name: AR Glasses Vision Lab V9 Kitchen Intelligence

on:
  pull_request:
    paths:
      - 'database/20261117_vision_lab_v9_live_scene_understanding.sql'
      - 'database/20261118_vision_lab_v9_recipe_step_recognition.sql'
      - 'database/20261119_vision_lab_v9_ingredient_prevention.sql'
      - 'database/20261120_vision_lab_v9_quantity_verification.sql'
      - 'database/20261121_vision_lab_v9_quality_verification.sql'
      - 'database/20261122_vision_lab_v9_final_product_validation.sql'
      - 'database/20261123_vision_lab_v9_human_handoff_confirmation.sql'
      - 'database/20261124_vision_lab_v9_rework_revalidation.sql'
      - 'database/20261125_vision_lab_v9_kitchen_outcomes.sql'
      - 'includes/glasses-vision-scene.php'
      - 'includes/glasses-vision-step-recognition.php'
      - 'includes/glasses-vision-ingredient-prevention.php'
      - 'includes/glasses-vision-quantity-verification.php'
      - 'includes/glasses-vision-quality-verification.php'
      - 'includes/glasses-vision-final-validation.php'
      - 'includes/glasses-vision-handoff-confirmation.php'
      - 'includes/glasses-vision-rework.php'
      - 'includes/glasses-vision-kitchen-outcomes.php'
      - 'api/glasses-device.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'assets/js/glasses-vision-scene.js'
      - 'assets/js/glasses-vision-step-recognition.js'
      - 'assets/js/glasses-vision-ingredient-prevention.js'
      - 'assets/js/glasses-vision-quantity-verification.js'
      - 'assets/js/glasses-vision-quality-verification.js'
      - 'assets/js/glasses-vision-final-validation.js'
      - 'assets/js/glasses-vision-handoff-confirmation.js'
      - 'assets/js/glasses-vision-rework.js'
      - 'assets/js/glasses-vision-kitchen-outcomes.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'tests/glasses-vision-lab-v9-live-scene-understanding-contract.php'
      - 'tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php'
      - 'tests/glasses-vision-lab-v9-ingredient-prevention-contract.php'
      - 'tests/glasses-vision-lab-v9-quantity-verification-contract.php'
      - 'tests/glasses-vision-lab-v9-quality-verification-contract.php'
      - 'tests/glasses-vision-lab-v9-final-product-validation-contract.php'
      - 'tests/glasses-vision-lab-v9-human-handoff-confirmation-contract.php'
      - 'tests/glasses-vision-lab-v9-rework-revalidation-contract.php'
      - 'tests/glasses-vision-lab-v9-kitchen-outcomes-contract.php'
      - 'docs/GLASSES-VISION-LAB-V9-LIVE-SCENE.md'
      - 'docs/GLASSES-VISION-LAB-V9-RECIPE-STEP-RECOGNITION.md'
      - 'docs/GLASSES-VISION-LAB-V9-INGREDIENT-PREVENTION.md'
      - 'docs/GLASSES-VISION-LAB-V9-QUANTITY-VERIFICATION.md'
      - 'docs/GLASSES-VISION-LAB-V9-QUALITY-VERIFICATION.md'
      - 'docs/GLASSES-VISION-LAB-V9-FINAL-PRODUCT-VALIDATION.md'
      - 'docs/GLASSES-VISION-LAB-V9-HUMAN-HANDOFF-CONFIRMATION.md'
      - 'docs/GLASSES-VISION-LAB-V9-REWORK-REVALIDATION.md'
      - 'docs/GLASSES-VISION-LAB-V9-KITCHEN-OUTCOMES.md'
      - '.github/workflows/glasses-vision-lab-v9.yml'
  push:
    branches: [main]

jobs:
  vision-lab-v9-scene:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l includes/glasses-vision-scene.php
          php -l includes/glasses-vision-step-recognition.php
          php -l includes/glasses-vision-ingredient-prevention.php
          php -l includes/glasses-vision-quantity-verification.php
          php -l includes/glasses-vision-quality-verification.php
          php -l includes/glasses-vision-final-validation.php
          php -l includes/glasses-vision-handoff-confirmation.php
          php -l includes/glasses-vision-rework.php
          php -l includes/glasses-vision-kitchen-outcomes.php
          php -l api/glasses-device.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-vision-lab-v9-live-scene-understanding-contract.php
          php -l tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php
          php -l tests/glasses-vision-lab-v9-ingredient-prevention-contract.php
          php -l tests/glasses-vision-lab-v9-quantity-verification-contract.php
          php -l tests/glasses-vision-lab-v9-quality-verification-contract.php
          php -l tests/glasses-vision-lab-v9-final-product-validation-contract.php
          php -l tests/glasses-vision-lab-v9-human-handoff-confirmation-contract.php
          php -l tests/glasses-vision-lab-v9-rework-revalidation-contract.php
          php -l tests/glasses-vision-lab-v9-kitchen-outcomes-contract.php
          node --check assets/js/glasses-vision-scene.js
          node --check assets/js/glasses-vision-step-recognition.js
          node --check assets/js/glasses-vision-ingredient-prevention.js
          node --check assets/js/glasses-vision-quantity-verification.js
          node --check assets/js/glasses-vision-quality-verification.js
          node --check assets/js/glasses-vision-final-validation.js
          node --check assets/js/glasses-vision-handoff-confirmation.js
          node --check assets/js/glasses-vision-rework.js
          node --check assets/js/glasses-vision-kitchen-outcomes.js

      - name: Architecture guardrails
        run: |
          grep -q 'CREATE TABLE glasses_vision_scene_snapshots' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q 'CREATE TABLE glasses_vision_scene_entities' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q 'source_type VARCHAR(32)' database/20261117_vision_lab_v9_live_scene_understanding.sql
          grep -q "glasses-vision-lineage.php" includes/glasses-vision-scene.php
          grep -q 'function glasses_vision_scene_capture' includes/glasses-vision-scene.php
          grep -q 'Live scene frame is stale' includes/glasses-vision-scene.php
          grep -q 'buildContextHash' includes/glasses-vision-scene.php
          grep -q 'Scene tracking IDs must be unique' includes/glasses-vision-scene.php
          grep -q 'function glasses_vision_scene_verify' includes/glasses-vision-scene.php
          grep -q 'reserved_for_v9_section_2' includes/glasses-vision-scene.php
          grep -q 'glasses_vision_profile_for_build' includes/glasses-vision-scene.php
          grep -q 'Vision Label Profile' includes/glasses-vision-scene.php
          grep -q 'normalized_label VARCHAR(180)' database/20261117_vision_lab_v9_live_scene_understanding.sql
          ! grep -q "'operator'" includes/glasses-vision-scene.php
          grep -q 'vision.scene.capture' api/glasses-device.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-scene.php
          ! grep -q 'kds_transition' includes/glasses-vision-scene.php
          ! grep -q 'glasses_vision_model_rollout_rollback' includes/glasses-vision-scene.php
          grep -q 'CREATE TABLE glasses_vision_step_recognitions' database/20261118_vision_lab_v9_recipe_step_recognition.sql
          grep -q 'function glasses_vision_step_recognize' includes/glasses-vision-step-recognition.php
          grep -q 'function glasses_vision_step_verify' includes/glasses-vision-step-recognition.php
          grep -q "'recognizedMin'=>0.65" includes/glasses-vision-step-recognition.php
          grep -q "'recognizedMarginMin'=>0.12" includes/glasses-vision-step-recognition.php
          grep -q "'advancesRecipeStep'=>false" includes/glasses-vision-step-recognition.php
          grep -q 'current canonical build state' includes/glasses-vision-step-recognition.php
          grep -q 'vision.step.recognize' api/glasses-device.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-step-recognition.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-step-recognition.php
          ! grep -q 'kds_transition' includes/glasses-vision-step-recognition.php
          grep -q 'CREATE TABLE glasses_vision_ingredient_preventions' database/20261119_vision_lab_v9_ingredient_prevention.sql
          grep -q 'result_json JSON NOT NULL' database/20261119_vision_lab_v9_ingredient_prevention.sql
          grep -q 'function glasses_vision_ingredient_guard_assess' includes/glasses-vision-ingredient-prevention.php
          grep -q "'unknownIngredientMin'=>0.82" includes/glasses-vision-ingredient-prevention.php
          grep -q "'blocksBuildState'=>false" includes/glasses-vision-ingredient-prevention.php
          grep -q 'current canonical build state' includes/glasses-vision-ingredient-prevention.php
          grep -q 'vision.ingredient_guard.assess' api/glasses-device.php
          grep -q 'ingredient_guard.assess' api/glasses-vision-lab.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-ingredient-prevention.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-ingredient-prevention.php
          ! grep -q 'kds_transition' includes/glasses-vision-ingredient-prevention.php
          ! grep -q 'glasses_build_complete' includes/glasses-vision-ingredient-prevention.php
          grep -q 'CREATE TABLE glasses_vision_quantity_verifications' database/20261120_vision_lab_v9_quantity_verification.sql
          grep -q 'function glasses_vision_quantity_verify_scene' includes/glasses-vision-quantity-verification.php
          grep -q "'minimumConfidence'=>0.75" includes/glasses-vision-quantity-verification.php
          grep -q "'changesDetectedQuantity'=>false" includes/glasses-vision-quantity-verification.php
          grep -q 'current canonical build state' includes/glasses-vision-quantity-verification.php
          grep -q 'vision.quantity.verify_scene' api/glasses-device.php
          grep -q 'quantity.verify_scene' api/glasses-vision-lab.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-quantity-verification.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-quantity-verification.php
          ! grep -q 'kds_transition' includes/glasses-vision-quantity-verification.php
          ! grep -q 'glasses_build_complete' includes/glasses-vision-quantity-verification.php
          grep -q 'CREATE TABLE glasses_vision_quality_verifications' database/20261121_vision_lab_v9_quality_verification.sql
          grep -q 'function glasses_vision_quality_verify_scene' includes/glasses-vision-quality-verification.php
          grep -q 'verified_build_quality_as' includes/glasses-vision-quality-verification.php
          grep -q 'vision.quality.verify_scene' api/glasses-device.php
          grep -q 'quality.verify_scene' api/glasses-vision-lab.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-quality-verification.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-quality-verification.php
          ! grep -q 'kds_transition' includes/glasses-vision-quality-verification.php
          ! grep -q 'glasses_build_complete' includes/glasses-vision-quality-verification.php
          grep -q 'CREATE TABLE glasses_vision_final_validations' database/20261122_vision_lab_v9_final_product_validation.sql
          grep -q 'function glasses_vision_final_validate_scene' includes/glasses-vision-final-validation.php
          grep -q 'validated_final_product_as' includes/glasses-vision-final-validation.php
          grep -q 'vision.final.validate_scene' api/glasses-device.php
          grep -q 'final.validate_scene' api/glasses-vision-lab.php
          ! grep -q 'glasses_build_confirm' includes/glasses-vision-final-validation.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-final-validation.php
          ! grep -q 'glasses_build_complete' includes/glasses-vision-final-validation.php
          ! grep -q 'kds_transition' includes/glasses-vision-final-validation.php
          grep -q 'CREATE TABLE glasses_vision_handoff_confirmations' database/20261123_vision_lab_v9_human_handoff_confirmation.sql
          grep -q 'function glasses_vision_handoff_confirm' includes/glasses-vision-handoff-confirmation.php
          grep -q 'glasses_handoff_to_expo' includes/glasses-vision-handoff-confirmation.php
          grep -q 'vision.handoff.confirm' api/glasses-device.php
          grep -q 'explicitHumanConfirmation' includes/glasses-vision-handoff-confirmation.php
          ! grep -q 'kds_transition(' includes/glasses-vision-handoff-confirmation.php
          grep -q 'CREATE TABLE glasses_vision_rework_cases' database/20261124_vision_lab_v9_rework_revalidation.sql
          grep -q 'CREATE TABLE glasses_vision_rework_attempts' database/20261124_vision_lab_v9_rework_revalidation.sql
          grep -q 'function glasses_vision_rework_revalidate' includes/glasses-vision-rework.php
          grep -q 'revalidated_as' includes/glasses-vision-rework.php
          grep -q 'vision.rework.open' api/glasses-device.php
          grep -q 'vision.rework.revalidate' api/glasses-device.php
          ! grep -q 'kds_transition(' includes/glasses-vision-rework.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-vision-rework.php
          grep -q 'CREATE TABLE glasses_vision_kitchen_outcomes' database/20261125_vision_lab_v9_kitchen_outcomes.sql
          grep -q 'function glasses_vision_kitchen_outcome_sync' includes/glasses-vision-kitchen-outcomes.php
          grep -q 'observed_as_kitchen_outcome' includes/glasses-vision-kitchen-outcomes.php
          grep -q 'outcomes.sync' api/glasses-vision-lab.php
          ! grep -q 'glasses_vision_retraining_' includes/glasses-vision-kitchen-outcomes.php
          ! grep -q 'glasses_vision_promotion_' includes/glasses-vision-kitchen-outcomes.php
          ! grep -q 'glasses_vision_feedback_record(' includes/glasses-vision-kitchen-outcomes.php
          ! grep -q 'kds_transition(' includes/glasses-vision-kitchen-outcomes.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: V9 live scene understanding contract
        run: php tests/glasses-vision-lab-v9-live-scene-understanding-contract.php

      - name: V9 recipe step recognition contract
        run: php tests/glasses-vision-lab-v9-recipe-step-recognition-contract.php

      - name: V9 missing / wrong ingredient prevention contract
        run: php tests/glasses-vision-lab-v9-ingredient-prevention-contract.php

      - name: V9 portion / quantity verification contract
        run: php tests/glasses-vision-lab-v9-quantity-verification-contract.php

      - name: V9 build quality / placement verification contract
        run: php tests/glasses-vision-lab-v9-quality-verification-contract.php

      - name: V9 final product validation contract
        run: php tests/glasses-vision-lab-v9-final-product-validation-contract.php

      - name: V9 governed human handoff confirmation contract
        run: php tests/glasses-vision-lab-v9-human-handoff-confirmation-contract.php

      - name: V9 exception recovery / rework / revalidation contract
        run: php tests/glasses-vision-lab-v9-rework-revalidation-contract.php

      - name: V9 production learning from kitchen outcomes contract
        run: php tests/glasses-vision-lab-v9-kitchen-outcomes-contract.php

      - name: V8 governance regressions
        run: |
          php tests/glasses-vision-lab-v8-production-model-health-contract.php
          php tests/glasses-vision-lab-v8-context-aware-drift-contract.php
          php tests/glasses-vision-lab-v8-calibration-profile-runtime-contract.php
          php tests/glasses-vision-lab-v8-adaptive-confidence-policy-contract.php
          php tests/glasses-vision-lab-v8-active-perception-recovery-contract.php
          php tests/glasses-vision-lab-v8-fleet-health-rollback-contract.php
          php tests/glasses-vision-lab-v8-production-autonomy-audit-contract.php

      - name: Build, calibration and rollout regressions
        run: |
          php tests/glasses-build-session-contract.php
          php tests/glasses-station-calibration-contract.php
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-vision-model-rollout-contract.php
          php tests/kds-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
