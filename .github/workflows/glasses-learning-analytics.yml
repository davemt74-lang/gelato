name: AR Glasses Vision Learning Analytics

on:
  pull_request:
    paths:
      - 'api/glasses-learning.php'
      - 'glasses-learning.php'
      - 'includes/glasses-learning.php'
      - 'includes/admin-control-core.php'
      - 'assets/js/glasses-learning.js'
      - 'assets/css/glasses-learning.css'
      - 'tests/glasses-learning-analytics-contract.php'
      - 'docs/GLASSES-VISION-LEARNING.md'
      - '.github/workflows/glasses-learning-analytics.yml'
  push:
    branches: [main, 'feature/glasses-learning-analytics']

jobs:
  glasses-learning-analytics:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          php -l api/glasses-learning.php
          php -l glasses-learning.php
          php -l includes/glasses-learning.php
          php -l includes/admin-control-core.php
          php -l tests/glasses-learning-analytics-contract.php
          node --check assets/js/glasses-learning.js

      - name: Architecture contract
        run: |
          grep -q 'function glasses_learning_analytics' includes/glasses-learning.php
          grep -q 'function glasses_learning_dataset' includes/glasses-learning.php
          grep -q 'uncorrectedDoesNotMeanVerifiedCorrect' includes/glasses-learning.php
          grep -q 'gelato.ar_learning.v1' includes/glasses-learning.php
          grep -q 'gelato.ar_learning_dataset.v1' includes/glasses-learning.php
          grep -q 'humanCorrectionRate' includes/glasses-learning.php
          grep -q 'confidenceBands' includes/glasses-learning.php
          grep -q "view==='dataset'" api/glasses-learning.php
          grep -q 'application/x-ndjson' api/glasses-learning.php
          grep -q 'X-Gelato-Dataset-Hash' api/glasses-learning.php
          grep -q 'glasses.manage' api/glasses-learning.php
          grep -q 'AR Vision Learning' glasses-learning.php
          grep -q 'glasses-learning.php' includes/admin-control-core.php
          ! grep -q "'bbox'=>" includes/glasses-learning.php
          ! grep -q 'image_data' includes/glasses-learning.php
          ! grep -q 'kds_transition' includes/glasses-learning.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Vision learning analytics behavioral contract
        run: php tests/glasses-learning-analytics-contract.php

      - name: Existing glasses + KDS regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/glasses-work-api-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-build-definition-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/glasses-expo-handoff-contract.php
          php tests/glasses-station-calibration-contract.php
          php tests/glasses-transfer-sequence-contract.php
          php tests/glasses-calibration-studio-contract.php
          node tests/glasses-calibration-geometry.test.js
          php tests/glasses-observation-corrections-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
