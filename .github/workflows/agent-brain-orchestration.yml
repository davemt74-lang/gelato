name: Agent Brain Orchestration

on:
  pull_request:
    paths:
      - 'api/brain-orchestrator.php'
      - 'api/brain-events.php'
      - 'api/admin-dashboard-agent.php'
      - 'api/agent-workspace.php'
      - 'api/equipment-agent.php'
      - 'api/recipe-agent.php'
      - 'api/online-order-agent.php'
      - 'api/daily-manager-agent.php'
      - 'includes/agent-brain-orchestrator.php'
      - 'includes/agent-node-registry.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/equipment-agent-core.php'
      - 'includes/equipment-agent-brain.php'
      - 'includes/equipment-brain.php'
      - 'includes/recipe-agent-core.php'
      - 'includes/recipe-agent-brain.php'
      - 'includes/online-order-agent-core.php'
      - 'includes/online-order-agent-brain.php'
      - 'js/agent-next-moves.js'
      - 'js/global-add-canvas.js'
      - 'js/equipment-agent-context.js'
      - 'js/recipe-agent-context.js'
      - 'js/online-order-agent-context.js'
      - 'equipment.php'
      - 'equipment-detail.php'
      - 'recipes.php'
      - 'tests/agent-brain-orchestration-contract.php'
      - 'tests/admin-command-dashboard-contract.php'
      - 'tests/workspace-dynamic-agent-canvas-contract.php'
      - '.github/workflows/agent-brain-orchestration.yml'
  push:
    branches: [main]

jobs:
  brain-orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
      - name: Syntax checks
        run: |
          php -l api/brain-orchestrator.php
          php -l api/brain-events.php
          php -l api/admin-dashboard-agent.php
          php -l api/equipment-agent.php
          php -l api/recipe-agent.php
          php -l api/online-order-agent.php
          php -l api/daily-manager-agent.php
          php -l includes/agent-brain-orchestrator.php
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l includes/equipment-agent-core.php
          php -l includes/equipment-agent-brain.php
          php -l includes/recipe-agent-core.php
          php -l includes/recipe-agent-brain.php
          php -l includes/online-order-agent-core.php
          php -l includes/online-order-agent-brain.php
          php -l tests/agent-brain-orchestration-contract.php
          php -l tests/admin-command-dashboard-contract.php
          php -l tests/workspace-dynamic-agent-canvas-contract.php
          node --check js/agent-next-moves.js
          node --check js/global-add-canvas.js
          node --check js/equipment-agent-context.js
          node --check js/recipe-agent-context.js
          node --check js/online-order-agent-context.js
      - name: Agent Brain orchestration contract
        run: php tests/agent-brain-orchestration-contract.php
      - name: Recipe Brain integration contract
        run: |
          grep -F "require_once __DIR__.'/../includes/recipe-agent-brain.php';" api/brain-orchestrator.php
          grep -F 'recipe_agent_merge_brain_snapshot' api/brain-orchestrator.php
          grep -F "'node'=>'recipes'" includes/recipe-agent-brain.php
      - name: Online Order Brain integration contract
        run: |
          grep -F "require_once __DIR__.'/../includes/online-order-agent-brain.php';" api/brain-orchestrator.php
          grep -F 'online_order_agent_merge_brain_snapshot' api/brain-orchestrator.php
          grep -F "'node'=>'online_orders'" includes/online-order-agent-brain.php
      - name: Command Center regression
        run: php tests/admin-command-dashboard-contract.php
      - name: Shared Agent UI regression
        run: php tests/workspace-dynamic-agent-canvas-contract.php
