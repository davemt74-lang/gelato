name: AR Glasses Plugin Foundation

on:
  pull_request:
    paths:
      - 'api/glasses-admin.php'
      - 'api/glasses-device.php'
      - 'includes/glasses-core.php'
      - 'database/20261011_glasses_plugin_foundation.sql'
      - 'tests/glasses-foundation-contract.php'
      - 'docs/GLASSES-PLUGIN-FOUNDATION.md'
      - '.github/workflows/glasses-plugin-foundation.yml'
  push:
    branches: [main]

jobs:
  glasses-foundation:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l api/glasses-admin.php
          php -l api/glasses-device.php
          php -l includes/glasses-core.php
          php -l tests/glasses-foundation-contract.php
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE glasses_pairing_grants' database/20261011_glasses_plugin_foundation.sql
          grep -q 'CREATE TABLE glasses_devices' database/20261011_glasses_plugin_foundation.sql
          grep -q 'CREATE TABLE glasses_device_events' database/20261011_glasses_plugin_foundation.sql
          grep -q "'glasses.view'" database/20261011_glasses_plugin_foundation.sql
          grep -q "'glasses.manage'" database/20261011_glasses_plugin_foundation.sql
          grep -q 'function glasses_create_pairing_grant' includes/glasses-core.php
          grep -q 'function glasses_pair_device' includes/glasses-core.php
          grep -q 'function glasses_authenticate_token' includes/glasses-core.php
          grep -q 'function glasses_heartbeat' includes/glasses-core.php
          grep -q "action==='pairing.create'" api/glasses-admin.php
          grep -q "action==='device.revoke'" api/glasses-admin.php
          grep -q "action==='pair'" api/glasses-device.php
          grep -q "action==='heartbeat'" api/glasses-device.php
          ! grep -q 'app_verify_request_csrf' api/glasses-device.php
          ! grep -q 'deviceToken.*INSERT' includes/glasses-core.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('glasses_pairing_grants','glasses_devices','glasses_device_events');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('glasses.view','glasses.manage');")" = "2"
      - name: Glasses foundation behavioral contract
        run: php tests/glasses-foundation-contract.php
      - name: KDS regression
        run: |
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php
      - name: Upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
