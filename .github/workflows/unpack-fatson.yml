name: Unpack uploaded site archive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack-fatson.yml

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack fatson.zip safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          repo = Path.cwd().resolve()
          archive = repo / 'fatson.zip'
          temp = repo / '.unpack-fatson-tmp'

          if not archive.is_file():
              raise SystemExit('fatson.zip was not found at the repository root')

          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with ZipFile(archive) as zf:
              for member in zf.infolist():
                  name = member.filename.replace('\\', '/')
                  if not name or name.startswith('/'):
                      raise SystemExit(f'Unsafe ZIP path: {member.filename!r}')
                  target = (temp / name).resolve()
                  if temp not in target.parents and target != temp:
                      raise SystemExit(f'Unsafe ZIP path: {member.filename!r}')
              zf.extractall(temp)

          # Ignore common macOS metadata when deciding whether the archive has
          # one wrapper directory around the actual project.
          visible = [p for p in temp.iterdir() if p.name not in {'__MACOSX', '.DS_Store'}]
          source = temp
          if len(visible) == 1 and visible[0].is_dir():
              source = visible[0]

          for child in source.iterdir():
              if child.name in {'.git', '.github'}:
                  # Never let an uploaded archive replace repository metadata
                  # or the workflow currently doing the extraction.
                  continue
              destination = repo / child.name
              if destination.exists():
                  if destination.is_dir() and child.is_dir():
                      shutil.copytree(child, destination, dirs_exist_ok=True)
                  elif destination.is_dir():
                      shutil.rmtree(destination)
                      shutil.copy2(child, destination)
                  elif child.is_dir():
                      destination.unlink()
                      shutil.copytree(child, destination)
                  else:
                      shutil.copy2(child, destination)
              elif child.is_dir():
                  shutil.copytree(child, destination)
              else:
                  shutil.copy2(child, destination)

          archive.unlink()
          shutil.rmtree(temp, ignore_errors=True)
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/unpack-fatson.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi

          git commit -m "Unpack uploaded Gelato site archive"
          git push origin HEAD:main
