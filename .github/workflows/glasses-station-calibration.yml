name: AR Glasses Station Calibration

on:
  pull_request:
    paths:
      - 'api/glasses-calibrations.php'
      - 'api/glasses-device.php'
      - 'includes/glasses-calibration.php'
      - 'database/20261016_glasses_station_calibration.sql'
      - 'tests/glasses-station-calibration-contract.php'
      - 'glasses/inmo-air3-unity/**'
      - 'docs/GLASSES-STATION-CALIBRATION.md'
      - '.github/workflows/glasses-station-calibration.yml'
  push:
    branches: [main, 'feature/glasses-station-calibration']

jobs:
  station-calibration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Syntax and architecture contract
        run: |
          php -l api/glasses-calibrations.php
          php -l api/glasses-device.php
          php -l includes/glasses-calibration.php
          php -l tests/glasses-station-calibration-contract.php
          grep -q 'CREATE TABLE glasses_station_calibrations' database/20261016_glasses_station_calibration.sql
          grep -q 'CREATE TABLE glasses_station_calibration_zones' database/20261016_glasses_station_calibration.sql
          grep -q 'function glasses_station_calibration_save' includes/glasses-calibration.php
          grep -q 'function glasses_station_calibration_active' includes/glasses-calibration.php
          grep -q "action==='calibration.get'" api/glasses-device.php
          grep -q "action==='calibration.save'" api/glasses-calibrations.php
          grep -q 'class StationCalibration' glasses/inmo-air3-unity/Runtime/Core/Models.cs
          grep -q 'class IngredientZone' glasses/inmo-air3-unity/Runtime/Core/Models.cs
          grep -q 'StationCalibrationPolicy.CanUse' glasses/inmo-air3-unity/Runtime/Unity/VisionRuntimeController.cs
          grep -q 'StationCalibration = stationCalibration' glasses/inmo-air3-unity/Runtime/Unity/VisionRuntimeController.cs
          grep -q 'GetStationCalibrationAsync' glasses/inmo-air3-unity/Runtime/Unity/UnityGelatoGateway.cs

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Station calibration behavioral contract
        run: php tests/glasses-station-calibration-contract.php

      - name: Compile hardware-neutral AR core
        run: dotnet build glasses/inmo-air3-unity/Runtime/Core/Gelato.Ar.Core.csproj -c Release --nologo

      - name: Run Unity-core workflow, simulator, vision and calibration contracts
        run: dotnet run --project glasses/inmo-air3-unity/Tests/Gelato.Ar.Core.Tests.csproj -c Release

      - name: Existing glasses + KDS regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/glasses-work-api-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-build-definition-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/glasses-expo-handoff-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP

      - name: Vendor isolation
        run: |
          ! grep -R 'ArPoseManager' glasses/inmo-air3-unity/Runtime/Core
