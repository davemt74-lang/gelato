name: Menu sync integration

on:
  pull_request:
    paths:
      - 'admin-menu-import.php'
      - 'api/menu.php'
      - 'api/menu-knowledge.php'
      - 'includes/menu-sync.php'
      - 'scripts/sync-gelato-menu.php'
      - 'data/gelato-menu-scan.json'
      - 'database/**'
      - 'config-example.php'
      - '.github/workflows/menu-sync-integration.yml'

permissions:
  contents: read

jobs:
  fresh-install-manual-import:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: restaurant_training
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,curl,mbstring,intl,sodium
          coverage: none

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/menu-sync.php
          php -l scripts/sync-gelato-menu.php
          php -l api/menu.php
          php -l api/menu-knowledge.php
          php -l admin-menu-import.php
          php -l config-example.php
          python3 -m json.tool data/gelato-menu-scan.json >/dev/null

      - name: Create isolated CI config
        shell: bash
        run: |
          cat > config.php <<'PHP'
          <?php
          return [
              'app' => [
                  'name' => 'Gelato Spot CI',
                  'url' => 'https://training.example.test',
                  'timezone' => 'America/Phoenix',
                  'debug' => false,
              ],
              'database' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'restaurant_training',
                  'username' => 'root',
                  'password' => 'rootpass',
                  'charset' => 'utf8mb4',
              ],
              'security' => [
                  'session_name' => 'gelato_ci_session',
                  'session_lifetime_seconds' => 28800,
                  'cookie_secure' => true,
                  'cookie_samesite' => 'Lax',
              ],
          ];
          PHP

      - name: Install fresh database
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -prootpass restaurant_training < database/install.sql
          mysql -h 127.0.0.1 -uroot -prootpass restaurant_training \
            -e "INSERT INTO organizations (name, legal_name, status, timezone) VALUES ('Gelato Spot CI', 'Gelato Spot CI', 'active', 'America/Phoenix');"

      - name: Validate bundled scanned menu without writing
        shell: bash
        run: |
          set -euo pipefail
          php scripts/sync-gelato-menu.php --dry-run > /tmp/manual-dry-run.json
          cat /tmp/manual-dry-run.json
          php -r '$d=json_decode(file_get_contents("/tmp/manual-dry-run.json"),true,512,JSON_THROW_ON_ERROR); if(empty($d["ok"])||($d["sourceMode"]??"")!=="manual-file"||($d["sections"]??0)!==9||($d["items"]??0)!==79){fwrite(STDERR,"Unexpected manual snapshot summary\n");exit(1);}'

      - name: Import bundled menu into fresh database
        shell: bash
        run: |
          set -euo pipefail
          php scripts/sync-gelato-menu.php --organization-id=1 > /tmp/manual-sync.json
          cat /tmp/manual-sync.json
          test "$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_sections WHERE organization_id=1 AND status='active';")" = "9"
          test "$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_items WHERE organization_id=1 AND is_active=1;")" = "79"

      - name: Verify projected training menu
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "includes/bootstrap.php";require "includes/menu-sync.php";$s=menu_database_sections(app_pdo(),1);$items=array_sum(array_map(fn($x)=>count($x["items"]??[]),$s));if(count($s)!==9||$items!==79){fwrite(STDERR,"Database projection mismatch\n");exit(1);}echo "Projected ".count($s)." sections / $items items\n";'

      - name: Verify repeated import is idempotent
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SECTIONS=$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_sections WHERE organization_id=1;")
          BEFORE_ITEMS=$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_items WHERE organization_id=1;")
          php scripts/sync-gelato-menu.php --organization-id=1 >/tmp/manual-repeat.json
          AFTER_SECTIONS=$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_sections WHERE organization_id=1;")
          AFTER_ITEMS=$(mysql -N -h 127.0.0.1 -uroot -prootpass restaurant_training -e "SELECT COUNT(*) FROM menu_items WHERE organization_id=1;")
          test "$BEFORE_SECTIONS" = "$AFTER_SECTIONS"
          test "$BEFORE_ITEMS" = "$AFTER_ITEMS"
          test "$AFTER_SECTIONS" = "9"
          test "$AFTER_ITEMS" = "79"
