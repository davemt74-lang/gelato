name: Daily Review Hardening

on:
  pull_request:
    paths:
      - 'includes/online-order-lifecycle.php'
      - 'includes/admin-route-access.php'
      - 'includes/admin-shell-core.php'
      - 'online-order.php'
      - 'assets/css/online-order.css'
      - 'tests/daily-review-hardening-contract.php'
      - '.github/workflows/daily-review-hardening.yml'
  push:
    branches: [main]

jobs:
  review-contract:
    name: Review Hardening PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/online-order-lifecycle.php
          php -l includes/admin-route-access.php
          php -l includes/admin-shell-core.php
          php -l online-order.php
          php -l tests/daily-review-hardening-contract.php
      - name: Cross-feature hardening contract
        run: php tests/daily-review-hardening-contract.php
      - name: Browser asset syntax presence
        run: |
          test -s assets/css/online-order.css
          grep -q 'order-location-cover' assets/css/online-order.css
          grep -q 'order-item-image' assets/css/online-order.css
