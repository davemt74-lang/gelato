name: Fix Menu Operations Contract Literals

on:
  push:
    branches:
      - feature/menu-operations-agent-brain
    paths:
      - '.github/workflows/_fix_menu_ops_contract_literals.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-operations-agent-brain
          fetch-depth: 0
      - name: Fix literal source assertions
        run: python3 scripts/_fix_menu_ops_contract_literals.py
      - name: Validate contract
        run: php -l tests/menu-operations-agent-brain-contract.php
      - name: Remove patch machinery and commit
        run: |
          rm -f .github/workflows/_fix_menu_ops_contract_literals.yml scripts/_fix_menu_ops_contract_literals.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Menu Operations contract source literals'
          git push origin HEAD:feature/menu-operations-agent-brain
