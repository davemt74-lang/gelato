name: Menu source contract

on:
  pull_request:
    paths:
      - '.github/workflows/menu-source-contract.yml'
      - 'scripts/**'
      - 'includes/**'
      - 'database/**'
      - 'config-example.php'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch live Gelato menu sources
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl --fail --silent --show-error --location --max-time 30 -A "$UA" \
            https://gelato.spot/api/v1/menu -o /tmp/gelato-menu.json
          curl --fail --silent --show-error --location --max-time 30 -A "$UA" \
            https://gelato.spot/menu/ -o /tmp/gelato-menu.html

          for path in sitemap.xml sitemap_index.xml wp-sitemap.xml; do
            code=$(curl --silent --show-error --location --max-time 30 -A "$UA" \
              -o "/tmp/$path" -w '%{http_code}' "https://gelato.spot/$path" || true)
            echo "$path HTTP $code bytes $(wc -c < "/tmp/$path" 2>/dev/null || echo 0)"
          done

          echo "REST bytes: $(wc -c < /tmp/gelato-menu.json)"
          echo "HTML bytes: $(wc -c < /tmp/gelato-menu.html)"

      - name: Inspect REST inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path('/tmp/gelato-menu.json').read_text())
          expected_top = {'version', 'source', 'search', 'sections'}
          missing = expected_top - set(data)
          if missing:
              raise SystemExit(f'REST contract missing keys: {sorted(missing)}')

          sections = data.get('sections')
          if not isinstance(sections, list) or not sections:
              raise SystemExit('REST sections must be a non-empty list')

          total = 0
          path_counts = Counter()
          print('REST version:', data.get('version'))
          print('REST source:', data.get('source'))
          print('REST search type:', type(data.get('search')).__name__)
          if isinstance(data.get('search'), (list, dict, str)):
              try:
                  print('REST search size:', len(data.get('search')))
              except TypeError:
                  pass
          print('REST sections:', len(sections))
          for index, section in enumerate(sections):
              title = str(section.get('title') or '').strip()
              slug = str(section.get('slug') or '').strip()
              items = section.get('items') or []
              if not title or not slug or not isinstance(items, list):
                  raise SystemExit(f'Invalid section at index {index}')
              total += len(items)
              print(f'  {index+1}. {title} [{slug}] = {len(items)} items')
              if slug == 'gelato':
                  for item in items:
                      print('    GELATO:', item.get('name'), '|', item.get('price'), '|', item.get('url'))
              for item_index, item in enumerate(items):
                  for key in ('name', 'description', 'price', 'url'):
                      if key not in item:
                          raise SystemExit(f'Missing item field {key!r} in {title} item {item_index}')
                  path = urlparse(str(item.get('url') or '')).path.rstrip('/')
                  if not re.fullmatch(r'/menu/[^/]+/[^/]+', path):
                      raise SystemExit(f'Unexpected item URL: {item.get("url")!r}')
                  path_counts[path] += 1

          print('REST item total:', total)
          print('REST unique detail URLs:', len(path_counts))
          duplicates = {path: count for path, count in path_counts.items() if count > 1}
          print('REST shared detail URLs:', len(duplicates))
          for path, count in sorted(duplicates.items()):
              print('  shared:', count, path)
          PY

      - name: Compare published sitemap inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter, deque
          from pathlib import Path
          from urllib.parse import urlparse

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          data = json.loads(Path('/tmp/gelato-menu.json').read_text())
          api_by_path = {}
          for section in data['sections']:
              section_slug = section['slug']
              for item in section.get('items', []):
                  path = urlparse(str(item['url'])).path.rstrip('/')
                  api_by_path.setdefault(path, []).append((section_slug, item.get('name')))

          seeds = []
          for name in ('sitemap.xml', 'sitemap_index.xml', 'wp-sitemap.xml'):
              p = Path('/tmp') / name
              if p.exists() and p.stat().st_size:
                  seeds.append(('https://gelato.spot/' + name, p.read_bytes()))

          seen_docs = set()
          queue = deque(seeds)
          urls = set()
          while queue and len(seen_docs) < 50:
              source_url, raw = queue.popleft()
              if source_url in seen_docs:
                  continue
              seen_docs.add(source_url)
              try:
                  root = ET.fromstring(raw)
              except ET.ParseError:
                  continue
              locs = []
              for elem in root.iter():
                  if elem.tag.rsplit('}', 1)[-1].lower() == 'loc' and elem.text:
                      locs.append(elem.text.strip())
              for loc in locs:
                  parsed = urlparse(loc)
                  if parsed.netloc not in {'gelato.spot', 'www.gelato.spot'}:
                      continue
                  if parsed.path.endswith('.xml'):
                      if loc not in seen_docs:
                          try:
                              req = urllib.request.Request(loc, headers={'User-Agent': UA})
                              with urllib.request.urlopen(req, timeout=20) as response:
                                  queue.append((loc, response.read()))
                          except Exception as exc:
                              print('sitemap child fetch failed:', loc, exc)
                  else:
                      urls.add(loc)

          menu_paths = {
              urlparse(url).path.rstrip('/')
              for url in urls
              if re.fullmatch(r'/menu/[^/]+/[^/]+/?', urlparse(url).path)
          }
          counts = Counter(path.split('/')[2] for path in menu_paths)
          print('sitemap docs inspected:', len(seen_docs))
          print('published menu detail URLs:', len(menu_paths))
          for section, count in sorted(counts.items()):
              print('  sitemap', section, '=', count)

          missing_api = sorted(menu_paths - set(api_by_path))
          missing_published = sorted(set(api_by_path) - menu_paths)
          print('published URLs absent from REST:', len(missing_api))
          for path in missing_api:
              print('  MISSING_FROM_REST:', path)
          print('REST URLs absent from sitemap:', len(missing_published))
          for path in missing_published[:20]:
              print('  MISSING_FROM_SITEMAP:', path, api_by_path[path])
          PY

      - name: Enforce current public count contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/gelato-menu.json').read_text())
          counts={section['slug']:len(section.get('items',[])) for section in data['sections']}
          total=sum(counts.values())
          expected={
              'appetizers':6,
              'panini':6,
              'wood-fired-pizza':11,
              'salads-and-pasta':7,
              'gelato':35,
              'beverages':6,
              'beer-wine-and-cocktails':4,
              'coffee':10,
              'happy-hour':16,
          }
          print('REST counts:', counts)
          print('expected public counts:', expected)
          if counts != expected or total != 101:
              raise SystemExit(f'Live REST/public menu mismatch: REST total={total}; public total=101')
          PY
