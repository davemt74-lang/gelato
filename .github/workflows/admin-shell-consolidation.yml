name: Admin Shell Consolidation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'workspace.php'
      - 'admin.php'
      - 'admin-menu-import.php'
      - 'locations-admin.php'
      - 'operations.php'
      - 'catering-operations.php'
      - 'catering-pipeline.php'
      - 'sales-intelligence.php'
      - 'sales-import-center.php'
      - 'sales-cost-intelligence.php'
      - 'customer-promotions.php'
      - 'customer-crm.php'
      - 'online-orders-admin.php'
      - 'recipes.php'
      - 'scheduling.php'
      - 'timeclock.php'
      - 'public-site-settings.php'
      - 'prep-intelligence.php'
      - 'equipment.php'
      - 'purchasing.php'
      - 'wholesale-pipeline.php'
      - 'wholesale-accounts.php'
      - 'includes/admin-shell-core.php'
      - 'api/admin-shell.php'
      - 'js/admin-shell-consolidation.js'
      - 'js/universal-admin-page-shell.js'
      - 'js/floor-planner-module.js'
      - 'js/employee-home-module.js'
      - 'tests/admin-shell-consolidation-contract.php'
      - 'tests/universal-admin-page-shell-contract.php'
      - '.github/workflows/admin-shell-consolidation.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'workspace.php'
      - 'admin.php'
      - 'admin-menu-import.php'
      - 'locations-admin.php'
      - 'operations.php'
      - 'catering-operations.php'
      - 'catering-pipeline.php'
      - 'sales-intelligence.php'
      - 'sales-import-center.php'
      - 'sales-cost-intelligence.php'
      - 'customer-promotions.php'
      - 'customer-crm.php'
      - 'online-orders-admin.php'
      - 'recipes.php'
      - 'scheduling.php'
      - 'timeclock.php'
      - 'public-site-settings.php'
      - 'prep-intelligence.php'
      - 'equipment.php'
      - 'purchasing.php'
      - 'wholesale-pipeline.php'
      - 'wholesale-accounts.php'
      - 'includes/admin-shell-core.php'
      - 'api/admin-shell.php'
      - 'js/admin-shell-consolidation.js'
      - 'js/universal-admin-page-shell.js'
      - 'js/floor-planner-module.js'
      - 'js/employee-home-module.js'
      - 'tests/admin-shell-consolidation-contract.php'
      - 'tests/universal-admin-page-shell-contract.php'
      - '.github/workflows/admin-shell-consolidation.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Admin shell contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: PHP syntax
        run: |
          php -l includes/admin-shell-core.php
          php -l api/admin-shell.php
          php -l tests/admin-shell-consolidation-contract.php
          php -l tests/universal-admin-page-shell-contract.php
          for file in admin.php admin-menu-import.php locations-admin.php operations.php catering-operations.php catering-pipeline.php sales-intelligence.php sales-import-center.php sales-cost-intelligence.php customer-promotions.php customer-crm.php online-orders-admin.php recipes.php scheduling.php timeclock.php public-site-settings.php prep-intelligence.php equipment.php purchasing.php wholesale-pipeline.php wholesale-accounts.php; do php -l "$file"; done
      - name: JavaScript syntax
        run: |
          node --check js/admin-shell-consolidation.js
          node --check js/universal-admin-page-shell.js
          node --check js/floor-planner-module.js
          node --check js/employee-home-module.js
      - name: Admin shell contract
        run: |
          php tests/admin-shell-consolidation-contract.php
          php tests/universal-admin-page-shell-contract.php
