name: AR Glasses Vision Label Profiles

on:
  pull_request:
    paths:
      - 'database/20261019_glasses_vision_label_profiles.sql'
      - 'includes/glasses-vision-profiles.php'
      - 'api/glasses-vision-profiles.php'
      - 'api/glasses-device.php'
      - 'glasses-vision-profiles.php'
      - 'assets/js/glasses-vision-profiles.js'
      - 'assets/css/glasses-vision-profiles.css'
      - 'includes/admin-control-core.php'
      - 'includes/glasses-learning.php'
      - 'glasses-learning.php'
      - 'assets/js/glasses-learning.js'
      - 'tests/glasses-vision-label-profiles-contract.php'
      - 'glasses/inmo-air3-unity/**'
      - 'docs/GLASSES-VISION-LABEL-PROFILES.md'
      - '.github/workflows/glasses-vision-label-profiles.yml'
  push:
    branches: [main, 'feature/glasses-vision-label-profiles']

jobs:
  vision-label-profiles:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Syntax checks
        run: |
          php -l includes/glasses-vision-profiles.php
          php -l api/glasses-vision-profiles.php
          php -l api/glasses-device.php
          php -l glasses-vision-profiles.php
          php -l includes/glasses-learning.php
          php -l glasses-learning.php
          php -l includes/admin-control-core.php
          php -l tests/glasses-vision-label-profiles-contract.php
          node --check assets/js/glasses-vision-profiles.js
          node --check assets/js/glasses-learning.js

      - name: Architecture and safety contract
        run: |
          grep -q 'CREATE TABLE glasses_vision_label_profiles' database/20261019_glasses_vision_label_profiles.sql
          grep -q 'uq_glasses_vision_label_detector' database/20261019_glasses_vision_label_profiles.sql
          grep -q 'function glasses_vision_profile_for_build' includes/glasses-vision-profiles.php
          grep -q 'Resolve generic vs detector-specific precedence' includes/glasses-vision-profiles.php
          grep -Fq "p.detector_name IN ('*',?)" includes/glasses-vision-profiles.php
          grep -q 'minimumConfidence' includes/glasses-vision-profiles.php
          grep -q "action==='vision.profile'" api/glasses-device.php
          grep -q 'glasses.manage' api/glasses-vision-profiles.php
          grep -q 'app_verify_request_csrf' api/glasses-vision-profiles.php
          grep -q 'Vision Label Registry' glasses-vision-profiles.php
          grep -q 'AR Vision Labels' includes/admin-control-core.php
          grep -q 'GetVisionLabelProfileAsync' glasses/inmo-air3-unity/Runtime/Core/Contracts.cs
          grep -q 'ProfileThresholdRejects' glasses/inmo-air3-unity/Runtime/Core/VisionModels.cs
          grep -q 'ProfileApplies' glasses/inmo-air3-unity/Runtime/Core/VisionPipeline.cs
          grep -q 'ProfileMinimumConfidence' glasses/inmo-air3-unity/Runtime/Core/VisionPipeline.cs
          grep -q 'blockedLabels' includes/glasses-vision-profiles.php
          grep -q 'BlockedLabels' glasses/inmo-air3-unity/Runtime/Core/Models.cs
          grep -q 'visionProfile?.BlockedLabels' glasses/inmo-air3-unity/Runtime/Core/VisionPipeline.cs
          grep -q 'RefreshVisionLabelProfileAsync' glasses/inmo-air3-unity/Runtime/Unity/VisionRuntimeController.cs
          grep -q 'automated vision evidence is held fail-closed' glasses/inmo-air3-unity/Runtime/Unity/VisionRuntimeController.cs
          grep -q 'detectorLabel' glasses/inmo-air3-unity/Runtime/Unity/UnityGelatoGateway.cs
          grep -q "'modelLabels'" includes/glasses-learning.php
          ! grep -R 'ArPoseManager' glasses/inmo-air3-unity/Runtime/Core
          grep -Fq '$minimumConfidence<0.50' includes/glasses-vision-profiles.php
          grep -Fq '$minimumConfidence>1.0' includes/glasses-vision-profiles.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Vision label profile backend contract
        run: php tests/glasses-vision-label-profiles-contract.php

      - name: Compile hardware-neutral AR core
        run: dotnet build glasses/inmo-air3-unity/Runtime/Core/Gelato.Ar.Core.csproj -c Release --nologo

      - name: Run full AIR3 behavior contracts
        run: dotnet run --project glasses/inmo-air3-unity/Tests/Gelato.Ar.Core.Tests.csproj -c Release

      - name: Existing glasses + KDS regressions
        run: |
          php tests/glasses-foundation-contract.php
          php tests/glasses-work-api-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-build-definition-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/glasses-expo-handoff-contract.php
          php tests/glasses-station-calibration-contract.php
          php tests/glasses-transfer-sequence-contract.php
          php tests/glasses-calibration-studio-contract.php
          node tests/glasses-calibration-geometry.test.js
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-learning-analytics-contract.php
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
