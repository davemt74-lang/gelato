name: Menu Agent Brain integration patch

on:
  push:
    branches:
      - feature/menu-operations-agent-brain
    paths:
      - '.github/workflows/_menu_agent_brain_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-operations-agent-brain
          fetch-depth: 0
      - name: Apply central Agent Brain menu integration
        run: python3 scripts/_menu_agent_brain_patch.py
      - name: Validate patched PHP
        run: |
          php -l api/agent-brain.php
          php -l includes/menu-operations-core.php
      - name: Commit Agent Brain integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/agent-brain.php
          git commit -m 'Integrate Menu Operations into central Agent Brain'
          git push origin HEAD:feature/menu-operations-agent-brain
