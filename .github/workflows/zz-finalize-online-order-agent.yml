name: Finalize Online Order Agent Integration

on:
  push:
    branches: [online-order-pickup-agent-20260916]
    paths:
      - '.github/workflows/zz-finalize-online-order-agent.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-order-pickup-agent-20260916
      - name: Apply final integration patch
        run: python3 scripts/finalize-online-order-agent.py
      - name: Validate source
        run: |
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l online-orders-admin.php
          php -l pickup-fulfillment.php
          php -l order-recovery.php
          php -l includes/online-order-agent-core.php
          php -l includes/online-order-agent-brain.php
          php -l api/online-order-agent.php
          php -l tests/online-order-agent-db-lifecycle.php
          node --check js/online-order-agent-context.js
          grep -F "'online_orders'=>[" includes/agent-node-registry.php
          grep -F '$isOnlineOrdersContext=' api/agent-workspace.php
          grep -F 'online_order_agent_merge_brain_snapshot' api/brain-orchestrator.php
      - name: Package validated patched files
        run: |
          mkdir -p patched/includes patched/api patched/js patched/.github/workflows
          cp includes/agent-workspace-core.php includes/online-order-agent-core.php patched/includes/
          cp api/agent-workspace.php api/brain-orchestrator.php patched/api/
          cp online-orders-admin.php pickup-fulfillment.php order-recovery.php patched/
          cp .github/workflows/agent-brain-orchestration.yml .github/workflows/production-runtime-deploy.yml patched/.github/workflows/
          cp js/online-order-agent-context.js patched/js/
          zip -qr online-order-agent-patched-files.zip patched
      - uses: actions/upload-artifact@v4
        with:
          name: online-order-agent-patched-files
          path: online-order-agent-patched-files.zip
          if-no-files-found: error
          retention-days: 3
