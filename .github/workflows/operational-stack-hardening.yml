name: Operational Stack Hardening

on:
  pull_request:
    paths:
      - 'api/pos.php'
      - 'api/kds.php'
      - 'api/table-service.php'
      - 'includes/operational-access.php'
      - 'includes/pos-core.php'
      - 'includes/pos-floor-plan.php'
      - 'includes/kds-production.php'
      - 'js/kds.js'
      - 'js/kds-dashboard.js'
      - 'tests/operational-stack-hardening-contract.php'
      - 'tests/kds-timing-audit-contract.php'
      - '.github/workflows/operational-stack-hardening.yml'
  push:
    branches: [main]

jobs:
  operational-stack-hardening:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l api/pos.php
          php -l api/kds.php
          php -l api/table-service.php
          php -l includes/operational-access.php
          php -l includes/pos-core.php
          php -l includes/pos-floor-plan.php
          php -l includes/kds-production.php
          php -l tests/operational-stack-hardening-contract.php
          php -l tests/kds-timing-audit-contract.php
          node --check js/kds.js
          node --check js/kds-dashboard.js
      - name: Architecture guardrails
        run: |
          grep -q "function operational_location_scope" includes/operational-access.php
          grep -q "function operational_db_wrap" includes/operational-access.php
          grep -q "function operational_safe_error" includes/operational-access.php
          grep -q "operational_location_allowed(\$pdo,\$user,'pos.use'" api/pos.php
          grep -q "operational_location_allowed(\$pdo,\$user,'kds.view'" api/kds.php
          grep -q "operational_location_allowed(\$pdo,\$user,'table_service.view'" api/table-service.php
          grep -q "operational_safe_error" api/pos.php
          grep -q "operational_safe_error" api/kds.php
          grep -q "operational_safe_error" api/table-service.php
          ! grep -Fq "message'=>\$e->getMessage()],500" api/pos.php
          ! grep -Fq "message'=>\$e->getMessage()],500" api/kds.php
          ! grep -Fq "message'=>\$e->getMessage()],500" api/table-service.php
          grep -q "function pos_transaction" includes/pos-core.php
          grep -q "\$owns=!\$pdo->inTransaction()" includes/pos-floor-plan.php
          ! grep -q "strtotime(" includes/kds-production.php
          grep -q "S.data?.permissions?.update" js/kds.js
          grep -q "e.key==='Escape'" js/kds.js
          grep -q "S.data?.permissions?.configure" js/kds-dashboard.js
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Operational hardening contract
        run: php tests/operational-stack-hardening-contract.php
      - name: KDS timing contract
        run: php tests/kds-timing-audit-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: KDS regression
        run: |
          php tests/kds-contract.php
          php tests/kds-production-expo-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: POS Floor integration regression
        run: php tests/pos-floor-plan-integration-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
