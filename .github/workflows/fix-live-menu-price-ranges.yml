name: Fix live menu price ranges

on:
  push:
    branches: [gelato-menu-sync]
    paths:
      - '.github/workflows/fix-live-menu-price-ranges.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gelato-menu-sync
          fetch-depth: 0

      - name: Patch compact REST price ranges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('includes/menu-sync.php')
          text=path.read_text(encoding='utf-8')
          old="""    if ($raw === '') {
        return [];
    }

    $segments = preg_split('/\\s*[|·•;]\\s*|\\s+\\/\\s+(?=\\$|[A-Za-z])/', $raw) ?: [$raw];
"""
          new="""    if ($raw === '') {
        return [];
    }

    // The public menu commonly publishes compact ranges such as "$13-15".
    // Preserve both values instead of losing the upper end of the range.
    if (preg_match('/^\\$\\s*([0-9]+(?:\\.[0-9]{1,2})?)\\s*[-–—]\\s*\\$?\\s*([0-9]+(?:\\.[0-9]{1,2})?)$/u', $raw, $range)) {
        return [
            [
                'label' => 'Lower listed price',
                'size_code' => 'lower-listed-price',
                'amount' => round((float)$range[1], 2),
                'sort_order' => 0,
            ],
            [
                'label' => 'Higher listed price',
                'size_code' => 'higher-listed-price',
                'amount' => round((float)$range[2], 2),
                'sort_order' => 1,
            ],
        ];
    }

    $segments = preg_split('/\\s*[|·•;]\\s*|\\s+\\/\\s+(?=\\$|[A-Za-z])/', $raw) ?: [$raw];
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one price parser anchor, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Test price parser
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/menu-sync.php
          php -r 'require "includes/menu-sync.php"; $a=menu_parse_price_entries("$13-15"); if(count($a)!==2 || $a[0]["amount"]!==13.0 || $a[1]["amount"]!==15.0){fwrite(STDERR,"range parse failed\n");exit(1);} $b=menu_parse_price_entries("$11-$16"); if(count($b)!==2 || $b[0]["amount"]!==11.0 || $b[1]["amount"]!==16.0){fwrite(STDERR,"dollar range parse failed\n");exit(1);} $c=menu_parse_price_entries("$4.50"); if(count($c)!==1 || $c[0]["amount"]!==4.5){fwrite(STDERR,"single price parse failed\n");exit(1);} echo "Price parser tests passed\n";'

      - name: Remove workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-live-menu-price-ranges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle compact live menu price ranges"
          git push origin HEAD:gelato-menu-sync
