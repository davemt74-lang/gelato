name: Glasses Section 285F2 Held Ingredient Continuity
on:
  pull_request:
    paths:
      - 'assets/js/glasses-held-ingredient-evidence.js'
      - 'tests/glasses-section285f2-continuity.test.js'
      - '.github/workflows/glasses-section285f2.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/glasses-held-ingredient-evidence.js'
      - 'tests/glasses-section285f2-continuity.test.js'
      - '.github/workflows/glasses-section285f2.yml'
jobs:
  continuity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/glasses-held-ingredient-evidence.js
      - run: node --test tests/glasses-section285f2-continuity.test.js
      - run: node --test tests/glasses-section285e2-evidence.test.js tests/glasses-section285e5-field-readiness.test.js
