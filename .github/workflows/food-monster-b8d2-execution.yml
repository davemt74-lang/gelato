name: Food Monster B8D2 Agent Execution Loop

on:
  pull_request:
    paths:
      - 'includes/food-monster-b8d2-execution-loop.php'
      - 'api/food-monster-orchestrate.php'
      - 'tests/food-monster-b8d2-execution-loop.php'
      - '.github/workflows/food-monster-b8d2-execution.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  execution-loop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l includes/food-monster-b8d2-execution-loop.php
          php -l api/food-monster-orchestrate.php
          php -l tests/food-monster-b8d2-execution-loop.php
      - name: B8D2 authorization, budgets, approvals, observations and read-path tests
        run: php tests/food-monster-b8d2-execution-loop.php
      - name: G7 read-only multi-node regression
        run: php tests/food-monster-g7-contract.php
