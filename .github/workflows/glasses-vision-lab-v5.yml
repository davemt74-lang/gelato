name: AR Glasses Vision Lab V5 Training Media

on:
  pull_request:
    paths:
      - 'database/20261029_vision_lab_v5_training_media.sql'
      - 'includes/glasses-vision-training-media.php'
      - 'includes/glasses-vision-dataset-intelligence.php'
      - 'includes/glasses-vision-lab.php'
      - 'api/glasses-vision-media.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'glasses-simulator.php'
      - 'assets/js/glasses-vision-lab.js'
      - 'assets/js/glasses-web-simulator.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'includes/admin-control-core.php'
      - 'storage/README.txt'
      - 'tests/glasses-vision-lab-v2-contract.php'
      - 'tests/glasses-vision-lab-v3-active-learning-contract.php'
      - 'tests/glasses-vision-lab-v4-dataset-intelligence-contract.php'
      - 'tests/glasses-vision-lab-v5-training-media-contract.php'
      - 'docs/GLASSES-VISION-LAB-TRAINING-MEDIA.md'
      - '.github/workflows/glasses-vision-lab-v5.yml'
  push:
    branches: [main, 'feature/vision-lab-v5-governed-training-media']

jobs:
  vision-lab-v5:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l includes/glasses-vision-training-media.php
          php -l includes/glasses-vision-dataset-intelligence.php
          php -l includes/glasses-vision-lab.php
          php -l api/glasses-vision-media.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l glasses-simulator.php
          php -l tests/glasses-vision-lab-v5-training-media-contract.php
          node --check assets/js/glasses-vision-lab.js
          node --check assets/js/glasses-web-simulator.js

      - name: Media governance architecture
        run: |
          grep -q 'CREATE TABLE glasses_vision_training_media' database/20261029_vision_lab_v5_training_media.sql
          grep -q 'CREATE TABLE glasses_vision_training_media_events' database/20261029_vision_lab_v5_training_media.sql
          grep -q 'training_media_opt_in' includes/glasses-vision-training-media.php
          grep -q 'hash.*sha256' includes/glasses-vision-training-media.php
          grep -q 'function glasses_vision_training_media_hamming' includes/glasses-vision-training-media.php
          grep -q 'function glasses_vision_training_media_freeze_guard' includes/glasses-vision-training-media.php
          grep -q 'function glasses_vision_training_media_export_manifest' includes/glasses-vision-training-media.php
          grep -q 'privateBytesExcluded' includes/glasses-vision-training-media.php
          grep -q 'datasetServerOptIn' glasses-simulator.php
          grep -q 'datasetVisualFeatures' assets/js/glasses-web-simulator.js
          grep -q 'perceptualHash' assets/js/glasses-web-simulator.js
          grep -q "app_has_permission('glasses.manage'" api/glasses-vision-media.php
          ! grep -q 'glasses_build_observe' api/glasses-vision-media.php
          ! grep -q 'kds_transition' api/glasses-vision-media.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Vision Lab V5 media contract
        run: php tests/glasses-vision-lab-v5-training-media-contract.php

      - name: Prior Vision Lab regressions
        run: |
          php tests/glasses-vision-lab-v4-dataset-intelligence-contract.php
          php tests/glasses-vision-lab-v3-active-learning-contract.php
          php tests/glasses-vision-lab-v2-contract.php

      - name: Simulator and vision regressions
        run: |
          php tests/glasses-web-simulator-contract.php
          php tests/glasses-learning-analytics-contract.php
          php tests/glasses-vision-operations-contract.php
          php tests/glasses-vision-model-rollout-contract.php
          php tests/glasses-observation-corrections-contract.php
          php tests/glasses-build-session-contract.php
          php tests/glasses-product-validation-contract.php
          php tests/kds-contract.php

      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
