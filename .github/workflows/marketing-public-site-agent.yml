name: Marketing + Public Site Agent

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/marketing-agent.php'
      - 'api/brain-orchestrator.php'
      - 'includes/marketing-agent-core.php'
      - 'includes/marketing-brain.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-node-registry.php'
      - 'js/marketing-agent-context.js'
      - 'js/global-add-canvas.js'
      - 'tests/marketing-public-site-agent-contract.php'
      - '.github/workflows/marketing-public-site-agent.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  marketing-public-site-agent:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
          coverage: none

      - name: Syntax and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          php -l api/marketing-agent.php
          php -l api/brain-orchestrator.php
          php -l includes/marketing-agent-core.php
          php -l includes/marketing-brain.php
          php -l includes/agent-workspace-core.php
          php -l includes/agent-node-registry.php
          php -l tests/marketing-public-site-agent-contract.php
          node --check js/marketing-agent-context.js
          node --check js/global-add-canvas.js
          grep -q "'marketing'" includes/agent-node-registry.php
          grep -q "domain'=>'marketing'" includes/agent-workspace-core.php
          grep -q "gac_pending_store('marketing'" includes/marketing-agent-core.php
          grep -q "marketing_merge_brain_snapshot" api/brain-orchestrator.php
          ! grep -q "crm_consent_set(" includes/marketing-agent-core.php

      - name: Install database and run upgrader
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_marketing_agent_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Marketing Agent behavior contract
        run: php tests/marketing-public-site-agent-contract.php

      - name: Package Deals regression
        run: php tests/package-deals-contract.php

      - name: Public Site regression
        run: php tests/public-site-contract.php

      - name: Agent Workspace routing regression
        run: php tests/agent-workspace-contract.php
