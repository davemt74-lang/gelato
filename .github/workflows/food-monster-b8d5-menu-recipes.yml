name: Food Monster B8D5 Menu & Recipe Skills

on:
  pull_request:
    paths:
      - 'includes/food-monster-b8d3-tool-runtime.php'
      - 'includes/food-monster-llm.php'
      - 'includes/food-monster-b8d5-menu-recipes.php'
      - 'includes/food-monster-unified-knowledge.php'
      - 'api/food-monster-llm.php'
      - 'includes/food-monster-menu-context.php'
      - 'includes/food-monster-b8d18-operations-proposals.php'
      - 'tests/food-monster-b8d18-operations-proposals.php'
      - 'includes/food-monster-b8d18-purchasing-proposals.php'
      - 'tests/food-monster-b8d18-purchasing-proposals.php'
      - 'includes/food-monster-b8d18-crm-proposals.php'
      - 'tests/food-monster-b8d18-crm-proposals.php'
      - 'includes/food-monster-b8d18-timeclock-proposals.php'
      - 'tests/food-monster-b8d18-timeclock-proposals.php'
      - 'includes/food-monster-b8d18-scheduling-proposals.php'
      - 'tests/food-monster-b8d18-scheduling-proposals.php'
      - 'includes/food-monster-b8d18-shift-swap-proposals.php'
      - 'tests/food-monster-b8d18-shift-swap-proposals.php'
      - 'includes/food-monster-b8d18-schedule-publish-proposals.php'
      - 'tests/food-monster-b8d18-schedule-publish-proposals.php'
      - 'includes/food-monster-b8d18-prep-list-proposals.php'
      - 'tests/food-monster-b8d18-prep-list-proposals.php'
      - 'includes/food-monster-b8d18-prep-items-proposals.php'
      - 'tests/food-monster-b8d18-prep-items-proposals.php'
      - 'includes/scheduling-agent-core.php'
      - 'tests/food-monster-b8d4-scheduling.php'
      - 'tests/food-monster-menu-context.php'
      - 'js/global-agent.js'
      - 'tests/food-monster-b8d5-menu-recipes.php'
      - 'tests/food-monster-b8d14-grounded-fallback.php'
      - '.github/workflows/food-monster-b8d5-menu-recipes.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-b8d3-tool-runtime.php'
      - 'includes/food-monster-llm.php'
      - 'includes/food-monster-b8d5-menu-recipes.php'
      - 'includes/food-monster-unified-knowledge.php'
      - 'api/food-monster-llm.php'
      - 'includes/food-monster-menu-context.php'
      - 'includes/food-monster-b8d18-operations-proposals.php'
      - 'tests/food-monster-b8d18-operations-proposals.php'
      - 'includes/food-monster-b8d18-purchasing-proposals.php'
      - 'tests/food-monster-b8d18-purchasing-proposals.php'
      - 'includes/food-monster-b8d18-crm-proposals.php'
      - 'tests/food-monster-b8d18-crm-proposals.php'
      - 'includes/food-monster-b8d18-timeclock-proposals.php'
      - 'tests/food-monster-b8d18-timeclock-proposals.php'
      - 'includes/food-monster-b8d18-scheduling-proposals.php'
      - 'tests/food-monster-b8d18-scheduling-proposals.php'
      - 'includes/food-monster-b8d18-shift-swap-proposals.php'
      - 'tests/food-monster-b8d18-shift-swap-proposals.php'
      - 'includes/food-monster-b8d18-schedule-publish-proposals.php'
      - 'tests/food-monster-b8d18-schedule-publish-proposals.php'
      - 'includes/food-monster-b8d18-prep-list-proposals.php'
      - 'tests/food-monster-b8d18-prep-list-proposals.php'
      - 'includes/food-monster-b8d18-prep-items-proposals.php'
      - 'tests/food-monster-b8d18-prep-items-proposals.php'
      - 'includes/scheduling-agent-core.php'
      - 'tests/food-monster-b8d4-scheduling.php'
      - 'tests/food-monster-menu-context.php'
      - 'js/global-agent.js'
      - 'tests/food-monster-b8d5-menu-recipes.php'
      - 'tests/food-monster-b8d14-grounded-fallback.php'
      - '.github/workflows/food-monster-b8d5-menu-recipes.yml'

jobs:
  staff-scheduling:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, curl, fileinfo, sodium

      - name: Syntax checks
        run: |
          php -l scheduling.php
          php -l api/scheduling.php
          php -l api/scheduling-agent.php
          php -l api/agent-workspace.php
          php -l includes/scheduling-core.php
          php -l includes/food-monster-llm.php
          php -l includes/food-monster-b8d3-tool-runtime.php
          php -l includes/food-monster-b8d18-operations-proposals.php
          php -l tests/food-monster-b8d18-operations-proposals.php
          php -l includes/food-monster-b8d18-purchasing-proposals.php
          php -l tests/food-monster-b8d18-purchasing-proposals.php
          php -l includes/food-monster-b8d18-crm-proposals.php
          php -l tests/food-monster-b8d18-crm-proposals.php
          php -l includes/food-monster-b8d18-timeclock-proposals.php
          php -l tests/food-monster-b8d18-timeclock-proposals.php
          php -l includes/food-monster-b8d18-scheduling-proposals.php
          php -l tests/food-monster-b8d18-scheduling-proposals.php
          php -l includes/food-monster-b8d18-shift-swap-proposals.php
          php -l tests/food-monster-b8d18-shift-swap-proposals.php
          php -l includes/food-monster-b8d18-schedule-publish-proposals.php
          php -l tests/food-monster-b8d18-schedule-publish-proposals.php
          php -l includes/food-monster-b8d18-prep-list-proposals.php
          php -l tests/food-monster-b8d18-prep-list-proposals.php
          php -l includes/food-monster-b8d18-prep-items-proposals.php
          php -l tests/food-monster-b8d18-prep-items-proposals.php
          php -l includes/scheduling-agent-core.php
          php -l tests/food-monster-b8d4-scheduling.php
          php -l includes/food-monster-b8d5-menu-recipes.php
          php -l includes/food-monster-unified-knowledge.php
          php -l api/food-monster-llm.php
          php -l includes/food-monster-menu-context.php
          php -l tests/food-monster-menu-context.php
          php -l tests/food-monster-b8d5-menu-recipes.php
          php -l tests/food-monster-b8d14-grounded-fallback.php
          php -l tests/scheduling-contract.php
          php -l tests/scheduling-agent-context-contract.php
          node --check js/scheduling.js
          node --check js/agent-page-context.js
          node --check js/scheduling-agent-context.js
          node --check js/global-add-canvas.js
          node --check js/pos.js
          node --check js/pos-agent-context.js
          node --check js/floor-planner-module.js
          node --check js/restaurant-agent-bridge.js
          node --check js/global-agent.js

      - name: Scheduling architecture contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS staff_profiles" database/20260913_zzzz_staff_scheduling.sql
          grep -q "CREATE TABLE IF NOT EXISTS staff_availability" database/20260913_zzzz_staff_scheduling.sql
          grep -q "CREATE TABLE IF NOT EXISTS schedule_shifts" database/20260913_zzzz_staff_scheduling.sql
          grep -q "CREATE TABLE IF NOT EXISTS schedule_shift_requests" database/20260913_zzzz_staff_scheduling.sql
          grep -q "CREATE TABLE IF NOT EXISTS labor_coverage_rules" database/20260913_zzzz_staff_scheduling.sql
          grep -q "schedule.self" database/20260913_zzzz_staff_scheduling.sql
          grep -q "schedule.agent" database/20260913_zzzz_staff_scheduling.sql
          grep -q "scheduling_availability_check" includes/scheduling-core.php
          grep -q "scheduling_shift_conflicts" includes/scheduling-core.php
          grep -q "scheduling_request_review" includes/scheduling-core.php
          grep -q "restaurant_tasks" includes/scheduling-core.php
          grep -q "Wholesale Customer" includes/scheduling-core.php
          grep -q "wholesale_customer" includes/scheduling-core.php
          grep -q "sched_employee_week_visible" api/scheduling.php
          grep -q "sched_read_week" api/scheduling.php
          grep -q "sched_validate_availability_windows" api/scheduling.php
          grep -q "sched_validate_org_reference" api/scheduling.php
          grep -q "Coverage position" api/scheduling.php
          grep -q "Coverage location" api/scheduling.php
          grep -q "hourly_labor_cost.*scheduling_notes" api/scheduling.php
          grep -q "Shift requests are available after the schedule is published" api/scheduling.php
          grep -q "schedule.action_proposal" api/scheduling-agent.php
          grep -q "schedule.action_confirmed" api/scheduling-agent.php
          grep -q "schedule.coverage" api/scheduling-agent.php
          grep -q "schedule.workload" api/scheduling-agent.php
          grep -q "scheduling_context" api/agent-workspace.php
          grep -q "agent-page-context.js" js/global-add-canvas.js
          grep -q "scheduling-agent-context.js" js/global-add-canvas.js
          grep -q "api/scheduling-agent.php" js/restaurant-agent-bridge.js
          grep -q "Staff Scheduling" js/floor-planner-module.js
          grep -q "Coverage + Workload" scheduling.php
          php tests/scheduling-agent-context-contract.php

      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb --skip-ssl -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app' => ['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database' => ['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security' => ['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->ensureTrackingTables();
          $service->bootstrapLegacyHistory(null);
          $service->applyPending(null);
          if($service->pendingMigrations()) exit(1);
          PHP

      - name: Verify scheduling schema and permissions
        run: |
          test "$(mariadb --skip-ssl -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('staff_profiles','staff_availability','staff_availability_exceptions','schedule_weeks','schedule_shifts','schedule_shift_requests','labor_coverage_rules','schedule_events');")" = "8"
          test "$(mariadb --skip-ssl -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('staff.view','staff.manage','schedule.view','schedule.manage','schedule.self','schedule.agent');")" = "6"
          test "$(mariadb --skip-ssl -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260913_zzzz_staff_scheduling';")" = "1"

      - name: Verify staff, availability, shifts, swaps, coverage and task workload
        run: php tests/scheduling-contract.php

      - name: Verify upgrader stays idempotent
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->ensureTrackingTables();
          $applied=$service->applyPending(null);
          if(count($applied)!==0 || count($service->pendingMigrations())!==0) exit(1);
          echo "second-run=clean\n";
          PHP
      - name: B8D1 and B8D3 conversation/tool regressions
        run: |
          php tests/food-monster-b8d1-conversation-foundation.php
          php tests/food-monster-b8d3-tool-selection.php
      - name: Menu Manager + Recipe Agent regressions
        run: |
          php tests/menu-manager-food-builder-contract.php
          php tests/recipe-agent-db-lifecycle.php
      - name: Model-selected Menu + Recipe skills, live MariaDB, permission and history isolation
        run: |
          php tests/food-monster-b8d5-menu-recipes.php
          php tests/food-monster-menu-context.php
          php tests/food-monster-b8d18-operations-proposals.php
          php tests/food-monster-b8d18-purchasing-proposals.php
          php tests/food-monster-b8d18-crm-proposals.php
          php tests/food-monster-b8d18-timeclock-proposals.php
          php tests/food-monster-b8d18-scheduling-proposals.php
          php tests/food-monster-b8d18-shift-swap-proposals.php
          php tests/food-monster-b8d18-schedule-publish-proposals.php
          php tests/food-monster-b8d18-prep-list-proposals.php
          php tests/food-monster-b8d18-prep-items-proposals.php
          php tests/food-monster-b8d14-grounded-fallback.php
