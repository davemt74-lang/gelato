name: Recipe Branch Patch

on:
  push:
    branches: [recipes-production-standards-agent-20260916]
    paths:
      - '.github/workflows/recipe-branch-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recipes-production-standards-agent-20260916
      - name: Patch Recipe Agent branch files
        shell: bash
        run: |
          cat > /tmp/recipe-branch-patch.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {s.count(old)} for {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          replace_once('includes/recipe-agent-core.php',
          "        $qty=(float)$m[1];$unit=trim($m[2]);return recipe_agent_propose($pdo,$user,$recipe,'set_yield',['yieldQuantity'=>$qty,'yieldUnit'=>$unit],'Proposed change: set '.$recipe['name'].' yield to '.recipe_agent_format_number($qty).' '.$unit.'.');",
          """        $qty=(float)$m[1];$unit=trim($m[2]);
                  $unit=preg_replace('/\\s+(?:for|on|to)\\s+(?:the\\s+)?'.preg_quote(mb_strtolower((string)$recipe['name'],'UTF-8'),'/').'(?:\\s+recipe)?[.!]?$/iu','',$unit)??$unit;$unit=trim($unit);
                  if($unit==='')throw new InvalidArgumentException('Tell me the yield unit, such as portions, quarts, pans, or batches.');
                  return recipe_agent_propose($pdo,$user,$recipe,'set_yield',['yieldQuantity'=>$qty,'yieldUnit'=>$unit],'Proposed change: set '.$recipe['name'].' yield to '.recipe_agent_format_number($qty).' '.$unit.'.');""")

          replace_once('recipes.php',
          "$canEdit=app_has_permission('recipes.edit',$user);$canMap=app_has_permission('recipes.ai_map',$user);",
          "$canEdit=app_has_permission('recipes.edit',$user);$canMap=app_has_permission('recipes.ai_map',$user);$canAgent=app_has_permission('recipes.agent',$user);")
          replace_once('recipes.php',
          ".recipe-list{display:grid;gap:7px;margin-top:10px}.recipe-card{",
          ".recipe-list{display:grid;gap:7px;margin-top:10px}.recipe-agent{margin-top:14px;padding:13px;border:1px solid #ead2c9;border-radius:14px;background:linear-gradient(145deg,#fff,#fff7f4)}.recipe-agent h3{margin:0 0 6px;font-size:13px}.recipe-agent p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.recipe-agent .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.recipe-agent .quick button{border:1px solid #ead2c9;border-radius:999px;background:#fff;padding:6px 8px;font-size:9px;font-weight:800;cursor:pointer}.recipe-card{")
          replace_once('recipes.php',
          '<div class="app"><aside class="sidebar"><div class="sidebar-head"><h2>Recipes</h2><span class="status" id="recipeCount">0</span></div><input class="field" id="search" placeholder="Search recipes, ingredients, source..."><div class="recipe-list" id="recipeList"></div></aside>',
          '<div class="app"><aside class="sidebar"><div class="sidebar-head"><h2>Recipes</h2><span class="status" id="recipeCount">0</span></div><input class="field" id="search" placeholder="Search recipes, ingredients, source..."><div class="recipe-list" id="recipeList"></div><section class="recipe-agent"><h3>Recipe + Production Standards Agent</h3><p>Uses the shared Gelato Agent. The selected recipe ID is sent as context and the canonical recipe is re-resolved on the server.</p><?php if($canAgent): ?><div class="quick"><button data-recipe-agent-prompt="Show recipe production standards that need attention">Standards gaps</button><button data-recipe-agent-prompt="How do we make this recipe?">This recipe</button><button data-recipe-agent-prompt="Scale this recipe to 40 portions">Scale to 40</button><button data-recipe-agent-prompt="Check this recipe for common allergen keywords">Allergen screen</button></div><?php else: ?><p style="margin-top:8px">Your role does not include Recipe Agent access.</p><?php endif; ?></section></aside>')
          replace_once('recipes.php',
          "async function openRecipe(id){activeId=id;const d=await api('api/recipes.php?action=detail&id='+encodeURIComponent(id));detail=d;renderEditor();loadList()}",
          "async function openRecipe(id){activeId=id;const d=await api('api/recipes.php?action=detail&id='+encodeURIComponent(id));detail=d;renderEditor();await loadList();window.GelatoRecipeAgentContext?.publish?.();document.dispatchEvent(new CustomEvent('gelato-recipe-selected',{detail:{id:activeId}}))}")
          replace_once('recipes.php',
          "toast('Recipe archived');loadList()}",
          "toast('Recipe archived');await loadList();window.GelatoRecipeAgentContext?.publish?.()}")
          replace_once('recipes.php',
          "};document.getElementById('search').addEventListener('input',()=>{clearTimeout(window._rq);window._rq=setTimeout(loadList,180)});loadList().catch(e=>alert(e.message));})();",
          "};document.querySelectorAll('[data-recipe-agent-prompt]').forEach(button=>button.addEventListener('click',()=>window.GelatoGlobalAgent?.send?.(button.dataset.recipeAgentPrompt||'')));document.getElementById('search').addEventListener('input',()=>{clearTimeout(window._rq);window._rq=setTimeout(loadList,180)});loadList().catch(e=>alert(e.message));})();")
          replace_once('recipes.php',
          '</script><script src="js/universal-admin-page-shell.js?v=20260915-1"></script>',
          '</script><script src="js/agent-page-context.js?v=20260916-1"></script><script src="js/recipe-agent-context.js?v=20260916-1"></script><script src="js/global-agent.js?v=20260916-1"></script><script src="js/dynamic-agent-canvas.js?v=20260916-1"></script><script src="js/universal-admin-page-shell.js?v=20260915-3"></script>')
          PY
          python /tmp/recipe-branch-patch.py
          php -l recipes.php
          php -l includes/recipe-agent-core.php
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- recipes.php includes/recipe-agent-core.php; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.php includes/recipe-agent-core.php
          git commit -m "Wire Recipe Agent into recipe page and harden yield parsing"
          git push origin HEAD:recipes-production-standards-agent-20260916
