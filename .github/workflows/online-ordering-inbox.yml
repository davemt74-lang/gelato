name: Online Ordering + Customer Inbox

on:
  pull_request:
    paths:
      - 'online-order.php'
      - 'customer-account.php'
      - 'customer-login.php'
      - 'customer-signup.php'
      - 'customer-promotions.php'
      - 'upgrade.php'
      - 'includes/*.php'
      - 'assets/js/online-order.js'
      - 'assets/css/online-order.css'
      - 'assets/css/customer-account.css'
      - 'assets/css/customer-inbox.css'
      - 'database/*.sql'
      - 'tests/online-ordering-inbox-contract.php'
      - 'tests/online-order-runtime-gate-contract.php'
      - '.github/workflows/online-ordering-inbox.yml'
  push:
    branches: [main]

jobs:
  online-ordering-inbox:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l online-order.php
          php -l customer-account.php
          php -l customer-login.php
          php -l customer-signup.php
          php -l customer-promotions.php
          php -l upgrade.php
          php -l includes/public-site.php
          php -l includes/online-order-core.php
          php -l includes/customer-account-core.php
          php -l includes/customer-inbox-core.php
          php -l includes/customer-crm-core.php
          php -l includes/location-core.php
          php -l includes/pos-core.php
          php -l includes/kds-core.php
          php -l includes/UpgradeService.php
          php -l tests/online-ordering-inbox-contract.php
          php -l tests/online-order-runtime-gate-contract.php
          node --check assets/js/online-order.js
      - name: Static commerce and privacy contract
        run: |
          grep -q 'CREATE TABLE customer_inbox_messages' database/20261004_online_ordering_customer_inbox.sql
          grep -q 'CREATE TABLE customer_inbox_recipients' database/20261004_online_ordering_customer_inbox.sql
          grep -q 'CREATE TABLE customer_inbox_preferences' database/20261004_online_ordering_customer_inbox.sql
          grep -q 'CREATE TABLE online_orders' database/20261004_online_ordering_customer_inbox.sql
          grep -q 'uq_online_order_idempotency' database/20261004_online_ordering_customer_inbox.sql
          grep -q 'customer_promotions.manage' database/20261004_online_ordering_customer_inbox.sql
          grep -q "'pay_at_pickup'" includes/online-order-core.php
          grep -q 'pos_create_check' includes/online-order-core.php
          grep -q 'pos_add_item' includes/online-order-core.php
          grep -q 'kds_send_check' includes/online-order-core.php
          grep -q 'customer_inbox_send_direct' includes/online-order-core.php
          grep -q 'online_order_missing_requirements' includes/online-order-core.php
          ! grep -q 'pos_ready($pdo)' includes/online-order-core.php
          grep -q 'COALESCE(pref.promotions_enabled,1)=1' includes/customer-inbox-core.php
          grep -q 'Turning this off does not block transactional order updates' customer-account.php
          grep -q 'No card information is collected' online-order.php
          ! grep -Eqi 'card_number|cvv|track_data|magstripe' database/20261004_online_ordering_customer_inbox.sql
      - name: Production runtime gate contract
        run: php tests/online-order-runtime-gate-contract.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client zip
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_online_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify ordering dependency schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('sales_integrations','pos_settings','pos_checks','pos_check_items','pos_tenders','crm_customers','customer_inbox_messages','customer_inbox_recipients','customer_inbox_preferences','online_orders');")" = "10"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='locations' AND column_name IN ('public_slug','pickup_enabled','online_ordering_enabled','pickup_lead_minutes');")" = "4"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='crm_customers' AND column_name='user_id';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('customer.portal','online_ordering.use','customer_promotions.manage');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key IN ('20260914_zzzzzzz_sales_demand_intelligence','20260916_native_pos','20260917_customer_crm','20261001_system_user_types_pos_order_types','20261002_customer_accounts_online_ordering_foundation','20261003_location_foundation','20261004_online_ordering_customer_inbox');")" = "7"
      - name: Online ordering and Inbox behavioral contract
        run: php tests/online-ordering-inbox-contract.php
      - name: Customer account regression
        run: php tests/customer-account-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Location regression
        run: php tests/location-foundation-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
      - name: Build dependency-complete direct deploy ZIP
        run: |
          rm -rf deploy-patch stonefellows-online-ordering-recovery-deploy.zip
          mkdir -p deploy-patch/includes deploy-patch/assets/js deploy-patch/assets/css deploy-patch/database
          cp online-order.php customer-account.php customer-login.php customer-signup.php customer-promotions.php upgrade.php deploy-patch/
          cp includes/*.php deploy-patch/includes/
          cp assets/js/online-order.js deploy-patch/assets/js/
          cp assets/css/online-order.css assets/css/customer-account.css assets/css/customer-inbox.css deploy-patch/assets/css/
          for migration in database/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            name="$(basename "$migration")"
            case "$name" in
              *_demo_*|*_sample_*|*_seed_*) continue ;;
            esac
            cp "$migration" deploy-patch/database/
          done
          test -f deploy-patch/includes/public-site.php
          test -f deploy-patch/includes/online-order-core.php
          test -f deploy-patch/includes/customer-account-core.php
          test -f deploy-patch/includes/customer-crm-core.php
          test -f deploy-patch/includes/location-core.php
          test -f deploy-patch/includes/pos-core.php
          test -f deploy-patch/includes/UpgradeService.php
          test -f deploy-patch/database/20260914_zzzzzzz_sales_demand_intelligence.sql
          test -f deploy-patch/database/20260916_native_pos.sql
          test -f deploy-patch/database/20260917_customer_crm.sql
          test -f deploy-patch/database/20261001_system_user_types_pos_order_types.sql
          test -f deploy-patch/database/20261002_customer_accounts_online_ordering_foundation.sql
          test -f deploy-patch/database/20261003_location_foundation.sql
          test -f deploy-patch/database/20261004_online_ordering_customer_inbox.sql
          cat > deploy-patch/README-DEPLOY.txt <<'EOF'
          Stonefellows / Gelato online ordering production recovery deploy

          This is a direct deploy package. Extract its contents into the application
          web root, preserving folders and overwriting the included files.

          IMPORTANT: after copying the files, sign in as the owner/administrator and
          run upgrade.php -> Upgrade once. The package includes the complete production
          migration set so an installation that missed an earlier POS, CRM, customer,
          location, or ordering migration can catch up in dependency order.

          The package also includes the current /includes runtime as a unit so the
          ordering page cannot be paired with stale helper/core files from an older deploy.

          Online ordering requires:
          - sales integration foundation used by native POS
          - native POS tables
          - customer CRM + POS customer linkage
          - Customer system role and customer-facing permissions
          - canonical location ordering fields
          - online order + customer Inbox tables

          KDS remains optional at runtime; when installed, online pickup orders are routed
          into the kitchen workflow automatically.

          Online payment capture and delivery checkout are intentionally not included yet.
          EOF
          (cd deploy-patch && zip -qr ../stonefellows-online-ordering-recovery-deploy.zip .)
          unzip -t stonefellows-online-ordering-recovery-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-online-ordering-recovery-deploy
          path: stonefellows-online-ordering-recovery-deploy.zip
          if-no-files-found: error
          retention-days: 30
