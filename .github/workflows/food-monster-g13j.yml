name: FM-G13J Source-Bound Training Acknowledgement
on:
  pull_request:
    paths:
      - 'includes/food-monster-g13j-refresh.php'
      - 'includes/food-monster-g13c-training.php'
      - 'includes/food-monster-g13i-training-impact.php'
      - 'api/food-monster-training.php'
      - 'api/food-monster-training-impact.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g13j-refresh.php'
      - 'tests/food-monster-g13j-mysql.php'
      - '.github/workflows/food-monster-g13j.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-g13j-refresh.php'
      - 'includes/food-monster-g13c-training.php'
      - 'includes/food-monster-g13i-training-impact.php'
      - 'api/food-monster-training.php'
      - 'api/food-monster-training-impact.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g13j-refresh.php'
      - 'tests/food-monster-g13j-mysql.php'
      - '.github/workflows/food-monster-g13j.yml'
jobs:
  acknowledgement-and-source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, routing and Agent Brain layout
        run: |
          php -l includes/food-monster-g13j-refresh.php
          php -l includes/food-monster-g13c-training.php
          php -l includes/food-monster-g13i-training-impact.php
          php -l api/food-monster-training.php
          php -l api/food-monster-training-impact.php
          php -l tests/food-monster-g13j-refresh.php
          php -l agent-canvas.php
          node --check js/agent-canvas.js
      - name: Acknowledgement, speaker safety and training regression chain
        run: |
          php tests/food-monster-g13j-refresh.php
          php tests/food-monster-g13i-impact.php
          php tests/food-monster-g13h-audit.php
          php tests/food-monster-g13g-history.php
          php tests/food-monster-g13f-procedures.php
          php tests/food-monster-g13e-intelligence.php
          php tests/food-monster-g13d-dialogue.php
          php tests/food-monster-g13c-training.php
          php tests/food-monster-g13b-knowledge.php
          php tests/food-monster-g13a-engagement.php
          php tests/food-monster-g9f-approvals.php
          node tests/food-monster-g10b-turns.test.cjs
          node tests/food-monster-g11b-turns.test.cjs
  mysql-personal-state-certification:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: g13j_cert_only
          MYSQL_DATABASE: gelato_fm_cert
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pg13j_cert_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      G13J_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=gelato_fm_cert;charset=utf8mb4
      G13J_MYSQL_USER: root
      G13J_MYSQL_PASS: g13j_cert_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Certify person-scoped canonical acknowledgement state in MySQL
        run: php tests/food-monster-g13j-mysql.php
