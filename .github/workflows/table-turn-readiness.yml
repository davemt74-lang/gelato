name: Table Turn + Host Readiness

on:
  pull_request:
    paths:
      - 'database/20260925_table_turn_host_readiness.sql'
      - 'includes/table-turn-policy.php'
      - 'includes/table-turn-readiness.php'
      - 'includes/service-seatability.php'
      - 'includes/service-reservation-protection.php'
      - 'api/host-stand.php'
      - 'host-stand.php'
      - 'js/table-turn-readiness.js'
      - 'tests/table-turn-readiness-contract.php'
      - '.github/workflows/table-turn-readiness.yml'
  push:
    branches: [main]

jobs:
  table-turn-readiness:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/table-turn-policy.php
          php -l includes/table-turn-readiness.php
          php -l includes/service-seatability.php
          php -l includes/service-reservation-protection.php
          php -l api/host-stand.php
          php -l host-stand.php
          php -l tests/table-turn-readiness-contract.php
          node --check js/table-turn-readiness.js
          node --check js/table-cleaning-controls.js
          node --check js/host-stand.js
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS table_turn_policies' database/20260925_table_turn_host_readiness.sql
          grep -q 'reset_target_minutes' database/20260925_table_turn_host_readiness.sql
          grep -q 'ready_buffer_minutes' database/20260925_table_turn_host_readiness.sql
          grep -q 'urgent_threshold_minutes' database/20260925_table_turn_host_readiness.sql
          grep -q 'function table_turn_policy_save' includes/table-turn-policy.php
          grep -q 'function table_turn_readiness_queue' includes/table-turn-readiness.php
          grep -q 'function table_turn_reset_metrics' includes/table-turn-readiness.php
          grep -q 'UNIX_TIMESTAMP(created_at)' includes/table-turn-readiness.php
          grep -q 'Metric fixture next day' tests/table-turn-readiness-contract.php
          grep -q 'FROM_UNIXTIME' tests/table-turn-readiness-contract.php
          grep -q 'table_turn_reset_minutes' includes/service-seatability.php
          grep -q 'table_turn_ready_buffer_minutes' includes/service-reservation-protection.php
          grep -q "turn_policy.save" api/host-stand.php
          grep -q 'table-turn-readiness.js' host-stand.php
          grep -q 'performancescore' tests/table-turn-readiness-contract.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify readiness schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='table_turn_policies';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='table_turn_policies' AND column_name IN ('reset_target_minutes','ready_buffer_minutes','urgent_threshold_minutes');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260925_table_turn_host_readiness';")" = "1"
      - name: Table turn readiness behavioral contract
        run: php tests/table-turn-readiness-contract.php
      - name: Table cleaning lifecycle regression
        run: php tests/table-cleaning-lifecycle-contract.php
      - name: Table concurrency regression
        run: php tests/table-concurrency-contract.php
      - name: Upcoming reservation protection regression
        run: php tests/upcoming-reservation-protection-contract.php
      - name: Seatability regression
        run: php tests/table-seatability-contract.php
      - name: Dining visit lifecycle regression
        run: php tests/dining-visit-lifecycle-contract.php
      - name: Recent table-host hardening regression
        run: php tests/table-host-hardening-contract.php
      - name: Host Stand regression
        run: php tests/host-stand-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: Table Service reconciliation regression
        run: php tests/table-service-reconcile-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Daily Manager regression
        run: php tests/daily-manager-contract.php
      - name: Upgrader checksum and idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
