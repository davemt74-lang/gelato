name: Food Monster B8D1 Conversation Foundation

on:
  pull_request:
    paths:
      - 'api/agent-workspace.php'
      - 'includes/food-monster-conversation-router.php'
      - 'includes/food-monster-unified-knowledge.php'
      - 'includes/food-monster-llm.php'
      - 'js/global-agent.js'
      - 'tests/food-monster-b8d1-conversation-foundation.php'
      - '.github/workflows/food-monster-b8d1-conversation.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conversation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l includes/food-monster-conversation-router.php
          php -l includes/food-monster-unified-knowledge.php
          php -l includes/food-monster-llm.php
          php -l api/agent-workspace.php
          php -l tests/food-monster-b8d1-conversation-foundation.php
      - name: Conversation routing and evidence regression
        run: php tests/food-monster-b8d1-conversation-foundation.php
      - name: Existing grounded-knowledge regression
        run: php tests/food-monster-unified-knowledge.php
      - name: Existing provider isolation regression
        run: php tests/food-monster-g12e-llm-isolation.php
