name: Capture current Gelato menu snapshot

on:
  push:
    branches: [gelato-menu-sync]
    paths:
      - '.github/workflows/capture-current-menu-snapshot.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gelato-menu-sync
          fetch-depth: 0

      - name: Capture and validate current public menu
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H 'Accept: application/json' \
            https://gelato.spot/api/v1/menu -o /tmp/live-menu.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('/tmp/live-menu.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          sections = payload.get('sections')
          if not isinstance(sections, list) or not sections:
              raise SystemExit('Live menu payload has no sections')
          item_count = sum(len(section.get('items') or []) for section in sections if isinstance(section, dict))
          if len(sections) < 8 or item_count < 75:
              raise SystemExit(f'Unexpectedly small live menu: {len(sections)} sections / {item_count} items')
          names = {str(section.get('slug','')) for section in sections if isinstance(section, dict)}
          required = {'appetizers','panini','wood-fired-pizza','gelato'}
          if not required.issubset(names):
              raise SystemExit(f'Missing expected menu sections: {sorted(required-names)}')
          payload['snapshotCapturedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          payload['snapshotPurpose'] = 'Bundled install-safe menu import; live REST/MCP are optional after deployment.'
          Path('data/gelato-menu-scan.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Captured {len(sections)} sections / {item_count} items')
          PY

      - name: Verify importer accepts captured snapshot
        shell: bash
        run: |
          cp config-example.php config.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('config.php')
          t=p.read_text(encoding='utf-8')
          p.write_text(t,encoding='utf-8')
          PY
          php -l scripts/sync-gelato-menu.php
          php -l includes/menu-sync.php
          php -r '$p=json_decode(file_get_contents("data/gelato-menu-scan.json"),true,512,JSON_THROW_ON_ERROR);if(!is_array($p["sections"]??null)){exit(1);}echo "Snapshot JSON valid\n";'

      - name: Remove one-time workflow and commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-current-menu-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gelato-menu-scan.json .github/workflows/capture-current-menu-snapshot.yml
          git diff --cached --quiet && exit 0
          git commit -m "Capture full current Gelato menu snapshot"
          git push origin HEAD:gelato-menu-sync
