name: B8D17D Confirmed Inventory Actions

on:
  pull_request:
    paths:
      - 'api/operations-agent.php'
      - 'includes/operations-agent-inventory-actions.php'
      - 'includes/operations-agent-task-actions.php'
      - 'includes/operations-core.php'
      - 'config/food-monster-capability-map.json'
      - 'tests/food-monster-b8d17d-inventory-actions.php'
      - 'tests/food-monster-b8d17f-task-status.php'
      - '.github/workflows/food-monster-b8d17d-inventory-actions.yml'
  push:
    branches: [main]
    paths:
      - 'api/operations-agent.php'
      - 'includes/operations-agent-inventory-actions.php'
      - 'includes/operations-core.php'
      - 'config/food-monster-capability-map.json'
      - 'tests/food-monster-b8d17d-inventory-actions.php'

permissions:
  contents: read

jobs:
  inventory-confirmation-contract:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_b8d17d_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite
      - name: Syntax and request safety
        run: |
          php -l api/operations-agent.php
          php -l api/operations.php
          php -l includes/operations-agent-inventory-actions.php
          php -l includes/operations-agent-task-actions.php
          php -l includes/operations-core.php
          php -l tests/food-monster-b8d17d-inventory-actions.php
          php -l tests/food-monster-b8d17f-task-status.php
      - name: Parser, authorization, transactional replay and source registry
        env:
          B8D17D_DSN: mysql:host=127.0.0.1;port=3306;dbname=gelato_b8d17d_ci
          B8D17D_USER: root
          B8D17D_PASS: root
        run: |
          php tests/food-monster-b8d17d-inventory-actions.php
          php tests/food-monster-b8d17f-task-status.php
          php tests/food-monster-b8c-capability-map.php
