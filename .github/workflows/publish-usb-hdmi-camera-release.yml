name: Release Gelato Section 285C

on:
  workflow_run:
    workflows: ["Full Deploy Package"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-direct-zip:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == 'davemt74-lang/gelato' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip once Section 285C release exists
        id: already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gelato-section-285c --repo davemt74-lang/gelato >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve exact certified main build
        if: steps.already.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "$BUILD_RUN_ID" --repo davemt74-lang/gelato \
            --name gelato-full-deploy --dir payload
          test -s payload/gelato-full-deploy.zip
          test -s payload/gelato-full-deploy.sha256

      - name: Verify checksum, source revision and private data exclusions
        if: steps.already.outputs.exists != 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          # The CI-generated checksum records its runner's absolute path;
          # validate the digest against our actual downloaded asset instead.
          expected="$(awk 'NR==1 { print $1 }' gelato-full-deploy.sha256)"
          [[ "$expected" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" 'gelato-full-deploy.zip' | sha256sum --check -
          unzip -tq gelato-full-deploy.zip
          actual="$(unzip -p gelato-full-deploy.zip DEPLOY_SHA.txt | tr -d '\r\n')"
          test "$actual" = "$EXPECTED_SHA"
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/vendor/mediapipe/hand_landmarker.task'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'glasses-simulator.php'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-usb-hdmi-inputs.test.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/js/glasses-camera-sources.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/js/glasses-pov-calibration.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-section284-pov-sdk-sources.test.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/js/glasses-production-ticket-focus.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-section285a-production-ticket-focus.test.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/js/glasses-production-auto-focus.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-section285b-production-auto-focus.test.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/js/glasses-shared-camera-recognition.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-section285c-shared-model.test.js'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-section285c-live-inference.test.js'
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(config\.php|\.env|uploads/|storage/)'; then
            echo 'Private live config/state unexpectedly included.' >&2
            exit 1
          fi

      - name: Publish actual deploy ZIP, not an artifact wrapper
        if: steps.already.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create gelato-section-285c \
            payload/gelato-full-deploy.zip \
            payload/gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target "$EXPECTED_SHA" \
            --title 'Gelato — Section 285C Shared Stationary-Camera Recognition' \
            --notes 'Section 285C shared camera recognition: one explicitly approved ONNX model session processes Camera 1 and active stationary Cameras 2–5; serialized inference, source-scoped observations, station assignment checks, fail-closed disconnect and model recovery. Stationary evidence is read-only, does not verify ingredient placement or mutate KDS. Genuine AIR3 SDK and real-kitchen accuracy qualification remain pending.'
