name: Release USB and HDMI Camera Deploy ZIP

on:
  workflow_run:
    workflows: ["Full Deploy Package"]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-direct-zip:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == 'davemt74-lang/gelato' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip once USB and HDMI release exists
        id: already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gelato-usb-hdmi-inputs --repo davemt74-lang/gelato >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve exact certified main build
        if: steps.already.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "$BUILD_RUN_ID" --repo davemt74-lang/gelato \
            --name gelato-full-deploy --dir payload
          test -s payload/gelato-full-deploy.zip
          test -s payload/gelato-full-deploy.sha256

      - name: Verify checksum, source revision and private data exclusions
        if: steps.already.outputs.exists != 'true'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          sha256sum --check gelato-full-deploy.sha256
          unzip -tq gelato-full-deploy.zip
          actual="$(unzip -p gelato-full-deploy.zip DEPLOY_SHA.txt | tr -d '\r\n')"
          test "$actual" = "$EXPECTED_SHA"
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'assets/vendor/mediapipe/hand_landmarker.task'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'glasses-simulator.php'
          unzip -Z1 gelato-full-deploy.zip | grep -Fx 'tests/glasses-usb-hdmi-inputs.test.js'
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(config\.php|\.env|uploads/|storage/)'; then
            echo 'Private live config/state unexpectedly included.' >&2
            exit 1
          fi

      - name: Publish actual deploy ZIP, not an artifact wrapper
        if: steps.already.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create gelato-usb-hdmi-inputs \
            payload/gelato-full-deploy.zip \
            payload/gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target "$EXPECTED_SHA" \
            --title 'Gelato — USB and HDMI Camera Inputs' \
            --notes 'Full certified deployment ZIP. USB webcams remain supported, alongside HDMI video from Windows-recognized capture adapters. Extract into the app root, preserve existing configuration/uploads/storage, then run upgrade.php. Live iPhone HDMI capture field testing is still required.'
