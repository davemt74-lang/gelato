name: Stonefellows public site
on:
  pull_request:
    paths:
      - '.github/workflows/public-site-contract.yml'
      - 'index.php'
      - 'menu.php'
      - 'gelato.php'
      - 'about.php'
      - 'contact.php'
      - 'locations.php'
      - 'jobs.html'
      - 'job.php'
      - 'apply.html'
      - 'catering.php'
      - 'wholesale.php'
      - 'login.php'
      - 'login.html'
      - 'forgot-password.php'
      - 'reset-password.php'
      - 'workspace.php'
      - 'public-site-settings.php'
      - 'assets/**'
      - 'css/public.css'
      - 'css/stonefellows-public.css'
      - 'css/stonefellows-public-v2.css'
      - 'js/public-account-menu.js'
      - 'includes/public-site.php'
      - 'includes/menu-sync.php'
      - 'database/20260914_public_site_settings.sql'
      - 'tests/public-site-contract.php'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint public and workspace PHP
        run: |
          set -euo pipefail
          for f in index.php menu.php gelato.php about.php contact.php locations.php job.php catering.php wholesale.php login.php forgot-password.php reset-password.php workspace.php public-site-settings.php includes/public-site.php; do php -l "$f"; done
      - name: Validate JavaScript
        run: |
          node --check assets/js/site.js
          node --check js/public-account-menu.js
          node --check js/public-jobs.js
          node --check js/auth.js
      - name: Enforce root public-site contract
        run: php tests/public-site-contract.php
      - name: Build deploy ZIP
        if: matrix.php-version == '8.3'
        run: git archive --format=zip --output=stonefellows-deploy.zip HEAD
      - name: Upload deploy ZIP
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: stonefellows-deploy
          path: stonefellows-deploy.zip
          if-no-files-found: error
