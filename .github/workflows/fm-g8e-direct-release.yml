name: FM-G8E Certified Full Deployment Release
on:
  push:
    branches:
      - delivery/fm-g8e-unified-onboarding
    paths:
      - .github/workflows/fm-g8e-direct-release.yml
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Confirm release not already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gelato-fm-g8e --repo davemt74-lang/gelato >/dev/null 2>&1; then
            echo 'yes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'yes=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for exact merged main deployment build
        if: steps.exists.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            state="$(gh run view 38794698528 --repo davemt74-lang/gelato --json status,conclusion,headSha --jq '[.status,.conclusion,.headSha]|join(" ")')"
            echo "FM-G8E merged main package: $state"
            if [[ "$state" == "completed success a4fddb0663612261640fdb95e9c26c7e4a47697a" ]]; then exit 0; fi
            if [[ "$state" == completed\ * && "$state" != "completed success a4fddb0663612261640fdb95e9c26c7e4a47697a" ]]; then exit 1; fi
            sleep 20
          done
          echo "Timed out waiting for merged main deploy" >&2;exit 1
      - name: Certify immutable merged deployment and checksum
        if: steps.exists.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tested
          gh run download 38794698528 --repo davemt74-lang/gelato --name gelato-full-deploy --dir tested
          test -s tested/gelato-full-deploy.zip
          test -s tested/gelato-full-deploy.sha256
          expected="$(awk 'NR==1 {print $1}' tested/gelato-full-deploy.sha256)"
          printf '%s  %s\n' "$expected" tested/gelato-full-deploy.zip | sha256sum -c -
          unzip -tq tested/gelato-full-deploy.zip
          test "$(unzip -p tested/gelato-full-deploy.zip DEPLOY_SHA.txt | tr -d '\r\n')" = 'a4fddb0663612261640fdb95e9c26c7e4a47697a'
          for f in food-monster.php js/food-monster-participants.js js/food-monster-onboarding.js \
            js/food-monster-fast-enroll.js includes/food-monster-onboarding.php \
            api/food-monster-onboarding.php js/food-monster-participant-history.js \
            tests/food-monster-g8e-browser.test.cjs \
            assets/vendor/mediapipe/hand_landmarker.task \
            assets/vendor/mediapipe/vision_bundle.mjs \
            assets/vendor/mediapipe/wasm/vision_wasm_internal.wasm; do
            unzip -p tested/gelato-full-deploy.zip "$f" >/dev/null || exit 1
          done
          if unzip -Z1 tested/gelato-full-deploy.zip | grep -Eq '^(config\.php|\.env|uploads/|storage/)'; then
            echo "Private environment content included" >&2;exit 1
          fi
          cp tested/gelato-full-deploy.zip ./gelato-full-deploy.zip
          sha256sum gelato-full-deploy.zip > gelato-full-deploy.sha256
      - name: Publish GitHub Release with complete HostGator ZIP
        if: steps.exists.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create gelato-fm-g8e gelato-full-deploy.zip gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target a4fddb0663612261640fdb95e9c26c7e4a47697a \
            --title 'Gelato FM-G8E — Unified Participant Onboarding and Minimal Cards' \
            --notes 'Full HostGator deployment from certified merged main. PR #325 and 9/9 workflows green, identical source tree. Right sidebar contains only active participant cards with individual input meters. Existing schedule/user data drives conversational onboarding; the verified account holder may self-enroll; manual account matching does not authenticate a user; user permissions and PIN/password rules remain enforced. Voice/photo capture remains consent based. Full MediaPipe bundle included. Preserve config.php, .env, uploads/ and storage/ (especially storage/keys/application.key). Run protected upgrade.php and hard-refresh browser. Physical camera/voice accuracy and <20s capture require field validation.'
