name: Complete Menu Operations Agent Actions

on:
  push:
    branches:
      - feature/menu-operations-agent-brain
    paths:
      - '.github/workflows/_complete_menu_agent_actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/menu-operations-agent-brain
          fetch-depth: 0
      - name: Apply remaining central Agent actions
        run: python3 scripts/_complete_menu_agent_actions.py
      - name: Validate source
        run: php -l api/agent-brain.php
      - name: Remove patch machinery and commit
        run: |
          rm -f .github/workflows/_complete_menu_agent_actions.yml scripts/_complete_menu_agent_actions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Expose complete Menu Operations controls through central Agent Brain'
          git push origin HEAD:feature/menu-operations-agent-brain
