name: Package PR87 Admin Navigation Deploy

on:
  push:
    branches:
      - fix/admin-floor-planner-location-nav

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-floor-planner-location-nav
      - name: Build direct deploy ZIP
        run: |
          cat > README-DEPLOY.txt <<'EOF'
          Stonefellows PR #87 — Admin navigation + Floor Planner exit

          Extract this ZIP directly into the application web root and overwrite the included files.
          Preserve the includes/ and js/ folders.

          Changes:
          - Floor Planner Back/Exit returns to admin.php.
          - Restaurant Admin exposes Locations for users with locations.manage.
          - Admin Workspace module opens workspace.php instead of public index.php.

          No database migration or Upgrade run is required.
          EOF
          zip -q stonefellows-admin-navigation-deploy.zip \
            admin.php \
            floor-planner-ops-legacy.php \
            includes/admin-control-core.php \
            js/floor-planner-ops.js \
            README-DEPLOY.txt
          unzip -t stonefellows-admin-navigation-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-admin-navigation-deploy
          path: stonefellows-admin-navigation-deploy.zip
          if-no-files-found: error
