name: Wholesale Commerce + Acquisition

on:
  pull_request:
    paths:
      - 'database/20260926_wholesale_commerce_acquisition.sql'
      - 'database/20260926_zz_wholesale_commerce_fks.sql'
      - 'includes/wholesale-commerce.php'
      - 'includes/wholesale-acquisition.php'
      - 'api/wholesale-commerce.php'
      - 'api/wholesale-acquisition.php'
      - 'api/wholesale-accounts.php'
      - 'api/wholesale-portal.php'
      - 'wholesale-commerce.php'
      - 'wholesale-acquisition.php'
      - 'wholesale-order-entry.php'
      - 'wholesale-accounts.php'
      - 'wholesale-pipeline.php'
      - 'tests/wholesale-commerce-acquisition-contract.php'
      - '.github/workflows/wholesale-commerce-acquisition.yml'
  push:
    branches: [main]

jobs:
  wholesale-commerce-acquisition:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/wholesale-commerce.php
          php -l includes/wholesale-acquisition.php
          php -l api/wholesale-commerce.php
          php -l api/wholesale-acquisition.php
          php -l api/wholesale-accounts.php
          php -l api/wholesale-portal.php
          php -l wholesale-commerce.php
          php -l wholesale-acquisition.php
          php -l wholesale-order-entry.php
          php -l wholesale-accounts.php
          php -l wholesale-pipeline.php
          php -l tests/wholesale-commerce-acquisition-contract.php
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_products' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_skus' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_price_lists' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_quote_items' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_order_items' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'CREATE TABLE IF NOT EXISTS wholesale_acquisition_profiles' database/20260926_wholesale_commerce_acquisition.sql
          grep -q 'fk_wholesale_quotes_price_list' database/20260926_zz_wholesale_commerce_fks.sql
          grep -q 'fk_wholesale_orders_price_list' database/20260926_zz_wholesale_commerce_fks.sql
          grep -q 'wholesale_commerce_resolve_lines' includes/wholesale-commerce.php
          grep -q 'wholesale_commerce_totals' includes/wholesale-commerce.php
          grep -q 'staff_acquisition_worksheet' includes/wholesale-acquisition.php
          grep -q "action:isQuote?'quote':'order'" wholesale-order-entry.php
          ! grep -q 'CREATE TABLE IF NOT EXISTS wholesale_inventory' database/20260926_wholesale_commerce_acquisition.sql
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('wholesale_products','wholesale_skus','wholesale_price_lists','wholesale_price_list_items','wholesale_account_price_lists','wholesale_quote_items','wholesale_order_items','wholesale_quote_events','wholesale_order_events','wholesale_acquisition_profiles');")" = "10"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key IN ('20260926_wholesale_commerce_acquisition','20260926_zz_wholesale_commerce_fks');")" = "2"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=DATABASE() AND constraint_name IN ('fk_wholesale_quotes_price_list','fk_wholesale_orders_price_list');")" = "2"
      - name: Commerce and acquisition behavior
        run: php tests/wholesale-commerce-acquisition-contract.php
      - name: Existing wholesale Operations regression
        run: php tests/operations-wholesale-contract.php
      - name: Existing Prep Intelligence regression
        run: php tests/prep-inventory-intelligence-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
