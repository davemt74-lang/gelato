name: Menu Manager + Add Food Builder

on:
  pull_request:
    paths:
      - 'menu-manager.php'
      - 'menu.php'
      - 'online-order.php'
      - 'api/menu-manager.php'
      - 'api/online-order-customizations.php'
      - 'api/packages.php'
      - 'includes/menu-manager-core.php'
      - 'includes/menu-order-integration.php'
      - 'includes/admin-add-actions.php'
      - 'database/20261008_menu_manager_food_builder.sql'
      - 'database/20261008_menu_manager_section_timestamp.sql'
      - 'assets/css/menu-manager.css'
      - 'assets/js/menu-manager.js'
      - 'assets/js/online-order-food.js'
      - 'tests/menu-manager-food-builder-contract.php'
      - 'tests/global-add-action-canvas-contract.php'
      - '.github/workflows/menu-manager-food-builder.yml'
  push:
    branches: [main]

jobs:
  food-builder:
    name: Menu Manager PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l menu-manager.php
          php -l menu.php
          php -l online-order.php
          php -l api/menu-manager.php
          php -l api/online-order-customizations.php
          php -l api/packages.php
          php -l includes/menu-manager-core.php
          php -l includes/menu-order-integration.php
          php -l tests/menu-manager-food-builder-contract.php
          php -l tests/global-add-action-canvas-contract.php
          node --check assets/js/menu-manager.js
          node --check assets/js/online-order-food.js
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE menu_item_profiles' database/20261008_menu_manager_food_builder.sql
          grep -q 'CREATE TABLE menu_modifier_groups' database/20261008_menu_manager_food_builder.sql
          grep -q 'CREATE TABLE menu_modifier_options' database/20261008_menu_manager_food_builder.sql
          grep -q 'CREATE TABLE menu_modifier_option_prices' database/20261008_menu_manager_food_builder.sql
          grep -q 'CREATE TABLE pos_check_item_modifiers' database/20261008_menu_manager_food_builder.sql
          grep -q 'modifier_amount' database/20261008_menu_manager_food_builder.sql
          grep -q 'function menu_manager_save_item' includes/menu-manager-core.php
          grep -q 'function menu_manager_customization_addons' includes/menu-manager-core.php
          grep -q 'function menu_order_submit_pickup' includes/menu-order-integration.php
          grep -q 'menu-manager.php?action=add-food' includes/admin-add-actions.php
          grep -q 'Paid add-ons & upgrades' assets/js/menu-manager.js
          grep -q 'priceDeltas' assets/js/menu-manager.js
          grep -q 'Paid add-ons' assets/js/online-order-food.js
          grep -q 'menu_order_submit_pickup' online-order.php
          grep -q "menu_manager_channel_menu.*online_order" online-order.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Menu Manager CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_menu_manager_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify Menu Manager schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('menu_item_profiles','menu_item_location_availability','menu_modifier_groups','menu_modifier_options','menu_modifier_option_prices','pos_check_item_modifiers');")" = "6"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='pos_check_items' AND column_name='modifier_amount';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND table_name='menu_sections' AND column_name='updated_at';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('menu.view','menu.manage');")" = "2"
      - name: Menu Manager Food builder contract
        run: php tests/menu-manager-food-builder-contract.php
      - name: Global Add Canvas regression
        run: php tests/global-add-action-canvas-contract.php
      - name: Online ordering regression
        run: php tests/online-ordering-inbox-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: KDS regression
        run: php tests/kds-contract.php
      - name: Package Deals regression
        run: php tests/package-deals-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP

  deploy-package:
    name: Menu Manager Food Deploy Package
    needs: food-builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct deploy ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip
          rm -rf deploy-patch stonefellows-menu-manager-food-deploy.zip
          mkdir -p deploy-patch/includes deploy-patch/api deploy-patch/assets/css deploy-patch/assets/js deploy-patch/js deploy-patch/css deploy-patch/database
          cp menu-manager.php menu.php online-order.php packages-admin.php packages.php upgrade.php deploy-patch/
          cp api/menu-manager.php api/online-order-customizations.php api/packages.php api/admin-shell.php deploy-patch/api/
          cp includes/*.php deploy-patch/includes/
          cp assets/css/menu-manager.css assets/css/site.css assets/css/online-order.css assets/css/customer-account.css assets/css/packages-admin.css assets/css/packages.css deploy-patch/assets/css/
          cp assets/js/menu-manager.js assets/js/online-order-food.js assets/js/site.js assets/js/public-shell.js assets/js/packages-admin.js assets/js/packages.js deploy-patch/assets/js/
          cp js/universal-admin-page-shell.js js/global-add-canvas.js deploy-patch/js/
          cp css/global-add-canvas.css deploy-patch/css/
          for migration in database/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            name="$(basename "$migration")"
            case "$name" in *_demo_*|*_sample_*|*_seed_*) continue ;; esac
            cp "$migration" deploy-patch/database/
          done
          test -f deploy-patch/menu-manager.php
          test -f deploy-patch/api/menu-manager.php
          test -f deploy-patch/includes/menu-manager-core.php
          test -f deploy-patch/includes/menu-order-integration.php
          test -f deploy-patch/assets/js/menu-manager.js
          test -f deploy-patch/assets/js/online-order-food.js
          test -f deploy-patch/database/20261008_menu_manager_food_builder.sql
          cat > deploy-patch/README-DEPLOY.txt <<'EOF'
          Stonefellows / Gelato Menu Manager + Add Food Builder

          Extract directly into the application web root, preserving folders and
          overwriting the included files. Then sign in as owner/admin and run
          upgrade.php -> Upgrade once.

          This phase adds the editable canonical Menu Manager and multiphase Add Food
          builder: categories, food items, sizes/prices, included ingredients,
          removals/substitutions, paid add-ons such as Extra Cheese / Add Chicken /
          Double Pepperoni, size-specific add-on pricing, channel distribution,
          location availability, preview/publish, pause/archive, and Duplicate Food.

          Published Food items distribute to the public menu and Online Ordering,
          continue through the native POS/KDS path, and can be made available to the
          Package Deals item picker. Paid online add-ons are server-validated and
          added to the canonical POS line total with an auditable modifier ledger.
          EOF
          (cd deploy-patch && zip -qr ../stonefellows-menu-manager-food-deploy.zip .)
          unzip -t stonefellows-menu-manager-food-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-menu-manager-food-deploy
          path: stonefellows-menu-manager-food-deploy.zip
          if-no-files-found: error
          retention-days: 30
