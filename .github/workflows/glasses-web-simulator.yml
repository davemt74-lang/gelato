  pull_request:
    paths:
      - 'glasses-simulator.php'
      - 'api/glasses-simulator.php'
      - 'includes/glasses-simulator.php'
      - 'assets/css/glasses-web-simulator.css'
      - 'assets/js/glasses-web-simulator.js'
      - 'assets/js/glasses-hud-notifications.js'
      - 'assets/js/glasses-employee-runtimes.js'
      - 'assets/js/glasses-assembly-learning.js'
      - 'api/glasses-assembly-learning.php'
      - 'includes/glasses-assembly-learning.php'
      - 'tests/glasses-assembly-learning-contract.test.js'
      - 'tests/glasses-runtime-station-contract.test.js'
      - 'docs/GLASSES-SECTION268-REUSE-AUDIT.md'
      - 'includes/glasses-employee-runtimes.php'
      - 'database/20261214_glasses_employee_runtimes.sql'
