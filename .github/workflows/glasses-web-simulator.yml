      - 'tests/glasses-operator-hud-ux.test.js'
      - 'assets/js/glasses-user-display-preferences.js'
      - 'api/glasses-user-preferences.php'
      - 'database/20261213_glasses_user_display_preferences.sql'
      - 'tests/glasses-session-camera-badges.test.js'
      - 'tests/glasses-user-display-preferences-contract.php'
      - 'tests/glasses-hud-voice-contract.php'
      - 'tests/glasses-live-kds-contract.php'
      - 'tests/glasses-web-simulator-contract.php'
      - 'tests/glasses-live-virtual-preview-contract.php'
