      - '.github/workflows/glasses-web-simulator.yml'
  push:
    branches: ['feature/web-glasses-simulator', 'feature/web-glasses-calibration', 'feature/web-glasses-svg-optics', 'feature/web-glasses-hud-fidelity', 'feature/web-glasses-live-station-sync', 'feature/web-glasses-browser-camera', 'feature/web-glasses-auto-vision', 'feature/web-glasses-temporal-validation', 'feature/web-glasses-real-browser-model', 'feature/vision-dataset-capture-export', 'feature/vision-active-learning-hard-examples', 'feature/vision-shadow-live-evaluation']

jobs:
  web-glasses-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax
        run: |
          php -l glasses-simulator.php
          php -l api/glasses-simulator.php
          php -l api/glasses-camera-locations.php
          php -l api/glasses-camera-photo-library.php
          php -l api/glasses-order-photo-stages.php
          php -l api/glasses-photo-notifications.php
          php -l api/glasses-user-preferences.php
          php -l tests/glasses-user-display-preferences-contract.php
          php -l includes/glasses-customer-photo-notifications.php
          php -l includes/glasses-customer-photo-feedback.php
          php -l tests/glasses-customer-photo-feedback-contract.php
          php -l customer-order-photos.php
          php -l customer-order-photo.php
          php -l customer-account.php
          php -l tests/glasses-customer-photo-policy.php
          php -l includes/glasses-order-photo-stages.php
          php -l tests/glasses-order-photo-stages-contract.php
          php -l includes/glasses-camera-photo-library.php
          php -l tests/glasses-camera-photo-library-contract.php
          php -l includes/glasses-camera-locations.php
          php -l tests/glasses-camera-locations-contract.php
          php -l includes/glasses-simulator.php
          php -l includes/glasses-employee-runtimes.php
          php -l tests/glasses-employee-runtime-contract.php
          php tests/glasses-employee-runtime-contract.php
          php -l tests/glasses-web-simulator-contract.php
          php -l tests/glasses-live-virtual-preview-contract.php
          php -l tests/glasses-hud-voice-contract.php
          php -l tests/glasses-device-tabs-contract.php
          php -l tests/glasses-live-kds-contract.php

      - name: JavaScript syntax
        run: |
          node --check assets/js/glasses-web-simulator.js
          node --check assets/js/glasses-hud-notifications.js
          node --check assets/js/glasses-employee-runtimes.js
          node tests/glasses-runtime-station-contract.test.js
          node --check assets/js/glasses-assembly-learning.js
          node tests/glasses-assembly-learning-contract.test.js
          php -l includes/glasses-assembly-learning.php
          php -l api/glasses-assembly-learning.php
          node --check assets/js/glasses-item-assembly.js
          node --check assets/js/glasses-simulator-voice.js
          node --check assets/js/glasses-voice-device.js
          node --check assets/js/glasses-simulator-tabs.js
          node --check assets/js/glasses-multicamera.js
          node --check assets/js/glasses-camera-config.js
          node --check assets/js/glasses-camera-runtime.js
          node --check assets/js/glasses-camera-workspace.js
          node --check assets/js/glasses-ingredient-training-plan.js
          node --check assets/js/glasses-ingredient-training-studio.js
          node tests/glasses-ingredient-training.test.js
          node --check assets/js/glasses-user-display-preferences.js
          node --check assets/js/glasses-production-photo-flow.js
          node --check assets/js/glasses-customer-photo-notifications.js
          node --check assets/js/glasses-camera-similarity.js
          node --check js/voice-session-presence.js

      - name: Simulator architecture contract
        run: php tests/glasses-web-simulator-contract.php
      - name: Voice HUD controls and navigation regression
        run: |
          php tests/glasses-hud-voice-contract.php
          node tests/glasses-voice-navigation.test.js
          node tests/glasses-simulator-csrf.test.js
          node tests/glasses-live-kds-commands.test.js
          node tests/glasses-hud-manual-voice-parity.test.js
          node tests/glasses-operator-hud-ux.test.js
          node tests/glasses-ticket-ingredient-assembly.test.js
          node --check assets/js/glasses-assembly-recognition.js
          node tests/glasses-assembly-recognition-269.test.js
          php -l includes/glasses-assembly-auto-gate.php
          php -l tests/glasses-assembly-auto-server-contract.php
          php tests/glasses-assembly-auto-server-contract.php
          node tests/glasses-hud-notifications.test.js
          node tests/glasses-session-camera-badges.test.js
          php -l includes/glasses-ingredient-training.php
          php -l api/glasses-ingredient-training.php
          php -l tests/glasses-ingredient-training-contract.php
          php tests/glasses-ingredient-training-contract.php
          php tests/glasses-user-display-preferences-contract.php
          node tests/glasses-training-foundation.test.js
          node tests/glasses-camera-config.test.js
          node tests/glasses-camera-runtime.test.js
          node tests/glasses-camera-photo-library.test.js
          node tests/glasses-production-photo-flow.test.js
          node tests/glasses-customer-photo-notifications.test.js
          node tests/glasses-customer-photo-gallery.test.js
          php tests/glasses-customer-photo-feedback-contract.php
          php tests/glasses-customer-photo-policy.php
          php tests/glasses-order-photo-stages-contract.php
          php tests/glasses-camera-photo-library-contract.php
          php tests/glasses-camera-locations-contract.php
          php tests/glasses-live-kds-contract.php
          node tests/glasses-voice-device.test.js
          node tests/glasses-voice-recovery.test.js
          php tests/glasses-device-tabs-contract.php
      - name: Hardware-free Live access, control state and write isolation
        run: php tests/glasses-live-virtual-preview-contract.php

      - name: Preserve real POS KDS and AR authority
        run: |
          grep -q 'glasses_current_work' includes/glasses-simulator.php
          grep -q 'glasses_build_observe' includes/glasses-simulator.php
          grep -q 'glasses_validation_evaluate' includes/glasses-simulator.php
          grep -q 'glasses_handoff_to_expo' includes/glasses-simulator.php
          grep -q "app_has_permission('kds.update'" includes/glasses-simulator.php
          ! grep -q 'UPDATE kds_order_items' includes/glasses-simulator.php
          grep -q "mode==='mock'" assets/js/glasses-web-simulator.js
          grep -q "mode==='live'" assets/js/glasses-web-simulator.js

      - name: Preserve existing AR contracts
        run: |
          php -l api/glasses-device.php
          php -l includes/glasses-work.php
          php -l includes/glasses-build.php
          php -l includes/glasses-validation.php
          php -l includes/glasses-handoff.php
