      - 'assets/js/glasses-camera-runtime.js'
      - 'tests/glasses-camera-runtime.test.js'
      - 'assets/js/glasses-camera-workspace.js'
      - 'assets/js/glasses-ingredient-training-plan.js'
      - 'assets/js/glasses-ingredient-training-studio.js'
      - 'includes/glasses-ingredient-training.php'
      - 'api/glasses-ingredient-training.php'
      - 'tests/glasses-ingredient-training.test.js'
      - 'tests/glasses-ingredient-training-contract.php'
      - 'docs/GLASSES-SECTION267-INGREDIENT-TRAINING-ACCEPTANCE.md'
      - 'assets/js/glasses-production-photo-flow.js'
      - 'api/glasses-photo-notifications.php'
      - 'includes/glasses-customer-photo-notifications.php'
      - 'database/20261211_section260_customer_photo_notifications.sql'
      - 'database/20261212_section262_customer_photo_feedback.sql'
      - 'includes/glasses-customer-photo-feedback.php'
      - 'assets/css/customer-photo-gallery.css'
      - 'tests/glasses-customer-photo-feedback-contract.php'
      - 'tests/glasses-customer-photo-gallery.test.js'
      - 'customer-order-photos.php'
      - 'customer-order-photo.php'
      - 'assets/js/glasses-customer-photo-notifications.js'
      - 'tests/glasses-customer-photo-policy.php'
      - 'tests/glasses-customer-photo-notifications.test.js'
      - 'includes/glasses-order-photo-stages.php'
      - 'api/glasses-order-photo-stages.php'
      - 'database/20261210_section259_order_photo_stages.sql'
      - 'tests/glasses-order-photo-stages-contract.php'
      - 'tests/glasses-production-photo-flow.test.js'
      - 'assets/js/glasses-camera-similarity.js'
      - 'api/glasses-camera-photo-library.php'
      - 'includes/glasses-camera-photo-library.php'
      - 'database/20261209_section258_camera_photo_library.sql'
      - 'tests/glasses-camera-photo-library.test.js'
      - 'tests/glasses-camera-photo-library-contract.php'
      - 'api/glasses-camera-locations.php'
      - 'includes/glasses-camera-locations.php'
      - 'database/20261208_section257_camera_locations.sql'
      - 'tests/glasses-camera-locations-contract.php'
      - 'tests/glasses-camera-config.test.js'
      - 'js/voice-session-presence.js'
      - 'tests/glasses-training-foundation.test.js'
      - 'assets/css/glasses-simulator-device-first.css'
      - 'tests/glasses-voice-device.test.js'
      - 'tests/glasses-voice-recovery.test.js'
      - 'tests/glasses-device-tabs-contract.php'
      - 'assets/css/glasses-simulator-hud-ux.css'
      - 'tests/glasses-hud-voice-contract.php'
