name: Employee Home + Self-Service

on:
  pull_request:
  push:
    branches: [main]

jobs:
  employee-home:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/employee-home-core.php
          php -l api/employee-home.php
          php -l api/employee-agent.php
          php -l api/proactive-agent.php
          php -l includes/agent-workspace-core.php
          php -l employee-home.php
          php -l tests/employee-home-contract.php
          node --check js/employee-home.js
          node --check js/employee-home-module.js
          node --check js/auth-guard.js
      - name: Architecture contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS employee_lifecycle_profiles" database/20260914_zzzz_employee_home_lifecycle.sql
          grep -q "CREATE TABLE IF NOT EXISTS employee_announcements" database/20260914_zzzz_employee_home_lifecycle.sql
          grep -q "CREATE TABLE IF NOT EXISTS employee_policy_documents" database/20260914_zzzz_employee_home_lifecycle.sql
          grep -q "CREATE TABLE IF NOT EXISTS employee_checklist_items" database/20260914_zzzz_employee_home_lifecycle.sql
          grep -q "employee.self" database/20260914_zzzz_employee_home_lifecycle.sql
          grep -q "employee_home_dashboard" includes/employee-home-core.php
          grep -q "api/employee-agent.php" includes/agent-workspace-core.php
          grep -q "employee.certification_expiring" api/proactive-agent.php
          grep -q "employee-home.php" js/employee-home-module.js
          grep -q "published','locked" includes/employee-home-core.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);$s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);if($s->pendingMigrations())exit(1);
          PHP
      - name: Verify schema and permissions
        run: |
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('employee_lifecycle_profiles','employee_announcements','employee_announcement_reads','employee_policy_documents','employee_policy_acknowledgements','employee_checklist_items')" | grep -qx '6'
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('employee.self','employee.manage','employee.announcements.manage','employee.policies.manage')" | grep -qx '4'
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260914_zzzz_employee_home_lifecycle'" | grep -qx '1'
      - name: Employee Home behavior
        run: php tests/employee-home-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';require 'includes/UpgradeService.php';$s=new UpgradeService(app_pdo(),__DIR__);$r=$s->applyPending(null);if($r!==[]||$s->pendingMigrations())exit(1);echo "idempotent\n";
          PHP
