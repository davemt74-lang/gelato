name: Kitchen Display + Production Expo

on:
  pull_request:
    paths:
      - 'kds.php'
      - 'kds-dashboard.php'
      - 'pos.php'
      - 'api/kds.php'
      - 'api/pos.php'
      - 'includes/kds-core.php'
      - 'includes/kds-production.php'
      - 'includes/table-service-core.php'
      - 'js/kds.js'
      - 'js/kds-dashboard.js'
      - 'js/pos.js'
      - 'database/20260919_kitchen_display_order_routing.sql'
      - 'tests/kds-contract.php'
      - 'tests/kds-production-expo-contract.php'
      - '.github/workflows/kitchen-display.yml'
  push:
    branches: [main]

jobs:
  kitchen-display:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l kds.php
          php -l kds-dashboard.php
          php -l pos.php
          php -l api/kds.php
          php -l api/pos.php
          php -l includes/kds-core.php
          php -l includes/kds-production.php
          php -l tests/kds-contract.php
          php -l tests/kds-production-expo-contract.php
          node --check js/kds.js
          node --check js/kds-dashboard.js
          node --check js/pos.js
      - name: Architecture and production contract
        run: |
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS kds_stations' database/20260919_kitchen_display_order_routing.sql)" = "1"
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS kds_menu_routes' database/20260919_kitchen_display_order_routing.sql)" = "1"
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS kds_order_items' database/20260919_kitchen_display_order_routing.sql)" = "1"
          test "$(grep -c 'CREATE TABLE IF NOT EXISTS kds_order_events' database/20260919_kitchen_display_order_routing.sql)" = "1"
          grep -q 'uq_kds_order_pos_line' database/20260919_kitchen_display_order_routing.sql
          grep -q "'kds.view'" database/20260919_kitchen_display_order_routing.sql
          grep -q "'kds.update'" database/20260919_kitchen_display_order_routing.sql
          grep -q "'kds.configure'" database/20260919_kitchen_display_order_routing.sql
          grep -q 'function kds_transaction' includes/kds-core.php
          grep -q 'function kds_production_board' includes/kds-production.php
          grep -q 'function kds_production_ticket_action' includes/kds-production.php
          grep -q 'function kds_production_recall_item' includes/kds-production.php
          grep -q 'Only Expo / All can bump' includes/kds-production.php
          ! grep -q 'CREATE TABLE' includes/kds-production.php
          grep -q "action==='ticket.action'" api/kds.php
          grep -q "action==='item.recall'" api/kds.php
          grep -q 'id="startKds"' kds.php
          grep -q 'Esc exits to Kitchen Dashboard' kds.php
          grep -q 'requestFullscreen' js/kds.js
          grep -q "e.key==='Enter'" js/kds.js
          grep -q "e.key.toLowerCase()==='b'" js/kds.js
          grep -q "e.key.toLowerCase()==='r'" js/kds.js
          grep -q 'selectedTicketId' js/kds.js
          grep -q 'kds-dashboard.php' kds.php
          grep -q 'Launch Full-Screen KDS' kds-dashboard.php
          grep -q 'id="summary"' kds-dashboard.php
          grep -q 'id="stationForm"' kds-dashboard.php
          grep -q "action:'station.save'" js/kds-dashboard.js
          grep -q "action:'route.save'" js/kds-dashboard.js
          ! grep -q 'id="summary"' kds.php
          ! grep -q 'id="stationForm"' kds.php
          grep -q 'All Day' kds.php
          grep -q 'kds_assert_pos_line_mutable' api/pos.php
          grep -q 'kds_cancel_pos_line' api/pos.php
          grep -q 'kds_cancel_check' api/pos.php
          grep -q "action==='kitchen.send'" api/pos.php
          grep -q 'id="kitchenSend"' js/pos.js
          grep -q 'id="kitchenHold"' js/pos.js
          grep -q 'kitchenItemByLine' js/pos.js
          grep -q 'href="kds.php"' pos.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify schema and permissions
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('kds_stations','kds_menu_routes','kds_order_items','kds_order_events');")" = "4"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('kds.view','kds.update','kds.configure');")" = "3"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260919_kitchen_display_order_routing';")" = "1"
      - name: Kitchen Display behavioral contract
        run: php tests/kds-contract.php
      - name: KDS production and Expo contract
        run: php tests/kds-production-expo-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: POS Floor integration regression
        run: php tests/pos-floor-plan-integration-contract.php
      - name: Daily Manager regression
        run: php tests/daily-manager-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
