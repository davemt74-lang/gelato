name: Food Monster Licensing and Updates

on:
  pull_request:
    paths:
      - 'license-updates.php'
      - 'GELATO_VERSION.txt'
      - 'includes/food-monster-installation*.php'
      - 'includes/food-monster-b8d3-tool-runtime.php'
      - 'includes/food-monster-skill-registry.php'
      - 'tests/food-monster-installation.php'
      - '.github/workflows/food-monster-installation.yml'
  push:
    branches: [main]
    paths:
      - 'license-updates.php'
      - 'GELATO_VERSION.txt'
      - 'includes/food-monster-installation*.php'
      - 'includes/food-monster-b8d3-tool-runtime.php'
      - 'includes/food-monster-skill-registry.php'
      - 'tests/food-monster-installation.php'
      - '.github/workflows/food-monster-installation.yml'

permissions:
  contents: read

jobs:
  licensing-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_sqlite
      - run: |
          php -l license-updates.php
          php -l includes/food-monster-installation.php
          php -l includes/food-monster-installation-tools.php
          php tests/food-monster-installation.php
          php tests/food-monster-b8d3-tool-selection.php
          php tests/food-monster-b8d17a-capability-truth.php
