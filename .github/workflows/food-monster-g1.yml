name: FM-G1 Food Monster Stage
on:
  pull_request:
    paths:
      - 'food-monster.php'
      - 'api/food-monster-presence.php'
      - 'includes/food-monster-room-presence.php'
      - 'js/food-monster-room.js'
      - 'js/food-monster-room-tracker.js'
      - 'tests/food-monster-g9c-*'
      - 'js/food-monster-clock-popup.js'
      - 'tests/food-monster-g9b-clock.php'
      - 'tests/food-monster-g9b-clock-browser.test.cjs'
      - 'api/employee-clock.php'
      - 'includes/food-monster-employee-clock.php'
      - 'database/20261016_fm_g9b_employee_clock_pin.sql'
      - 'includes/food-monster-identity-authority.php'
      - 'tests/food-monster-g9a-contract.php'
      - 'tests/food-monster-g8reset-contract.php'
      - 'css/food-monster.css'
      - 'js/food-monster.js'
      - 'js/global-add-canvas.js'
      - 'assets/food-monster/**'
      - 'tests/food-monster-g1-*'
      - 'tests/food-monster-g2-*'
      - 'tests/food-monster-g4-*'
      - 'tests/food-monster-g5-*'
      - 'tests/food-monster-g6-*'
      - 'tests/food-monster-g7-*'
      - 'tests/food-monster-g7a-*'
      - 'tests/food-monster-g7v-*'
      - 'tests/food-monster-g7c-*'
      - 'tests/food-monster-g7d-*'
      - 'tests/food-monster-g8b-pin-*'
      - 'api/fm-pin.php'
      - 'includes/food-monster-pin.php'
      - 'js/fm-face-pin.js'
      - 'login.php'
      - 'reset-password.php'
      - 'profile-pin.php'
      - 'database/20261015_fm_g8b_face_pin.sql'
      - 'docs/FOOD-MONSTER-FM-G8B-FACE-PIN.md'
      - 'tests/food-monster-g7b1-*'
      - 'tests/food-monster-g7b2-*'
      - 'tests/food-monster-manual-chat-browser.test.cjs'
      - 'api/food-monster-read.php'
      - 'includes/food-monster-read-tools.php'
      - 'includes/food-monster-skill-registry.php'
      - 'js/food-monster-skills.js'
      - 'docs/FOOD-MONSTER-FM-G7B1-SKILLS.md'
      - 'docs/FOOD-MONSTER-FM-G7D-HAIKU-PROVIDER.md'
      - 'includes/agent-workspace-core.php'
      - 'includes/food-monster-person-conversations.php'
      - 'includes/food-monster-conversation-memory.php'
      - 'tests/food-monster-g9e-memory.php'
      - 'tests/food-monster-g9d-conversations.php'
      - 'api/agent-brain.php'
      - 'api/agent-workspace.php'
      - 'api/food-monster-orchestrate.php'
      - 'includes/food-monster-multi-node.php'
      - 'js/universal-admin-page-shell.js'
      - 'js/workspace-shell-sync.js'
      - 'workspace.php'
      - 'js/food-monster-suggestions.js'
      - 'js/agent-next-moves.js'
      - 'js/food-monster-llm.js'
      - 'api/food-monster-llm.php'
      - 'includes/food-monster-llm.php'
      - 'js/global-agent.js'
      - '.github/workflows/food-monster-g1.yml'
  push:
    branches: [main]
    paths:
      - 'food-monster.php'
      - 'api/food-monster-presence.php'
      - 'includes/food-monster-room-presence.php'
      - 'js/food-monster-room.js'
      - 'js/food-monster-room-tracker.js'
      - 'tests/food-monster-g9c-*'
      - 'js/food-monster-clock-popup.js'
      - 'tests/food-monster-g9b-clock.php'
      - 'tests/food-monster-g9b-clock-browser.test.cjs'
      - 'api/employee-clock.php'
      - 'includes/food-monster-employee-clock.php'
      - 'database/20261016_fm_g9b_employee_clock_pin.sql'
      - 'includes/food-monster-identity-authority.php'
      - 'tests/food-monster-g9a-contract.php'
      - 'css/food-monster.css'
      - 'js/food-monster.js'
      - 'js/global-add-canvas.js'
      - 'assets/food-monster/**'
      - 'tests/food-monster-g1-*'
      - '.github/workflows/food-monster-g1.yml'
jobs:
  stage-contract:
    name: Mascot PHP & JS contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: |
          php -l food-monster.php
          php tests/food-monster-g8reset-contract.php
          php -l includes/food-monster-room-presence.php
          php -l api/food-monster-presence.php
          php tests/food-monster-g9c-presence.php
          node --check js/food-monster-room-tracker.js
          node --check js/food-monster-room.js
          node tests/food-monster-g9c-tracker.test.cjs
          php -l api/employee-clock.php
          php -l includes/food-monster-employee-clock.php
          php tests/food-monster-g9b-clock.php
          node --check js/food-monster-clock-popup.js
          php -l includes/food-monster-identity-authority.php
          php tests/food-monster-g9a-contract.php
          php -l tests/food-monster-g1-contract.php
          php -l tests/food-monster-g2-contract.php
          php -l tests/food-monster-g4-contract.php
          php -l tests/food-monster-g5-contract.php
          php -l tests/food-monster-g6-contract.php
          php -l tests/food-monster-g7-contract.php
          php -l includes/food-monster-multi-node.php
          php -l api/food-monster-orchestrate.php
          php -l api/agent-workspace.php
          php -l includes/food-monster-person-conversations.php
          php tests/food-monster-g9d-conversations.php
          php -l includes/food-monster-conversation-memory.php
          php tests/food-monster-g9e-memory.php
          node --check js/food-monster-suggestions.js
          node --check js/agent-next-moves.js
          php -l includes/food-monster-llm.php
          php -l api/food-monster-llm.php
          node --check js/food-monster-llm.js
          node --check js/global-agent.js
          node tests/food-monster-g7v-listening.test.cjs
          node tests/voice-turn-taking.test.js
          php tests/food-monster-g7c-routing.php
          php -l includes/agent-workspace-core.php
          php -l api/agent-brain.php
          node tests/proactive-global-listening.test.js
          node --check js/food-monster.js
          node --check js/global-add-canvas.js
          php tests/food-monster-g1-contract.php
          php tests/food-monster-g2-contract.php
          php tests/food-monster-g4-contract.php
          php tests/food-monster-g7d-provider-contract.php
          php -l login.php
          php -l reset-password.php
          php -l profile-pin.php
          php -l api/fm-pin.php
          php -l includes/food-monster-pin.php
          php tests/food-monster-g8b-pin-contract.php
          node --check js/fm-face-pin.js
          php tests/food-monster-g7b1-registry.php
          php tests/food-monster-g7b2-read.php
          php -l api/food-monster-read.php
          php -l includes/food-monster-read-tools.php
          php -l includes/food-monster-skill-registry.php
          node --check js/food-monster-skills.js
          php tests/food-monster-g5-contract.php
          php tests/food-monster-g6-contract.php
          php tests/food-monster-g7-contract.php
  chromium:
    name: Mascot desktop, mobile & overlay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: |
          node tests/food-monster-g1-browser.test.cjs
          node tests/food-monster-g2-browser.test.cjs
          node tests/food-monster-g4-browser.test.cjs
          node tests/food-monster-g5-browser.test.cjs
          node tests/food-monster-g7-browser.test.cjs
          node tests/food-monster-g7a-browser.test.cjs
          node tests/food-monster-g7v-browser.test.cjs
          node tests/food-monster-g7c-browser.test.cjs
          node tests/food-monster-g9b-clock-browser.test.cjs
          node tests/food-monster-g9c-room-browser.test.cjs
          node tests/food-monster-g8b-pin-browser.test.cjs
          node tests/food-monster-g7b1-browser.test.cjs
          node tests/food-monster-g7b2-browser.test.cjs
          node tests/food-monster-manual-chat-browser.test.cjs
