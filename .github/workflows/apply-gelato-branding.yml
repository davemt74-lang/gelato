name: Apply Gelato branding cleanup

on:
  push:
    branches: [gelato-branding-cleanup]
    paths:
      - '.github/workflows/apply-gelato-branding.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gelato-branding-cleanup
          fetch-depth: 0

      - name: Replace Fatso branding only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'jobs.html': [
                  ("restaurantName:'Fatso’s Restaurant'", "restaurantName:'Gelato Spot'"),
                  ("logoText:'FR'", "logoText:'GS'"),
              ],
              'landing.html': [
                  ("restaurantName:'Fatso’s Restaurant'", "restaurantName:'Gelato Spot'"),
                  ("logoText:'FR'", "logoText:'GS'"),
              ],
              'apply.html': [
                  ("restaurantName:'Fatso’s Restaurant'", "restaurantName:'Gelato Spot'"),
                  ("logoText:'FR'", "logoText:'GS'"),
              ],
              'js/admin-extensions.js': [
                  ("restaurantName:'Fatso’s Restaurant'", "restaurantName:'Gelato Spot'"),
                  ("logoText:'FR'", "logoText:'GS'"),
              ],
              'js/admin-console.js': [
                  ("restaurantName:'Fatso’s Restaurant'", "restaurantName:'Gelato Spot'"),
                  ("legalName:'Fatso’s Restaurant LLC'", "legalName:'Gelato Spot'"),
                  ("logoText:'FR'", "logoText:'GS'"),
              ],
              'api/public-agent.php': [
                  ("Fatso-Public-Agent/1.0", "GelatoSpot-Public-Agent/1.0"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected Fatso branding not found in {filename}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove obsolete Fatso-era artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in index-pre-agent.html agent-workspace-v2.html data/ingredient-catalog.json; do
            refs=$(grep -RIl --exclude-dir=.git --exclude-dir=.github --exclude="$(basename "$target")" -- "$target" . || true)
            if [ -n "$refs" ]; then
              echo "Refusing to remove referenced legacy artifact $target"
              echo "$refs"
              exit 1
            fi
          done
          rm -f index-pre-agent.html agent-workspace-v2.html data/ingredient-catalog.json

      - name: Verify no Fatso branding remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=.git --exclude-dir=.github --exclude='*.sql' 'Fatso|Fatso.s|Fatso’s' .; then
            echo 'Legacy Fatso branding remains in repository files.'
            exit 1
          fi
          grep -q "restaurantName:'Gelato Spot'" jobs.html
          grep -q "restaurantName:'Gelato Spot'" landing.html
          grep -q "restaurantName:'Gelato Spot'" apply.html
          grep -q "GelatoSpot-Public-Agent/1.0" api/public-agent.php
          echo 'Fatso branding cleanup gate passed.'

      - name: Syntax check touched runtime files
        shell: bash
        run: |
          set -euo pipefail
          php -l api/public-agent.php

      - name: Remove one-time workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-gelato-branding.yml .github/workflows/inspect-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Fatso branding with Gelato Spot"
          git push origin HEAD:gelato-branding-cleanup
