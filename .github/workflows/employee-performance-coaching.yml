name: Employee Performance + Coaching

on:
  pull_request:
  push:
    branches: [main]

jobs:
  employee-performance:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/employee-performance-core.php
          php -l api/employee-development.php
          php -l employee-development.php
          php -l tests/employee-performance-contract.php
          node --check js/employee-development.js
      - name: Architecture contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS employee_coaching_notes" database/20260914_zzzzzz_employee_performance_coaching.sql
          grep -q "CREATE TABLE IF NOT EXISTS employee_recognitions" database/20260914_zzzzzz_employee_performance_coaching.sql
          grep -q "CREATE TABLE IF NOT EXISTS employee_development_goals" database/20260914_zzzzzz_employee_performance_coaching.sql
          grep -q "employee.performance.view" database/20260914_zzzzzz_employee_performance_coaching.sql
          grep -q "does not assign an employee score" includes/employee-performance-core.php
          grep -q "Manager-private development workspace" employee-development.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);$s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);if($s->pendingMigrations())exit(1);
          PHP
      - name: Verify schema and permissions
        run: |
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('employee_coaching_notes','employee_recognitions','employee_development_goals')" | grep -qx '3'
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('employee.performance.view','employee.performance.manage','employee.recognition.manage')" | grep -qx '3'
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -N -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260914_zzzzzz_employee_performance_coaching'" | grep -qx '1'
      - name: Employee development behavior
        run: php tests/employee-performance-contract.php
      - name: Existing Employee Home regression
        run: php tests/employee-home-contract.php
      - name: Existing shift handoff regression
        run: php tests/shift-handoff-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';require 'includes/UpgradeService.php';$s=new UpgradeService(app_pdo(),__DIR__);$r=$s->applyPending(null);if($r!==[]||$s->pendingMigrations())exit(1);echo "idempotent\n";
          PHP
