name: AR Glasses V11 Training Operations

on:
  pull_request:
    paths:
      - 'database/20261127_v11_training_assignment_operator_identity.sql'
      - 'database/20261128_v11_production_evidence_capture.sql'
      - 'includes/glasses-training-identity.php'
      - 'includes/glasses-production-evidence.php'
      - 'api/glasses-device.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'assets/js/glasses-training-identity.js'
      - 'assets/js/glasses-production-evidence.js'
      - 'tests/glasses-v11-training-identity-contract.php'
      - 'tests/glasses-v11-production-evidence-contract.php'
      - 'docs/GLASSES-V11-TRAINING-IDENTITY.md'
      - 'docs/GLASSES-V11-PRODUCTION-EVIDENCE.md'
      - '.github/workflows/glasses-v11.yml'
  push:
    branches: [main]

jobs:
  v11-training-identity:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          php -l includes/glasses-training-identity.php
          php -l includes/glasses-production-evidence.php
          php -l api/glasses-device.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-v11-training-identity-contract.php
          php -l tests/glasses-v11-production-evidence-contract.php
          node --check assets/js/glasses-training-identity.js
          node --check assets/js/glasses-production-evidence.js
      - name: Architecture guardrails
        run: |
          grep -q 'GLASSES_TRAINING_ASSIGNMENT_SCHEMA' includes/glasses-training-identity.php
          grep -q "'glasses_vision_program'" includes/glasses-training-identity.php
          grep -q 'training.session_start' api/glasses-device.php
          grep -q 'training.assignment_create' api/glasses-vision-lab.php
          grep -q 'active_device_id' database/20261127_v11_training_assignment_operator_identity.sql
          grep -q 'active_user_id' database/20261127_v11_training_assignment_operator_identity.sql
          ! grep -q 'kds_transition(' includes/glasses-training-identity.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-training-identity.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-training-identity.php
          grep -q 'GLASSES_V11_PRODUCTION_EVIDENCE_SCHEMA' includes/glasses-production-evidence.php
          grep -q 'ALTER TABLE glasses_vision_training_media' database/20261128_v11_production_evidence_capture.sql
          ! grep -q 'CREATE TABLE' database/20261128_v11_production_evidence_capture.sql
          grep -q 'training.evidence_capture' api/glasses-device.php
          grep -q 'training.evidence_eligibility' api/glasses-vision-lab.php
          ! grep -q 'kds_transition(' includes/glasses-production-evidence.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-production-evidence.php
      - name: Install schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_v11_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          $s->assertAppliedChecksumsUnchanged();
          if($s->applyPending(null)!==[]) exit(2);
          PHP
      - name: V11 training assignment and operator identity contract
        run: php tests/glasses-v11-training-identity-contract.php
      - name: V11 production evidence capture contract
        run: php tests/glasses-v11-production-evidence-contract.php

      - name: V10 RC1 regression
        run: php tests/glasses-v10-rc1-acceptance-contract.php
      - name: V9 RC1 regression
        run: php tests/glasses-vision-lab-v9-release-acceptance-contract.php
