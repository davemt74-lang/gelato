name: AR Glasses V11 Training Operations

on:
  pull_request:
    paths:
      - 'database/20261127_v11_training_assignment_operator_identity.sql'
      - 'database/20261128_v11_production_evidence_capture.sql'
      - 'database/20261129_v11_annotation_corrections.sql'
      - 'database/20261130_v11_hard_example_failure_mining.sql'
      - 'database/20261201_v11_dataset_assembly_versioning.sql'
      - 'database/20261202_v11_training_run_orchestration.sql'
      - 'database/20261203_v11_model_evaluation_benchmarks.sql'
      - 'database/20261204_v11_model_release_candidate_governance.sql'
      - 'database/20261205_v11_shadow_production_validation.sql'
      - 'database/20261206_v11_governed_canary_release.sql'
      - 'includes/glasses-training-identity.php'
      - 'includes/glasses-production-evidence.php'
      - 'includes/glasses-annotation-workbench.php'
      - 'includes/glasses-v11-mining.php'
      - 'includes/glasses-v11-dataset-assembly.php'
      - 'includes/glasses-v11-training-runs.php'
      - 'includes/glasses-v11-model-evaluation.php'
      - 'includes/glasses-v11-model-release-candidates.php'
      - 'includes/glasses-v11-shadow-validation.php'
      - 'includes/glasses-v11-canary-release.php'
      - 'includes/glasses-vision-models.php'
      - 'includes/glasses-vision-promotion.php'
      - 'includes/glasses-vision-evidence-review.php'
      - 'includes/glasses-vision-curation.php'
      - 'includes/glasses-vision-lab.php'
      - 'api/glasses-device.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-vision-lab.php'
      - 'assets/js/glasses-training-identity.js'
      - 'assets/js/glasses-production-evidence.js'
      - 'assets/js/glasses-annotation-workbench.js'
      - 'assets/js/glasses-v11-mining.js'
      - 'assets/js/glasses-v11-dataset-assembly.js'
      - 'assets/js/glasses-v11-training-runs.js'
      - 'assets/js/glasses-v11-model-evaluation.js'
      - 'assets/js/glasses-v11-model-release-candidates.js'
      - 'assets/js/glasses-v11-shadow-validation.js'
      - 'assets/js/glasses-v11-canary-release.js'
      - 'tests/glasses-v11-training-identity-contract.php'
      - 'tests/glasses-v11-production-evidence-contract.php'
      - 'tests/glasses-v11-annotation-workbench-contract.php'
      - 'tests/glasses-v11-hard-example-mining-contract.php'
      - 'tests/glasses-v11-dataset-assembly-contract.php'
      - 'tests/glasses-v11-training-run-orchestration-contract.php'
      - 'tests/glasses-v11-model-evaluation-contract.php'
      - 'tests/glasses-v11-model-release-candidate-contract.php'
      - 'tests/glasses-v11-shadow-production-validation-contract.php'
      - 'tests/glasses-v11-governed-canary-release-contract.php'
      - 'docs/GLASSES-V11-TRAINING-IDENTITY.md'
      - 'docs/GLASSES-V11-PRODUCTION-EVIDENCE.md'
      - 'docs/GLASSES-V11-ANNOTATION-WORKBENCH.md'
      - 'docs/GLASSES-V11-HARD-EXAMPLE-MINING.md'
      - 'docs/GLASSES-V11-DATASET-ASSEMBLY.md'
      - 'docs/GLASSES-V11-TRAINING-RUNS.md'
      - 'docs/GLASSES-V11-MODEL-EVALUATION.md'
      - 'docs/GLASSES-V11-MODEL-RELEASE-CANDIDATES.md'
      - 'docs/GLASSES-V11-SHADOW-VALIDATION.md'
      - 'docs/GLASSES-V11-GOVERNED-CANARY-RELEASE.md'
      - '.github/workflows/glasses-v11.yml'
  push:
    branches: [main]

jobs:
  v11-training-identity:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          php -l includes/glasses-training-identity.php
          php -l includes/glasses-production-evidence.php
          php -l includes/glasses-annotation-workbench.php
          php -l includes/glasses-v11-mining.php
          php -l includes/glasses-v11-dataset-assembly.php
          php -l includes/glasses-v11-training-runs.php
          php -l includes/glasses-v11-model-evaluation.php
          php -l includes/glasses-v11-model-release-candidates.php
          php -l includes/glasses-v11-shadow-validation.php
          php -l includes/glasses-v11-canary-release.php
          php -l includes/glasses-vision-models.php
          php -l includes/glasses-vision-promotion.php
          php -l includes/glasses-vision-evidence-review.php
          php -l includes/glasses-vision-curation.php
          php -l includes/glasses-vision-lab.php
          php -l api/glasses-device.php
          php -l api/glasses-vision-lab.php
          php -l glasses-vision-lab.php
          php -l tests/glasses-v11-training-identity-contract.php
          php -l tests/glasses-v11-production-evidence-contract.php
          php -l tests/glasses-v11-annotation-workbench-contract.php
          php -l tests/glasses-v11-hard-example-mining-contract.php
          php -l tests/glasses-v11-dataset-assembly-contract.php
          php -l tests/glasses-v11-training-run-orchestration-contract.php
          php -l tests/glasses-v11-model-evaluation-contract.php
          php -l tests/glasses-v11-model-release-candidate-contract.php
          php -l tests/glasses-v11-shadow-production-validation-contract.php
          php -l tests/glasses-v11-governed-canary-release-contract.php
          node --check assets/js/glasses-training-identity.js
          node --check assets/js/glasses-production-evidence.js
          node --check assets/js/glasses-annotation-workbench.js
          node --check assets/js/glasses-v11-mining.js
          node --check assets/js/glasses-v11-dataset-assembly.js
          node --check assets/js/glasses-v11-training-runs.js
          node --check assets/js/glasses-v11-model-evaluation.js
          node --check assets/js/glasses-v11-model-release-candidates.js
          node --check assets/js/glasses-v11-shadow-validation.js
          node --check assets/js/glasses-v11-canary-release.js
      - name: Architecture guardrails
        run: |
          grep -q 'GLASSES_TRAINING_ASSIGNMENT_SCHEMA' includes/glasses-training-identity.php
          grep -q "'glasses_vision_program'" includes/glasses-training-identity.php
          grep -q 'training.session_start' api/glasses-device.php
          grep -q 'training.assignment_create' api/glasses-vision-lab.php
          grep -q 'active_device_id' database/20261127_v11_training_assignment_operator_identity.sql
          grep -q 'active_user_id' database/20261127_v11_training_assignment_operator_identity.sql
          ! grep -q 'kds_transition(' includes/glasses-training-identity.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-training-identity.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-training-identity.php
          grep -q 'GLASSES_V11_PRODUCTION_EVIDENCE_SCHEMA' includes/glasses-production-evidence.php
          grep -q 'ALTER TABLE glasses_vision_training_media' database/20261128_v11_production_evidence_capture.sql
          ! grep -q 'CREATE TABLE' database/20261128_v11_production_evidence_capture.sql
          grep -q 'training.evidence_capture' api/glasses-device.php
          grep -q 'training.evidence_eligibility' api/glasses-vision-lab.php
          ! grep -q 'kds_transition(' includes/glasses-production-evidence.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-production-evidence.php
          grep -q 'GLASSES_V11_ANNOTATION_CORRECTION_SCHEMA' includes/glasses-annotation-workbench.php
          grep -q 'correction_id BIGINT UNSIGNED NULL' database/20261129_v11_annotation_corrections.sql
          grep -q 'annotation.adjudicate' api/glasses-vision-lab.php
          ! grep -q 'kds_transition(' includes/glasses-annotation-workbench.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-annotation-workbench.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-annotation-workbench.php
          grep -q 'GLASSES_V11_HARD_EXAMPLE_SCHEMA' includes/glasses-v11-mining.php
          grep -q 'ALTER TABLE glasses_vision_mined_candidates' database/20261130_v11_hard_example_failure_mining.sql
          ! grep -q 'CREATE TABLE' database/20261130_v11_hard_example_failure_mining.sql
          grep -q 'mining.run' api/glasses-vision-lab.php
          ! grep -q 'glasses_vision_lab_add_dataset_sample(' includes/glasses-v11-mining.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-mining.php
          grep -q 'GLASSES_V11_DATASET_ASSEMBLY_SCHEMA' includes/glasses-v11-dataset-assembly.php
          grep -q 'ALTER TABLE glasses_vision_dataset_versions' database/20261201_v11_dataset_assembly_versioning.sql
          grep -q 'ALTER TABLE glasses_vision_dataset_items' database/20261201_v11_dataset_assembly_versioning.sql
          ! grep -q 'CREATE TABLE' database/20261201_v11_dataset_assembly_versioning.sql
          grep -q "'device'=>" includes/glasses-vision-curation.php
          grep -q 'dataset.assemble' api/glasses-vision-lab.php
          ! grep -q 'glasses_vision_retraining_' includes/glasses-v11-dataset-assembly.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-dataset-assembly.php
          grep -q 'GLASSES_V11_TRAINING_RUN_SCHEMA' includes/glasses-v11-training-runs.php
          grep -q 'ALTER TABLE glasses_vision_training_runs' database/20261202_v11_training_run_orchestration.sql
          ! grep -q 'CREATE TABLE' database/20261202_v11_training_run_orchestration.sql
          grep -q 'training_run.create' api/glasses-vision-lab.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-training-runs.php
          ! grep -q 'glasses_vision_promotion_' includes/glasses-v11-training-runs.php
          grep -q 'GLASSES_V11_MODEL_EVALUATION_SCHEMA' includes/glasses-v11-model-evaluation.php
          grep -q 'CREATE TABLE glasses_vision_model_benchmarks' database/20261203_v11_model_evaluation_benchmarks.sql
          grep -q 'model_benchmark.run' api/glasses-vision-lab.php
          grep -q 'passing model benchmark' includes/glasses-vision-evidence-review.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-model-evaluation.php
          ! grep -q 'glasses_vision_promotion_' includes/glasses-v11-model-evaluation.php
          grep -q 'GLASSES_V11_MODEL_RC_SCHEMA' includes/glasses-v11-model-release-candidates.php
          grep -q 'CREATE TABLE glasses_vision_model_release_candidates' database/20261204_v11_model_release_candidate_governance.sql
          ! grep -q 'CREATE TABLE glasses_vision_model_packages' database/20261204_v11_model_release_candidate_governance.sql
          grep -q 'model_rc.create' api/glasses-vision-lab.php
          grep -q 'approved model release candidate' includes/glasses-vision-promotion.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-model-release-candidates.php
          ! grep -q 'rollout.advance' includes/glasses-v11-model-release-candidates.php
          grep -q 'GLASSES_V11_SHADOW_VALIDATION_SCHEMA' includes/glasses-v11-shadow-validation.php
          grep -q 'ALTER TABLE glasses_vision_shadow_runs' database/20261205_v11_shadow_production_validation.sql
          grep -q 'CREATE TABLE glasses_vision_shadow_validations' database/20261205_v11_shadow_production_validation.sql
          grep -q 'vision.shadow_assignment' api/glasses-device.php
          grep -q 'shadow_validation.evaluate' api/glasses-vision-lab.php
          grep -q 'passing Section 9 shadow validation' includes/glasses-vision-models.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-shadow-validation.php
          ! grep -q 'glasses_vision_model_rollout_advance(' includes/glasses-v11-shadow-validation.php
          grep -q 'GLASSES_V11_CANARY_STAGE_SCHEMA' includes/glasses-v11-canary-release.php
          grep -q 'CREATE TABLE glasses_vision_canary_stage_validations' database/20261206_v11_governed_canary_release.sql
          grep -q 'CREATE TABLE glasses_vision_production_acceptances' database/20261206_v11_governed_canary_release.sql
          grep -q 'canary_stage.evaluate' api/glasses-vision-lab.php
          grep -q 'production_acceptance.create' api/glasses-vision-lab.php
          grep -q 'V11 canary advancement requires a passing validation for the current stage.' includes/glasses-vision-models.php
          ! grep -q 'glasses_vision_model_rollout_activate(' includes/glasses-v11-canary-release.php
          ! grep -q 'glasses_vision_model_rollout_advance(' includes/glasses-v11-canary-release.php
      - name: Install schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_v11_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          $s->assertAppliedChecksumsUnchanged();
          if($s->applyPending(null)!==[]) exit(2);
          PHP
      - name: V11 training assignment and operator identity contract
        run: php tests/glasses-v11-training-identity-contract.php
      - name: V11 production evidence capture contract
        run: php tests/glasses-v11-production-evidence-contract.php

      - name: V11 human corrections and annotation workbench contract
        run: php tests/glasses-v11-annotation-workbench-contract.php

      - name: V11 hard example and failure mining contract
        run: php tests/glasses-v11-hard-example-mining-contract.php

      - name: V11 dataset assembly and versioning contract
        run: php tests/glasses-v11-dataset-assembly-contract.php

      - name: V11 training run orchestration and experiment lineage contract
        run: php tests/glasses-v11-training-run-orchestration-contract.php

      - name: V11 model evaluation validation and benchmark contract
        run: php tests/glasses-v11-model-evaluation-contract.php

      - name: V11 model release candidate governance contract
        run: php tests/glasses-v11-model-release-candidate-contract.php

      - name: V11 shadow deployment and production validation contract
        run: php tests/glasses-v11-shadow-production-validation-contract.php

      - name: V11 governed canary release and safety rollback contract
        run: php tests/glasses-v11-governed-canary-release-contract.php

      - name: V10 RC1 regression
        run: php tests/glasses-v10-rc1-acceptance-contract.php
      - name: V9 RC1 regression
        run: php tests/glasses-vision-lab-v9-release-acceptance-contract.php
