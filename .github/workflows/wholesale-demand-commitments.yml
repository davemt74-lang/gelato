name: Wholesale Demand Commitments

on:
  pull_request:
    paths:
      - 'database/20260927_wholesale_demand_commitments.sql'
      - 'includes/unit-conversion.php'
      - 'includes/wholesale-demand.php'
      - 'includes/operations-wholesale.php'
      - 'includes/purchasing-orders.php'
      - 'api/wholesale-demand.php'
      - 'api/wholesale-accounts.php'
      - 'wholesale-demand.php'
      - 'tests/wholesale-demand-commitments-contract.php'
      - '.github/workflows/wholesale-demand-commitments.yml'
  push:
    branches: [main]

jobs:
  wholesale-demand-commitments:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/unit-conversion.php
          php -l includes/wholesale-demand.php
          php -l includes/operations-wholesale.php
          php -l includes/purchasing-orders.php
          php -l api/wholesale-demand.php
          php -l api/wholesale-accounts.php
          php -l wholesale-demand.php
          php -l tests/wholesale-demand-commitments-contract.php
      - name: Architecture contract
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS inventory_commitments' database/20260927_wholesale_demand_commitments.sql
          grep -q 'content_quantity' database/20260927_wholesale_demand_commitments.sql
          grep -q 'restaurant_unit_convert' includes/wholesale-demand.php
          grep -q 'availableToPromise' includes/purchasing-orders.php
          grep -q 'wholesale_demand_sync_order' includes/operations-wholesale.php
          ! grep -q 'CREATE TABLE IF NOT EXISTS wholesale_inventory' database/20260927_wholesale_demand_commitments.sql
          ! grep -q 'UPDATE inventory_items SET on_hand_quantity' includes/wholesale-demand.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify W2 schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='inventory_commitments';")" = "1"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='wholesale_skus' AND column_name IN ('content_quantity','content_uom');")" = "2"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM schema_migrations WHERE migration_key='20260927_wholesale_demand_commitments';")" = "1"
      - name: Wholesale commitment behavior
        run: php tests/wholesale-demand-commitments-contract.php
      - name: W1 commerce regression
        run: php tests/wholesale-commerce-acquisition-contract.php
      - name: Existing Wholesale Operations regression
        run: php tests/operations-wholesale-contract.php
      - name: Existing Prep + Inventory regression
        run: php tests/prep-inventory-intelligence-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
