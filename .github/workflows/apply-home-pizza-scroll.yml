name: Apply Homepage Pizza Scroll Story

on:
  push:
    branches:
      - feature/home-pizza-scroll-story

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pizza-scroll-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-pizza-scroll-story
          fetch-depth: 0
      - name: Patch homepage and menu projection
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path('index.php')
          text = index.read_text()

          anchor = "$featuredPizzas = $pizzaSection ? public_site_featured_items($pizzaSection, 4) : [];"
          addition = anchor + "\n$pizzaStoryItems = $pizzaSection ? public_site_featured_items($pizzaSection, 5) : [];\n$pizzaStoryFallbackImages = ['pizza-scroll-feature.webp', 'favorite-stonefellow.jpg', 'favorite-funghi.jpg', 'favorite-spicy.jpg', 'favorite-burrata.jpg'];"
          if '$pizzaStoryItems' not in text:
              if anchor not in text:
                  raise SystemExit('Unable to locate homepage featured pizza anchor')
              text = text.replace(anchor, addition, 1)

          css_anchor = '<link rel="stylesheet" href="assets/css/site.css?v=20260914-2">'
          css_addition = css_anchor + '\n<link rel="stylesheet" href="assets/css/home-pizza-scroll.css?v=20260915-1">'
          if 'home-pizza-scroll.css' not in text:
              if css_anchor not in text:
                  raise SystemExit('Unable to locate site stylesheet anchor')
              text = text.replace(css_anchor, css_addition, 1)

          story = r'''<section class="pizza-scroll-story" id="pizzaStory" style="--pizza-count:<?= max(1, count($pizzaStoryItems)) ?>">
            <div class="pizza-story-sticky">
              <div class="hero pizza-story-hero">
                <img class="hero-bg" src="<?= app_escape(public_site_asset('hero.jpg')) ?>" alt="Wood-fired pizza, beer and cocktails at <?= app_escape((string)$settings['restaurant_name']) ?>">
                <div class="shell hero-inner"><div class="hero-copy" data-reveal>
                  <div class="eyebrow">Neighborhood Pizzeria · Exceptional Nights</div>
                  <h1>Wood-Fired Pizza.<br>Craft Drinks.<br>Good Company.</h1>
                  <p><?= app_escape((string)$settings['tagline']) ?></p>
                  <div class="hero-actions"><a class="btn btn-primary" href="online-order.php">Order Online</a><a class="btn btn-secondary" href="menu.php">View Our Menu</a><a class="btn btn-secondary" href="locations.php">Visit Us</a></div>
                </div></div>
              </div>
              <div class="pizza-story-blackout" aria-hidden="true"></div>
              <div class="pizza-story-stage" aria-label="Featured pizzas">
                <?php foreach ($pizzaStoryItems as $storyIndex => $item):
                  $storyLocalImage = $pizzaStoryFallbackImages[$storyIndex] ?? $pizzaStoryFallbackImages[0];
                  $storyFallback = public_site_asset($storyLocalImage);
                  $storyRemote = trim((string)($item['imageUrl'] ?? ''));
                  $storyImage = ($storyIndex > 0 && preg_match('#^https://#i', $storyRemote)) ? $storyRemote : $storyFallback;
                  $storyPrice = public_site_price($item);
                  $storyNotes = trim((string)($item['specialNotes'] ?? ''));
                ?>
                <article class="pizza-story-slide" data-pizza-slide data-pizza-index="<?= (int)$storyIndex ?>" aria-label="<?= app_escape((string)$item['name']) ?>">
                  <div class="pizza-story-visual">
                    <img class="pizza-story-image" src="<?= app_escape($storyImage) ?>" data-fallback="<?= app_escape($storyFallback) ?>" alt="<?= app_escape((string)$item['name']) ?>" <?= $storyIndex === 0 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"' ?>>
                  </div>
                  <div class="pizza-story-copy">
                    <div class="pizza-story-count">Product <?= str_pad((string)($storyIndex + 1), 2, '0', STR_PAD_LEFT) ?> / <?= str_pad((string)count($pizzaStoryItems), 2, '0', STR_PAD_LEFT) ?></div>
                    <h2><?= app_escape((string)$item['name']) ?></h2>
                    <?php if (trim((string)$item['description']) !== ''): ?><p class="pizza-story-description"><?= app_escape((string)$item['description']) ?></p><?php endif; ?>
                    <?php if ($storyPrice !== ''): ?><span class="pizza-story-price"><?= app_escape($storyPrice) ?></span><?php endif; ?>
                    <div class="pizza-story-meta">
                      <?php if (!empty($item['ingredients'])): ?><div class="pizza-story-meta-block"><span class="pizza-story-meta-title">Toppings</span><div class="pizza-story-toppings"><?php foreach ($item['ingredients'] as $ingredient): ?><span><?= app_escape((string)$ingredient) ?></span><?php endforeach; ?></div></div><?php endif; ?>
                      <?php if ($storyNotes !== ''): ?><div class="pizza-story-meta-block"><span class="pizza-story-meta-title">Special notes</span><p class="pizza-story-note"><?= app_escape($storyNotes) ?></p></div><?php endif; ?>
                    </div>
                  </div>
                </article>
                <?php endforeach; ?>
              </div>
              <?php if ($pizzaStoryItems): ?><div class="pizza-story-progress" aria-hidden="true"><?php foreach ($pizzaStoryItems as $_storyItem): ?><span></span><?php endforeach; ?></div><?php endif; ?>
            </div>
          </section>'''

          pattern = re.compile(r'<section class="hero">.*?</section>\n<div class="feature-wrap">', re.S)
          if 'id="pizzaStory"' not in text:
              if not pattern.search(text):
                  raise SystemExit('Unable to locate homepage hero section')
              text = pattern.sub(story + '\n<div class="feature-wrap">', text, count=1)

          js_anchor = '<script src="assets/js/site.js?v=20260914"></script>'
          js_addition = '<script src="assets/js/home-pizza-scroll.js?v=20260915-1"></script>\n' + js_anchor
          if 'home-pizza-scroll.js' not in text:
              if js_anchor not in text:
                  raise SystemExit('Unable to locate site runtime anchor')
              text = text.replace(js_anchor, js_addition, 1)

          index.write_text(text)

          menu = Path('includes/menu-sync.php')
          menu_text = menu.read_text()
          select_old = 'SELECT id, section_id, name, slug, description, behavior_tags_json'
          select_new = 'SELECT id, section_id, name, slug, description, preparation_notes, behavior_tags_json'
          if select_new not in menu_text:
              if select_old not in menu_text:
                  raise SystemExit('Unable to locate menu projection SELECT')
              menu_text = menu_text.replace(select_old, select_new, 1)

          special_anchor = "'description' => (string)($item['description'] ?? ''),"
          special_line = special_anchor + "\n            'specialNotes' => (string)($item['preparation_notes'] ?? ''),"
          if "'specialNotes'" not in menu_text:
              if special_anchor not in menu_text:
                  raise SystemExit('Unable to locate menu description projection')
              menu_text = menu_text.replace(special_anchor, special_line, 1)
          menu.write_text(menu_text)

          readme = Path('assets/images/README.md')
          readme_text = readme.read_text()
          if '`pizza-scroll-feature.webp`' not in readme_text:
              readme_text = readme_text.replace('- `hero.jpg`', '- `hero.jpg`\n- `pizza-scroll-feature.webp`', 1)
          readme.write_text(readme_text)
          PY
      - name: Verify patched files
        run: |
          php -l index.php
          php -l includes/menu-sync.php
          node --check assets/js/home-pizza-scroll.js
          php tests/home-pizza-scroll-contract.php
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.php includes/menu-sync.php assets/images/README.md
          if git diff --cached --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git commit -m "Build homepage pizza scroll story [pizza-scroll-patched]"
          git push origin HEAD:feature/home-pizza-scroll-story
