name: Publish Gelato Agent Chat deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gelato-chat-menu-deploy.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-certified-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact merged-main deployment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gelato-release"
          actual_sha="$(gh run view 40267353940 -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          test "$actual_sha" = '6e98125b0a7eea50bde1292fa0651a434da59163'
          gh run download 40267353940 -R "$GITHUB_REPOSITORY" -n gelato-full-deploy -D "$RUNNER_TEMP/gelato-release"
          cd "$RUNNER_TEMP/gelato-release"
          test -s gelato-full-deploy.zip
          test -s gelato-full-deploy.sha256
          actual_hash="$(sha256sum gelato-full-deploy.zip | cut -d' ' -f1)"
          test "$actual_hash" = 'd9b3c19ad631ec3da975b510f366d4393961251e7042ff58c9206c99c33b5cf6'
          printf '%s  %s\n' "$actual_hash" gelato-full-deploy.zip > gelato-full-deploy.sha256
          sha256sum -c gelato-full-deploy.sha256
          unzip -t gelato-full-deploy.zip | tail -n 1

      - name: Publish permanent direct ZIP release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='gelato-agent-chat-menu-6e98125b'
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target '6e98125b0a7eea50bde1292fa0651a434da59163' --title 'Gelato Agent Chat and Menu Retrieval — certified deployment' --notes 'Certified PR #440 (36/36 workflows green), merged into main. Includes restored Agent Chat transcript popup and authorized live menu-overview retrieval. Download the single gelato-full-deploy.zip file; preserve live config.php, uploads/, and storage/; run upgrade.php after installation.'
          fi
          gh release upload "$tag" "$RUNNER_TEMP/gelato-release/gelato-full-deploy.zip" "$RUNNER_TEMP/gelato-release/gelato-full-deploy.sha256" -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "gelato-full-deploy.zip" or .name == "gelato-full-deploy.sha256") | .name + " " + .url'
