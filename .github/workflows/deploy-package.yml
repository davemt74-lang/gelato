name: Build Stonefellows deploy package

on:
  push:
    branches:
      - fix/root-index-public-site
    paths:
      - '.github/workflows/deploy-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          set -euo pipefail
          zip -qr stonefellows-repo.zip . -x '.git/*' 'stonefellows-repo.zip'
          unzip -t stonefellows-repo.zip >/dev/null
          sha256sum stonefellows-repo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-repo
          path: stonefellows-repo.zip
          if-no-files-found: error
          retention-days: 1
