name: AR Glasses Vision Operations

on:
  pull_request:
    paths:
      - 'glasses-vision-operations.php'
      - 'api/glasses-vision-operations.php'
      - 'includes/glasses-vision-operations.php'
      - 'assets/js/glasses-vision-operations.js'
      - 'assets/css/glasses-vision-operations.css'
      - 'includes/admin-control-core.php'
      - 'tests/glasses-vision-operations-contract.php'
      - '.github/workflows/glasses-vision-operations.yml'
  push:
    branches: [main, 'feature/vision-operations-fleet-health']

jobs:
  vision-operations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: gelato_restaurant_ai_ci
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Syntax
        run: |
          php -l includes/glasses-vision-operations.php
          php -l glasses-vision-operations.php
          php -l api/glasses-vision-operations.php
          php -l tests/glasses-vision-operations-contract.php
          node --check assets/js/glasses-vision-operations.js
      - name: Read-only architecture
        run: |
          grep -q 'glasses_vision_ops_catalog' includes/glasses-vision-operations.php
          grep -q 'needsAttention' includes/glasses-vision-operations.php
          grep -q 'timeline' includes/glasses-vision-operations.php
          grep -q 'glasses-vision-operations.php' includes/admin-control-core.php
          ! grep -q 'glasses_build_observe' includes/glasses-vision-operations.php
          ! grep -q 'UPDATE pos_' includes/glasses-vision-operations.php
          ! grep -q 'UPDATE kds_' includes/glasses-vision-operations.php
      - name: Install schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Fleet behavior contract
        run: php tests/glasses-vision-operations-contract.php
      - name: Upgrade idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
