name: Glasses Section 285F4 Navigation and KDS Workflow
on:
  pull_request:
    paths:
      - 'assets/js/glasses-web-simulator.js'
      - 'tests/glasses-section285f4-integration.test.js'
      - '.github/workflows/glasses-section285f4.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/glasses-web-simulator.js'
      - 'tests/glasses-section285f4-integration.test.js'
      - '.github/workflows/glasses-section285f4.yml'
jobs:
  workflow-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/glasses-web-simulator.js
      - run: node --test tests/glasses-section285f4-integration.test.js
