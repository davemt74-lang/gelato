permissions:
  contents: read

jobs:
  build-full-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build full deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          deploy_root="${RUNNER_TEMP}/gelato-full-deploy"
          rm -rf "$deploy_root"
          mkdir -p "$deploy_root"

          rsync -a ./ "$deploy_root/" \
            --exclude '.git/' \
            --exclude 'config.php' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude 'storage/'

          # Bundle the pinned pretrained hand detector in the deploy ZIP.
          vendor_dir="$deploy_root/assets/vendor/mediapipe"
          mkdir -p "$vendor_dir" "${RUNNER_TEMP}/gelato-mediapipe-src"
          archive="$(npm pack @mediapipe/tasks-vision@0.10.32 --silent --pack-destination "${RUNNER_TEMP}")"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gelato-mediapipe-src"
          test -s "${RUNNER_TEMP}/gelato-mediapipe-src/package/vision_bundle.mjs"
          cp "${RUNNER_TEMP}/gelato-mediapipe-src/package/vision_bundle.mjs" "$vendor_dir/vision_bundle.mjs"
          cp -R "${RUNNER_TEMP}/gelato-mediapipe-src/package/wasm" "$vendor_dir/wasm"
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            'https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/LICENSE' \
            --output "$vendor_dir/LICENSE"
          curl --fail --location --retry 3 --max-time 120 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' \
            --output "$vendor_dir/hand_landmarker.task"
          test "$(stat -c %s "$vendor_dir/hand_landmarker.task")" -gt 1000000
          test -s "$vendor_dir/wasm/vision_wasm_internal.wasm"
          node --check "$vendor_dir/vision_bundle.mjs"
          sha256sum "$vendor_dir/vision_bundle.mjs" "$vendor_dir/hand_landmarker.task" \
            > "$vendor_dir/ASSET-SHA256SUMS.txt"

          printf '%s\n' "${GITHUB_SHA}" > "$deploy_root/DEPLOY_SHA.txt"
          cat > "$deploy_root/DEPLOY_INSTRUCTIONS.txt" <<'EOF'
          Gelato full deploy package

          1. Extract this ZIP into the application root and overwrite included files.
          2. Preserve the live config.php and any environment-specific .env file.
          3. Preserve existing uploads/ and storage/ content.
          4. Sign in as an owner/admin and run upgrade.php once.
          5. Hard-refresh the browser after upgrade.
          6. Verify POS, KDS, Vision Lab, AIR3/AR glasses runtime, workspace/agent surfaces, and admin pages.
          7. DEPLOY_SHA.txt identifies the exact Git commit packaged by CI.

          This FULL package intentionally includes repository tests, docs, workflow definitions,
          preview/reference assets, and all other tracked project files except live config/state.
          EOF

          test ! -e "$deploy_root/.git"
          test ! -e "$deploy_root/config.php"
          test ! -e "$deploy_root/.env"
          test ! -e "$deploy_root/uploads"
          test ! -e "$deploy_root/storage"

