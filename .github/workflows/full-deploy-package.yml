          sha256sum "$GITHUB_WORKSPACE/gelato-full-deploy.zip" | tee "$GITHUB_WORKSPACE/gelato-full-deploy.sha256"

      - name: Upload full deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gelato-full-deploy
          path: |
            gelato-full-deploy.zip
            gelato-full-deploy.sha256
          if-no-files-found: error
          retention-days: 14
