name: Full Deploy Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'workspace.php'
      - 'index.html'
      - 'css/training-workspace-chat.css'
      - 'js/training-workspace-voice.js'
      - 'js/voice-turn-taking.js'
      - 'js/proactive-listening-commands.js'
      - 'tests/proactive-listening-commands.test.js'
      - 'tests/proactive-global-listening.test.js'
      - 'tests/proactive-listening-contract.php'
      - 'js/timeclock-voice.js'
      - 'api/proactive-agent.php'
      - 'timeclock.php'
      - 'tests/voice-turn-taking.test.js'
      - 'tests/voice-barge-in-contract.php'
      - 'js/dynamic-agent-canvas.js'
      - 'tests/training-chat-voice-contract.php'
      - 'tests/training-workspace-voice.test.js'
      - 'glasses-pos-kds-test.php'
      - 'glasses-simulator.php'
      - 'kds.php'
      - 'api/kds-agent.php'
      - 'js/kds.js'
      - 'js/kds-agent-sidebar.js'
      - 'js/kds-agent-context.js'
      - 'js/kds-voice-listener.js'
      - 'includes/agent-voice-conversation.php'
      - 'includes/kds-spoken-orders.php'
      - 'js/kds-spoken-orders.js'
      - 'tests/kds-natural-order-voice.php'
      - 'tests/kds-natural-order-voice.test.js'
      - 'tests/agent-verified-voice-greetings.php'
      - 'tests/agent-natural-voice-history-contract.php'
      - 'docs/AGENT-VOICE-PERSONALIZATION-HISTORY.md'
      - 'js/global-add-canvas.js'
      - 'js/global-agent.js'
      - 'api/agent-workspace.php'
      - 'includes/agent-workspace-core.php'
      - 'tests/kds-slot-voice-contract.php'
      - 'tests/kds-slot-voice.test.js'
      - 'includes/kds-slot-references.php'
      - 'tests/kds-global-order-reference.php'
      - 'docs/KDS-GLOBAL-ORDER-REFERENCES.md'
      - 'api/glasses-simulator.php'
      - 'includes/glasses-simulator.php'
      - 'assets/js/glasses-web-simulator.js'
      - 'assets/js/glasses-simulator-voice.js'
      - 'assets/css/glasses-simulator-hud-ux.css'
      - 'tests/glasses-hud-voice-contract.php'
      - 'tests/glasses-voice-navigation.test.js'
      - 'assets/css/glasses-web-simulator.css'
      - 'tests/glasses-live-virtual-preview-contract.php'
      - 'glasses-vision-lab.php'
      - 'assets/css/glasses-pos-kds-test.css'
      - 'assets/js/glasses-pos-kds-test.js'
      - 'assets/css/glasses-vision-lab.css'
      - 'tests/glasses-pos-kds-workflow-contract.php'
      - 'js/workspace-shell-sync.js'
      - 'js/admin-shell-consolidation.js'
      - 'css/admin-tech-theme.css'
      - 'tests/static-workspace-entry-contract.php'
      - 'tests/workspace-admin-sidebar-dedupe-contract.php'
      - '.github/workflows/full-deploy-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build full deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          deploy_root="${RUNNER_TEMP}/gelato-full-deploy"
          rm -rf "$deploy_root"
          mkdir -p "$deploy_root"

          rsync -a ./ "$deploy_root/" \
            --exclude '.git/' \
            --exclude 'config.php' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude 'storage/'

          printf '%s\n' "${GITHUB_SHA}" > "$deploy_root/DEPLOY_SHA.txt"
          cat > "$deploy_root/DEPLOY_INSTRUCTIONS.txt" <<'EOF'
          Gelato full deploy package

          1. Extract this ZIP into the application root and overwrite included files.
          2. Preserve the live config.php and any environment-specific .env file.
          3. Preserve existing uploads/ and storage/ content.
          4. Sign in as an owner/admin and run upgrade.php once.
          5. Hard-refresh the browser after upgrade.
          6. Verify POS, KDS, Vision Lab, AIR3/AR glasses runtime, workspace/agent surfaces, and admin pages.
          7. DEPLOY_SHA.txt identifies the exact Git commit packaged by CI.

          This FULL package intentionally includes repository tests, docs, workflow definitions,
          preview/reference assets, and all other tracked project files except live config/state.
          EOF

          test ! -e "$deploy_root/.git"
          test ! -e "$deploy_root/config.php"
          test ! -e "$deploy_root/.env"
          test ! -e "$deploy_root/uploads"
          test ! -e "$deploy_root/storage"

          required=(
            index.php
            index.html
            css/training-workspace-chat.css
            js/training-workspace-voice.js
            js/voice-turn-taking.js
            js/proactive-listening-commands.js
            tests/proactive-listening-commands.test.js
            tests/proactive-global-listening.test.js
            tests/proactive-listening-contract.php
            tests/voice-turn-taking.test.js
            tests/voice-barge-in-contract.php
            tests/training-chat-voice-contract.php
            tests/training-workspace-voice.test.js
            .htaccess
            workspace.php
            admin.php
            floor-planner-v2.php
            floor-planner-ops-legacy.php
            js/floor-planner-v2.js
            includes/admin-shell-core.php
            includes/admin-route-access.php
            includes/admin-control-core.php
            tests/admin-superuser-navigation-recovery-contract.php
            tests/deployment-navigation-verification-contract.php
            tests/static-workspace-entry-contract.php
            tests/mysql-conditional-add-column-compatibility.php
            tests/mysql-foreign-key-diagnostics.php
            tests/mysql-v11-stored-generated-fk-compatibility.php
            tests/upgrade-credential-preservation.php
            tests/workspace-admin-sidebar-dedupe-contract.php
            assets/css/admin-responsive-layout.css
            tests/admin-responsive-layout-contract.php
            includes/UpgradeService.php
            deployment-check.php
            pos.php
            kds.php
            glasses-vision-lab.php
            glasses-simulator.php
            kds.php
            js/kds-voice-listener.js
            includes/agent-voice-conversation.php
            includes/kds-spoken-orders.php
            js/kds-spoken-orders.js
            tests/kds-natural-order-voice.php
            tests/kds-natural-order-voice.test.js
            tests/agent-verified-voice-greetings.php
            tests/agent-natural-voice-history-contract.php
            tests/kds-slot-voice-contract.php
            tests/kds-slot-voice.test.js
            includes/kds-slot-references.php
            tests/kds-global-order-reference.php
            assets/js/glasses-simulator-voice.js
            assets/css/glasses-simulator-hud-ux.css
            tests/glasses-hud-voice-contract.php
            tests/glasses-voice-navigation.test.js
            includes/glasses-simulator.php
            tests/glasses-live-virtual-preview-contract.php
            glasses-pos-kds-test.php
            assets/css/glasses-pos-kds-test.css
            assets/js/glasses-pos-kds-test.js
            tests/glasses-pos-kds-workflow-contract.php
            upgrade.php
            database/install.sql
            includes/bootstrap.php
            .github/workflows/glasses-vision-lab-v8.yml
            tests/glasses-vision-lab-v8-production-autonomy-audit-contract.php
            docs/GLASSES-VISION-LAB-V8-AUTONOMY-AUDIT.md
            DEPLOY_SHA.txt
            DEPLOY_INSTRUCTIONS.txt
          )
          for path in "${required[@]}"; do
            test -e "$deploy_root/$path" || { echo "Full deploy missing: $path"; exit 1; }
          done

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find "$deploy_root" -type f -name '*.php' -print0)

          php tests/admin-superuser-navigation-recovery-contract.php
          php tests/deployment-navigation-verification-contract.php
          php tests/static-workspace-entry-contract.php
          php tests/training-chat-voice-contract.php
          node --check js/training-workspace-voice.js
          node tests/training-workspace-voice.test.js
          php tests/voice-barge-in-contract.php
          node --check js/voice-turn-taking.js
          node tests/voice-turn-taking.test.js
          php tests/proactive-listening-contract.php
          node --check js/proactive-listening-commands.js
          node --check js/global-agent.js
          node --check js/timeclock-voice.js
          node tests/proactive-listening-commands.test.js
          node tests/proactive-global-listening.test.js
          php tests/mysql-conditional-add-column-compatibility.php
          php tests/mysql-foreign-key-diagnostics.php
          php tests/mysql-v11-stored-generated-fk-compatibility.php
          php tests/upgrade-credential-preservation.php
          php tests/role-permission-enforcement-contract.php
          php tests/universal-admin-page-shell-contract.php
          php tests/workspace-admin-sidebar-dedupe-contract.php
          php tests/admin-responsive-layout-contract.php
          php tests/glasses-pos-kds-workflow-contract.php
          php tests/glasses-web-simulator-contract.php
          php tests/glasses-live-virtual-preview-contract.php
          php tests/glasses-hud-voice-contract.php
          php tests/kds-slot-voice-contract.php
          php tests/kds-global-order-reference.php
          php -l includes/kds-slot-references.php
          node --check js/kds-voice-listener.js
          node tests/kds-slot-voice.test.js
          php tests/kds-natural-order-voice.php
          node tests/kds-natural-order-voice.test.js
          php tests/agent-verified-voice-greetings.php
          php tests/agent-natural-voice-history-contract.php
          php -l includes/agent-voice-conversation.php
          php -l includes/kds-spoken-orders.php
          node --check js/kds-spoken-orders.js
          node --check assets/js/glasses-simulator-voice.js
          node tests/glasses-voice-navigation.test.js
          node --check assets/js/glasses-web-simulator.js
          node --check assets/js/glasses-pos-kds-test.js

          (cd "$deploy_root" && zip -q -r "$GITHUB_WORKSPACE/gelato-full-deploy.zip" .)
          unzip -t "$GITHUB_WORKSPACE/gelato-full-deploy.zip"

          if zipinfo -1 "$GITHUB_WORKSPACE/gelato-full-deploy.zip" | grep -Eq '^(config\.php$|\.env$|uploads/|storage/)'; then
            echo 'Forbidden live path found in full deploy ZIP.'
            exit 1
          fi

          sha256sum "$GITHUB_WORKSPACE/gelato-full-deploy.zip" | tee "$GITHUB_WORKSPACE/gelato-full-deploy.sha256"

      - name: Upload full deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gelato-full-deploy
          path: |
            gelato-full-deploy.zip
            gelato-full-deploy.sha256
          if-no-files-found: error
          retention-days: 14
