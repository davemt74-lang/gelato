name: Time Clock + Attendance Agent

on:
  pull_request:
    paths:
      - 'timeclock.php'
      - 'api/timeclock-agent.php'
      - 'api/agent-workspace.php'
      - 'api/brain-orchestrator.php'
      - 'includes/timeclock-agent-core.php'
      - 'includes/timeclock-agent-brain.php'
      - 'includes/timeclock-voice-core.php'
      - 'includes/agent-node-registry.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-confirmation-core.php'
      - 'js/timeclock-voice.js'
      - 'js/timeclock-agent-context.js'
      - 'database/20260913_zzzzz_timeclock_voice_agent.sql'
      - 'tests/timeclock-agent-lifecycle.php'
      - 'tests/timeclock-voice-contract.php'
      - '.github/workflows/timeclock-attendance-agent.yml'
  push:
    branches: [main]
    paths:
      - 'timeclock.php'
      - 'api/timeclock-agent.php'
      - 'api/agent-workspace.php'
      - 'api/brain-orchestrator.php'
      - 'includes/timeclock-agent-core.php'
      - 'includes/timeclock-agent-brain.php'
      - 'includes/timeclock-voice-core.php'
      - 'includes/agent-node-registry.php'
      - 'includes/agent-workspace-core.php'
      - 'includes/agent-confirmation-core.php'
      - 'js/timeclock-voice.js'
      - 'js/timeclock-agent-context.js'
      - 'database/20260913_zzzzz_timeclock_voice_agent.sql'
      - 'tests/timeclock-agent-lifecycle.php'
      - 'tests/timeclock-voice-contract.php'
      - '.github/workflows/timeclock-attendance-agent.yml'

jobs:
  timeclock-attendance-agent:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l timeclock.php
          php -l api/timeclock-agent.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l includes/timeclock-agent-core.php
          php -l includes/timeclock-agent-brain.php
          php -l includes/timeclock-voice-core.php
          php -l includes/agent-node-registry.php
          php -l includes/agent-workspace-core.php
          php -l tests/timeclock-agent-lifecycle.php
          php -l tests/timeclock-voice-contract.php
          node --check js/timeclock-voice.js
          node --check js/timeclock-agent-context.js
      - name: First-class Agent architecture contract
        run: |
          grep -q "'timeclock'=>" includes/agent-node-registry.php
          grep -q "timeclock_attendance" includes/agent-node-registry.php
          grep -q "read_confirmed_write" includes/agent-node-registry.php
          grep -q "gac_pending_store('timeclock'" includes/timeclock-agent-core.php
          grep -q "expectedOpenBreakId" includes/timeclock-agent-core.php
          grep -q "timeclock_confirmation" api/agent-workspace.php
          grep -q "timeclock_context" api/agent-workspace.php
          grep -q "gaw_node_route('timeclock'" includes/agent-workspace-core.php
          grep -q "timeclock_agent_merge_brain_snapshot" api/brain-orchestrator.php
          grep -q "module: 'timeclock'" js/timeclock-agent-context.js
          grep -q "js/global-agent.js" timeclock.php
          grep -q "js/dynamic-agent-canvas.js" timeclock.php
          grep -q "Voice recognition is opt-in personalization only" timeclock.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php'; require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);$s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);if($s->pendingMigrations())exit(1);
          PHP
      - name: Verify canonical schema and permissions
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_restaurant_ai_ci' AND table_name IN ('time_clock_entries','time_clock_breaks','attendance_events','voice_identity_profiles','voice_identity_samples','voice_identity_events','proactive_agent_preferences','proactive_agent_events');")" = "8"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('timeclock.self','timeclock.view','timeclock.manage','timeclock.agent','attendance.view','voice.self','voice.manage','voice.agent','agent.proactive');")" = "9"
      - name: DB-backed first-class Agent lifecycle
        run: php tests/timeclock-agent-lifecycle.php
      - name: Existing voice, privacy and clock regression
        run: php tests/timeclock-voice-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';require 'includes/UpgradeService.php';$s=new UpgradeService(app_pdo(),__DIR__);$s->ensureTrackingTables();$a=$s->applyPending(null);if(count($a)!==0||count($s->pendingMigrations())!==0)exit(1);echo "second-run=clean\n";
          PHP
