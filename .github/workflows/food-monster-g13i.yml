name: FM-G13I Training Change Impact
on:
  pull_request:
    paths:
      - 'includes/food-monster-g13i-training-impact.php'
      - 'api/food-monster-training-impact.php'
      - 'api/agent-workspace.php'
      - 'includes/food-monster-g13h-unified-audit.php'
      - 'includes/food-monster-g13c-training.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g13i-impact.php'
      - '.github/workflows/food-monster-g13i.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-g13i-training-impact.php'
      - 'api/food-monster-training-impact.php'
      - 'api/agent-workspace.php'
      - 'includes/food-monster-g13h-unified-audit.php'
      - 'includes/food-monster-g13c-training.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g13i-impact.php'
      - '.github/workflows/food-monster-g13i.yml'
jobs:
  training-source-drift-and-participant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint menu source impact, APIs and Agent Brain
        run: |
          php -l includes/food-monster-g13i-training-impact.php
          php -l api/food-monster-training-impact.php
          php -l api/agent-workspace.php
          php -l agent-canvas.php
          php -l tests/food-monster-g13i-impact.php
          node --check js/agent-canvas.js
      - name: Impact contracts and inherited training permission regression
        run: |
          php tests/food-monster-g13i-impact.php
          php tests/food-monster-g13h-audit.php
          php tests/food-monster-g13g-history.php
          php tests/food-monster-g13f-procedures.php
          php tests/food-monster-g13e-intelligence.php
          php tests/food-monster-g13d-dialogue.php
          php tests/food-monster-g13c-training.php
          php tests/food-monster-g13b-knowledge.php
          php tests/food-monster-g13a-engagement.php
          php tests/food-monster-g9f-approvals.php
          node tests/food-monster-g10b-turns.test.cjs
          node tests/food-monster-g11b-turns.test.cjs
