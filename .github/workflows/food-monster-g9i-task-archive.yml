name: FM-G9I Task Archive Execution
on:
  pull_request:
    paths:
      - 'includes/food-monster-g9i-task-archive.php'
      - 'includes/food-monster-high-impact-approval.php'
      - 'includes/operations-archive-core.php'
      - 'api/operations.php'
      - 'api/food-monster-approvals.php'
      - 'api/agent-workspace.php'
      - 'tests/food-monster-g9i-task-archive.php'
      - '.github/workflows/food-monster-g9i-task-archive.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-g9i-task-archive.php'
      - 'includes/food-monster-high-impact-approval.php'
      - 'api/food-monster-approvals.php'
      - 'api/agent-workspace.php'
      - 'tests/food-monster-g9i-task-archive.php'
      - '.github/workflows/food-monster-g9i-task-archive.yml'
jobs:
  permission-execution:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax, existing approval compatibility
        run: |
          php -l includes/food-monster-g9i-task-archive.php
          php -l includes/food-monster-high-impact-approval.php
          php -l includes/operations-archive-core.php
          php -l api/operations.php
          php -l api/food-monster-approvals.php
          php -l api/agent-workspace.php
          php -l tests/food-monster-g9i-task-archive.php
          php tests/food-monster-g9f-approvals.php
      - name: Install current schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();$s->bootstrapLegacyHistory(null);$s->applyPending(null);
          if($s->pendingMigrations())exit(1);
          PHP
      - name: Execute approved task archiving against MariaDB
        run: php tests/food-monster-g9i-task-archive.php
