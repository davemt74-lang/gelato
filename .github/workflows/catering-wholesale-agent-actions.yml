name: Catering + Wholesale Agent Actions

on:
  pull_request:
    paths:
      - 'api/agent-workspace.php'
      - 'api/catering-agent.php'
      - 'api/wholesale-agent.php'
      - 'includes/agent-node-registry.php'
      - 'includes/catering-agent-actions.php'
      - 'includes/wholesale-agent-core.php'
      - 'js/catering-agent-context.js'
      - 'js/wholesale-agent-context.js'
      - 'js/global-add-canvas.js'
      - 'tests/catering-wholesale-agent-actions-contract.php'
      - 'tests/catering-wholesale-agent-db-lifecycle.php'
      - '.github/workflows/catering-wholesale-agent-actions.yml'
  push:
    branches: [main]
    paths:
      - 'api/agent-workspace.php'
      - 'api/catering-agent.php'
      - 'api/wholesale-agent.php'
      - 'includes/agent-node-registry.php'
      - 'includes/catering-agent-actions.php'
      - 'includes/wholesale-agent-core.php'
      - 'js/catering-agent-context.js'
      - 'js/wholesale-agent-context.js'
      - 'js/global-add-canvas.js'
      - 'tests/catering-wholesale-agent-actions-contract.php'
      - 'tests/catering-wholesale-agent-db-lifecycle.php'
      - '.github/workflows/catering-wholesale-agent-actions.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: PHP syntax
        run: |
          php -l api/agent-workspace.php
          php -l api/catering-agent.php
          php -l api/wholesale-agent.php
          php -l includes/agent-node-registry.php
          php -l includes/catering-agent-actions.php
          php -l includes/wholesale-agent-core.php
          php -l tests/catering-wholesale-agent-actions-contract.php
          php -l tests/catering-wholesale-agent-db-lifecycle.php
      - name: JavaScript syntax
        run: |
          node --check js/catering-agent-context.js
          node --check js/wholesale-agent-context.js
          node --check js/global-add-canvas.js
      - name: Agent behavior contract
        run: php tests/catering-wholesale-agent-actions-contract.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->ensureTrackingTables();
          $service->bootstrapLegacyHistory(null);
          $service->applyPending(null);
          if($service->pendingMigrations()) exit(1);
          PHP
      - name: DB-backed Propose Confirm Execute lifecycle
        run: php tests/catering-wholesale-agent-db-lifecycle.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $service=new UpgradeService(app_pdo(),__DIR__);
          $service->assertAppliedChecksumsUnchanged();
          if($service->pendingMigrations()) exit(2);
          if($service->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
