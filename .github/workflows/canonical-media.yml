name: Canonical Menu + Location Media

on:
  pull_request:
    paths:
      - 'database/20261009_canonical_media_images.sql'
      - 'includes/media-core.php'
      - 'api/media.php'
      - 'menu-manager.php'
      - 'menu.php'
      - 'locations.php'
      - 'locations-admin.php'
      - 'assets/css/canonical-media.css'
      - 'assets/js/menu-media.js'
      - 'assets/js/location-media.js'
      - 'tests/canonical-media-contract.php'
      - '.github/workflows/canonical-media.yml'
      - '.gitignore'
  push:
    branches: [main]

jobs:
  media:
    name: Canonical Media PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/media-core.php
          php -l api/media.php
          php -l menu-manager.php
          php -l menu.php
          php -l locations.php
          php -l locations-admin.php
          php -l tests/canonical-media-contract.php
          node --check assets/js/menu-media.js
          node --check assets/js/location-media.js
      - name: Architecture and upload safety contract
        run: |
          grep -q 'main_image_file_id' database/20261009_canonical_media_images.sql
          grep -q 'image_file_id' database/20261009_canonical_media_images.sql
          grep -q 'cover_image_file_id' database/20261009_canonical_media_images.sql
          grep -q "image/jpeg.*image/png.*image/webp" includes/media-core.php
          grep -q 'SVG and other file types are not accepted' includes/media-core.php
          grep -q "storage_driver.*local_public" includes/media-core.php
          grep -q "uploads/media/org-" includes/media-core.php
          grep -q "app_has_permission.*permission" api/media.php
          grep -q 'Main menu image' assets/js/menu-media.js
          grep -q 'Location cover image' locations-admin.php
          grep -q 'public-location-cover' locations.php
          grep -q 'public-menu-item-image' menu.php
          grep -q '^/uploads/\*' .gitignore
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Media CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_media_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Verify media schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='gelato_restaurant_ai_ci' AND ((table_name='menu_items' AND column_name='main_image_file_id') OR (table_name='ingredients' AND column_name='image_file_id') OR (table_name='locations' AND column_name='cover_image_file_id'));")" = "3"
      - name: Canonical media behavioral contract
        run: php tests/canonical-media-contract.php
      - name: Food builder regression
        run: php tests/menu-manager-food-builder-contract.php
      - name: Drink builder regression
        run: php tests/menu-manager-drink-builder-contract.php
      - name: Online ordering regression
        run: php tests/online-ordering-inbox-contract.php
      - name: Package Deals regression
        run: php tests/package-deals-contract.php
      - name: Verify upgrader idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP

  deploy-package:
    name: Canonical Media Direct Deploy Package
    needs: media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build direct deploy ZIP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip unzip
          rm -rf deploy-patch stonefellows-canonical-media-deploy.zip
          mkdir -p deploy-patch/includes deploy-patch/api deploy-patch/assets/css deploy-patch/assets/js deploy-patch/js deploy-patch/css deploy-patch/database
          cp menu-manager.php menu.php locations.php locations-admin.php upgrade.php deploy-patch/
          cp api/media.php api/menu-manager.php api/menu-drink.php deploy-patch/api/
          cp includes/*.php deploy-patch/includes/
          cp assets/css/canonical-media.css assets/css/menu-manager.css assets/css/site.css assets/css/page-headers.css deploy-patch/assets/css/
          cp assets/js/menu-media.js assets/js/location-media.js assets/js/menu-manager.js assets/js/menu-manager-drink.js assets/js/site.js assets/js/public-shell.js deploy-patch/assets/js/
          cp js/universal-admin-page-shell.js js/global-add-canvas.js deploy-patch/js/
          cp css/global-add-canvas.css css/admin-tech-theme.css deploy-patch/css/
          for migration in database/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql; do
            name="$(basename "$migration")"
            case "$name" in *_demo_*|*_sample_*|*_seed_*) continue ;; esac
            cp "$migration" deploy-patch/database/
          done
          test -f deploy-patch/api/media.php
          test -f deploy-patch/includes/media-core.php
          test -f deploy-patch/database/20261009_canonical_media_images.sql
          test ! -e deploy-patch/uploads
          cat > deploy-patch/README-DEPLOY.txt <<'EOF'
          Stonefellows / Gelato Canonical Menu + Location Media

          Extract directly into the application web root, preserving folders and
          overwriting the included files. Then sign in as owner/admin and run
          upgrade.php -> Upgrade once.

          This adds one main image per Food/Drink item, one canonical image per
          ingredient, and one unique cover image per location. Images are stored at
          runtime under uploads/media and are intentionally NOT included in deploy
          packages or source control. The database stores file ledger references.

          Allowed uploads: JPEG, PNG and WebP, maximum 10 MB. SVG is rejected.
          Public Menu renders item/ingredient imagery and the selected location cover;
          Public Locations renders each store's unique cover while the menu itself
          remains shared across locations.
          EOF
          (cd deploy-patch && zip -qr ../stonefellows-canonical-media-deploy.zip .)
          unzip -t stonefellows-canonical-media-deploy.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stonefellows-canonical-media-deploy
          path: stonefellows-canonical-media-deploy.zip
          if-no-files-found: error
          retention-days: 30
