name: FM-G14A Kitchen Pilot Readiness
on:
  pull_request:
    paths:
      - 'includes/food-monster-g14a-pilot.php'
      - 'api/food-monster-pilot.php'
      - 'api/agent-workspace.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'docs/food-monster-g14a-kitchen-pilot.md'
      - 'tests/food-monster-g14a-pilot.php'
      - 'tests/food-monster-g14a-mysql.php'
      - '.github/workflows/food-monster-g14a.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-g14a-pilot.php'
      - 'api/food-monster-pilot.php'
      - 'api/agent-workspace.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g14a-pilot.php'
      - 'tests/food-monster-g14a-mysql.php'
      - '.github/workflows/food-monster-g14a.yml'
jobs:
  pilot-permissions-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint pilot, Agent Chat and diagnostic sidebar
        run: |
          php -l includes/food-monster-g14a-pilot.php
          php -l api/food-monster-pilot.php
          php -l api/agent-workspace.php
          php -l agent-canvas.php
          php -l tests/food-monster-g14a-pilot.php
          php -l tests/food-monster-g14a-mysql.php
          node --check js/agent-canvas.js
      - name: Pilot owner audit and inherited Food Monster safety regression
        run: |
          php tests/food-monster-g14a-pilot.php
          php tests/food-monster-g13l-shift.php
          php tests/food-monster-g13k-notices.php
          node tests/food-monster-g13k-ui.test.cjs
          php tests/food-monster-g13j-refresh.php
          php tests/food-monster-g13i-impact.php
          php tests/food-monster-g13h-audit.php
          php tests/food-monster-g13g-history.php
          php tests/food-monster-g13f-procedures.php
          php tests/food-monster-g13e-intelligence.php
          php tests/food-monster-g13d-dialogue.php
          php tests/food-monster-g13c-training.php
          php tests/food-monster-g13b-knowledge.php
          php tests/food-monster-g13a-engagement.php
          php tests/food-monster-g9f-approvals.php
          node tests/food-monster-g10b-turns.test.cjs
          node tests/food-monster-g11b-turns.test.cjs
  pilot-real-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: g14a_cert_only
          MYSQL_DATABASE: gelato_fm_cert
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pg14a_cert_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      G14A_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=gelato_fm_cert;charset=utf8mb4
      G14A_MYSQL_USER: root
      G14A_MYSQL_PASS: g14a_cert_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Test real owner-scoped audit persistence, rollback and revoked membership
        run: php tests/food-monster-g14a-mysql.php
