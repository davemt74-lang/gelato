name: Glasses Section 285E1 Calibration Gates
on:
  pull_request:
    paths:
      - 'assets/js/glasses-camera-calibration-gate.js'
      - 'tests/glasses-section285e1-calibration.test.js'
      - '.github/workflows/glasses-section285e1-calibration.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/glasses-camera-calibration-gate.js'
      - 'tests/glasses-section285e1-calibration.test.js'
      - '.github/workflows/glasses-section285e1-calibration.yml'
jobs:
  calibration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/glasses-section285e1-calibration.test.js tests/glasses-section285d1-stabilization.test.js tests/glasses-section285d5-reliability.test.js
