name: Order Customization + Admin Shell

on:
  pull_request:
    paths:
      - 'online-order.php'
      - 'api/online-order-customizations.php'
      - 'includes/online-order-core.php'
      - 'assets/js/online-order.js'
      - 'js/universal-admin-page-shell.js'
      - 'admin.php'
      - 'admin-menu-import.php'
      - 'timeclock.php'
      - 'scheduling.php'
      - 'purchasing.php'
      - 'equipment.php'
      - 'prep-intelligence.php'
      - 'tests/online-order-customization-shell-contract.php'
      - '.github/workflows/order-customization-admin-shell.yml'
  push:
    branches: [main]
    paths:
      - 'online-order.php'
      - 'api/online-order-customizations.php'
      - 'includes/online-order-core.php'
      - 'assets/js/online-order.js'
      - 'js/universal-admin-page-shell.js'
      - 'admin.php'
      - 'admin-menu-import.php'
      - 'timeclock.php'
      - 'scheduling.php'
      - 'purchasing.php'
      - 'equipment.php'
      - 'prep-intelligence.php'
      - 'tests/online-order-customization-shell-contract.php'
      - '.github/workflows/order-customization-admin-shell.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    name: PHP ${{ matrix.php }} customization + shell
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l online-order.php
          php -l api/online-order-customizations.php
          php -l includes/online-order-core.php
          php -l admin.php
          php -l admin-menu-import.php
          php -l timeclock.php
          php -l scheduling.php
          php -l purchasing.php
          php -l equipment.php
          php -l prep-intelligence.php
          php -l tests/online-order-customization-shell-contract.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/online-order.js
          node --check js/universal-admin-page-shell.js
      - name: Customization and admin shell contract
        run: php tests/online-order-customization-shell-contract.php
