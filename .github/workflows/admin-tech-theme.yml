name: Admin Tech Theme

on:
  pull_request:
    paths:
      - 'css/admin-tech-theme.css'
      - 'js/universal-admin-page-shell.js'
      - 'workspace.php'
      - 'tests/admin-tech-theme-contract.php'
      - '.github/workflows/admin-tech-theme.yml'
  push:
    branches: [main]

jobs:
  admin-tech-theme:
    strategy:
      matrix:
        php: ['8.1','8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax checks
        run: |
          php -l workspace.php
          php -l tests/admin-tech-theme-contract.php
          node --check js/universal-admin-page-shell.js
      - name: Theme contract
        run: php tests/admin-tech-theme-contract.php
