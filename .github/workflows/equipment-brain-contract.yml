name: Equipment Catalog + Agent Brain Contract

on:
  pull_request:
    paths:
      - 'equipment.php'
      - 'api/equipment.php'
      - 'api/agent-brain.php'
      - 'api/equipment-agent.php'
      - 'includes/equipment-brain.php'
      - 'includes/equipment-agent-core.php'
      - 'js/equipment-module.js'
      - 'js/floor-planner-module.js'
      - 'js/equipment-agent-context.js'
      - 'js/global-agent.js'
      - 'database/20260912_floor_planner.sql'
      - 'database/20260912_equipment_catalog_brain.sql'
      - '.github/workflows/equipment-brain-contract.yml'
  push:
    branches: [main]
    paths:
      - 'equipment.php'
      - 'api/equipment.php'
      - 'api/agent-brain.php'
      - 'api/equipment-agent.php'
      - 'includes/equipment-brain.php'
      - 'includes/equipment-agent-core.php'
      - 'js/equipment-module.js'
      - 'js/floor-planner-module.js'
      - 'js/equipment-agent-context.js'
      - 'js/global-agent.js'
      - 'database/20260912_floor_planner.sql'
      - 'database/20260912_equipment_catalog_brain.sql'
      - '.github/workflows/equipment-brain-contract.yml'

jobs:
  equipment-brain-contract:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: |
          php -l equipment.php
          php -l api/equipment.php
          php -l api/agent-brain.php
          php -l api/equipment-agent.php
          php -l includes/equipment-brain.php
          php -l includes/equipment-agent-core.php
      - name: JavaScript syntax
        run: |
          node --check js/equipment-module.js
          node --check js/floor-planner-module.js
          node --check js/equipment-agent-context.js
          node --check js/global-agent.js
      - name: Equipment schema and permission contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS equipment_assets" database/20260912_equipment_catalog_brain.sql
          grep -q "CREATE TABLE IF NOT EXISTS equipment_service_contacts" database/20260912_equipment_catalog_brain.sql
          grep -q "CREATE TABLE IF NOT EXISTS equipment_service_events" database/20260912_equipment_catalog_brain.sql
          grep -q "CREATE TABLE IF NOT EXISTS agent_knowledge_records" database/20260912_equipment_catalog_brain.sql
          grep -q "equipment.view" database/20260912_equipment_catalog_brain.sql
          grep -q "equipment.edit" database/20260912_equipment_catalog_brain.sql
          grep -q "equipment.service" database/20260912_equipment_catalog_brain.sql
          grep -q "equipment.contacts" database/20260912_equipment_catalog_brain.sql
          grep -q "agent.equipment_skills" database/20260912_equipment_catalog_brain.sql
      - name: Agent integration contract
        run: |
          grep -q "equipment_brain_sync_asset" api/equipment.php
          grep -q "equipment_brain_search" api/agent-brain.php
          grep -q "equipment.maintenance_due" api/agent-brain.php
          grep -q "equipment.service_contacts" api/agent-brain.php
          grep -q "knowledge.search" api/agent-brain.php
          grep -q "askOwnerEquipmentBrain" js/equipment-module.js
          grep -q "equipment.php" js/equipment-module.js
          grep -q "js/equipment-agent-context.js" equipment.php
          grep -q "js/global-agent.js" equipment.php
          grep -q "Equipment + Maintenance Agent" equipment.php
          grep -q "equipment_agent_handle" api/equipment-agent.php
          if grep -q 'id="brainInput"' equipment.php; then
            echo 'Legacy standalone Equipment Brain input must not return.' >&2
            exit 1
          fi
      - name: Security contract
        run: |
          grep -q "app_verify_request_csrf" api/equipment.php
          grep -q "app_verify_request_csrf" api/agent-brain.php
          grep -q "organization_id" api/equipment.php
          grep -q "organization_id" api/agent-brain.php
          grep -q "app_has_permission('equipment.view'" api/agent-brain.php
          grep -q "app_has_permission('agent.equipment_skills'" api/agent-brain.php
          grep -q "equipment_agent_require_read" includes/equipment-agent-core.php
          grep -q "equipment_agent_require_edit" includes/equipment-agent-core.php
          grep -q "equipment_agent_require_service" includes/equipment-agent-core.php
      - name: Install migrations in MariaDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_ci < database/install.sql
          mariadb -h 127.0.0.1 -uroot -proot gelato_ci < database/20260912_floor_planner.sql
          mariadb -h 127.0.0.1 -uroot -proot gelato_ci < database/20260912_equipment_catalog_brain.sql
      - name: Verify persisted equipment schema
        run: |
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_ci -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gelato_ci' AND table_name IN ('floor_plans','equipment_assets','equipment_service_contacts','equipment_asset_service_contacts','equipment_service_events','agent_knowledge_records');")" = "6"
          test "$(mariadb -N -h 127.0.0.1 -uroot -proot gelato_ci -e "SELECT COUNT(*) FROM permissions WHERE permission_key IN ('floorplans.view','floorplans.edit','equipment.view','equipment.edit','equipment.service','equipment.contacts','agent.equipment_skills');")" = "7"
          mariadb -N -h 127.0.0.1 -uroot -proot gelato_ci -e "SHOW INDEX FROM agent_knowledge_records WHERE Key_name='ft_agent_knowledge_title_content';" | grep -q ft_agent_knowledge_title_content
