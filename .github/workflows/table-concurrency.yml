name: Table Concurrency Hardening

on:
  pull_request:
    paths:
      - 'includes/service-ops-reservation.php'
      - 'includes/service-seatability.php'
      - 'tests/table-concurrency-worker.php'
      - 'tests/table-concurrency-contract.php'
      - '.github/workflows/table-concurrency.yml'
  push:
    branches: [main]

jobs:
  table-concurrency:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
      - name: Syntax checks
        run: |
          php -l includes/service-ops-reservation.php
          php -l includes/service-seatability.php
          php -l tests/table-concurrency-worker.php
          php -l tests/table-concurrency-contract.php
      - name: Concurrency architecture contract
        run: |
          grep -q 'function service_ops_order_table_ids' includes/service-ops-reservation.php
          grep -q 'ORDER BY id' includes/service-ops-reservation.php
          grep -q 'function service_ops_lock_tables_canonical' includes/service-ops-reservation.php
          grep -q 'function service_ops_current_scheduled_conflict' includes/service-ops-reservation.php
          grep -q 'function service_ops_current_waitlist_conflict' includes/service-ops-reservation.php
          test "$(grep -c 'LIMIT 1 FOR UPDATE' includes/service-ops-reservation.php)" -ge "2"
          grep -q 'service_ops_lock_tables_canonical' includes/service-seatability.php
          grep -q 'service_ops_lock_tables_canonical' includes/service-ops-reservation.php
          grep -q 'function service_seatability_validate_locked_now' includes/service-seatability.php
          grep -q 'proc_open' tests/table-concurrency-contract.php
          grep -q 'gelato-concurrency-errors.log' tests/table-concurrency-worker.php
          grep -q 'Exactly one simultaneous seat attempt' tests/table-concurrency-contract.php
          grep -q 'Opposite-order non-overlapping multi-table assignments' tests/table-concurrency-contract.php
          grep -q 'Exactly one simultaneous overlapping future reservation' tests/table-concurrency-contract.php
          grep -q 'Exactly one active waitlist party' tests/table-concurrency-contract.php
          grep -q 'Opposite-order concurrent combination saves' tests/table-concurrency-contract.php
      - name: Install and upgrade schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP
      - name: Concurrent table-operation contract
        run: |
          rm -f /tmp/gelato-concurrency-errors.log
          php tests/table-concurrency-contract.php || {
            echo 'Concurrency worker diagnostics:'
            cat /tmp/gelato-concurrency-errors.log 2>/dev/null || true
            exit 1
          }
      - name: Upcoming reservation protection regression
        run: php tests/upcoming-reservation-protection-contract.php
      - name: Seatability regression
        run: php tests/table-seatability-contract.php
      - name: Dining visit lifecycle regression
        run: php tests/dining-visit-lifecycle-contract.php
      - name: Recent table-host hardening regression
        run: php tests/table-host-hardening-contract.php
      - name: Host Stand regression
        run: php tests/host-stand-contract.php
      - name: Table Service regression
        run: php tests/table-service-contract.php
      - name: Table Service reconciliation regression
        run: php tests/table-service-reconcile-contract.php
      - name: Native POS regression
        run: php tests/native-pos-contract.php
      - name: Customer CRM regression
        run: php tests/customer-crm-contract.php
      - name: Daily Manager regression
        run: php tests/daily-manager-contract.php
      - name: Upgrader checksum and idempotence
        run: |
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->assertAppliedChecksumsUnchanged();
          if($s->pendingMigrations()) exit(2);
          if($s->applyPending(null)) exit(3);
          echo "idempotent\n";
          PHP
