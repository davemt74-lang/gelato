name: FM-G14C Kitchen Diagnostics and Repair Follow-ups
on:
  pull_request:
    paths:
      - 'includes/food-monster-g14a-pilot.php'
      - 'includes/food-monster-g14c-followups.php'
      - 'api/food-monster-pilot.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g14c-followups.php'
      - 'tests/food-monster-g14c-mysql.php'
      - 'tests/food-monster-g14c-diagnostics.test.cjs'
      - 'tests/food-monster-g14d-guided.test.cjs'
      - 'tests/food-monster-g14d2-troubleshooting.test.cjs'
      - '.github/workflows/food-monster-g14c.yml'
  push:
    branches: [main]
    paths:
      - 'includes/food-monster-g14a-pilot.php'
      - 'includes/food-monster-g14c-followups.php'
      - 'api/food-monster-pilot.php'
      - 'js/agent-canvas.js'
      - 'agent-canvas.php'
      - 'tests/food-monster-g14c-followups.php'
      - 'tests/food-monster-g14c-mysql.php'
      - 'tests/food-monster-g14c-diagnostics.test.cjs'
      - 'tests/food-monster-g14d-guided.test.cjs'
      - 'tests/food-monster-g14d2-troubleshooting.test.cjs'
      - '.github/workflows/food-monster-g14c.yml'
jobs:
  pilot-failure-to-fix-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse pilot PHP and browser JavaScript
        run: |
          php -l includes/food-monster-g14a-pilot.php
          php -l includes/food-monster-g14c-followups.php
          php -l api/food-monster-pilot.php
          php -l agent-canvas.php
          php -l tests/food-monster-g14c-followups.php
          php -l tests/food-monster-g14c-mysql.php
          node --check js/agent-canvas.js
          node --check tests/food-monster-g14c-diagnostics.test.cjs
          node --check tests/food-monster-g14d-guided.test.cjs
          node --check tests/food-monster-g14d2-troubleshooting.test.cjs
      - name: Repair sequencing, private browser metrics and inherited safety gates
        run: |
          php tests/food-monster-g14c-followups.php
          node tests/food-monster-g14c-diagnostics.test.cjs
          node tests/food-monster-g14d-guided.test.cjs
          node tests/food-monster-g14d2-troubleshooting.test.cjs
          php tests/food-monster-g14a-pilot.php
          php tests/food-monster-g13l-shift.php
          php tests/food-monster-g13k-notices.php
          node tests/food-monster-g13k-ui.test.cjs
          php tests/food-monster-g13j-refresh.php
          php tests/food-monster-g13i-impact.php
          php tests/food-monster-g13h-audit.php
          php tests/food-monster-g13g-history.php
          php tests/food-monster-g13f-procedures.php
          php tests/food-monster-g13e-intelligence.php
          php tests/food-monster-g13d-dialogue.php
          php tests/food-monster-g13c-training.php
          php tests/food-monster-g9f-approvals.php
          node tests/food-monster-g10b-turns.test.cjs
          node tests/food-monster-g11b-turns.test.cjs
          node tests/food-monster-g14b-recovery.test.cjs
  real-mysql-repair-evidence:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: g14c_cert_only
          MYSQL_DATABASE: gelato_fm_cert
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pg14c_cert_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      G14C_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=gelato_fm_cert;charset=utf8mb4
      G14C_MYSQL_USER: root
      G14C_MYSQL_PASS: g14c_cert_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Verify MySQL failure, plan, fresh retest, resolution and tenant isolation
        run: php tests/food-monster-g14c-mysql.php
