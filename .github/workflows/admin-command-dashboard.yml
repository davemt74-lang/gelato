name: Admin Command Dashboard

on:
  pull_request:
    paths:
      - 'workspace.php'
      - 'includes/admin-dashboard-core.php'
      - 'api/admin-dashboard.php'
      - 'api/admin-dashboard-agent.php'
      - 'api/agent-workspace.php'
      - 'js/admin-command-dashboard.js'
      - 'css/admin-command-dashboard.css'
      - 'tests/admin-command-dashboard-contract.php'
      - '.github/workflows/admin-command-dashboard.yml'
  push:
    branches:
      - main
    paths:
      - 'workspace.php'
      - 'includes/admin-dashboard-core.php'
      - 'api/admin-dashboard.php'
      - 'api/admin-dashboard-agent.php'
      - 'api/agent-workspace.php'
      - 'js/admin-command-dashboard.js'
      - 'css/admin-command-dashboard.css'
      - 'tests/admin-command-dashboard-contract.php'
      - '.github/workflows/admin-command-dashboard.yml'

permissions:
  contents: read

jobs:
  contract:
    name: PHP ${{ matrix.php }} command dashboard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l workspace.php
          php -l includes/admin-dashboard-core.php
          php -l api/admin-dashboard.php
          php -l api/admin-dashboard-agent.php
          php -l api/agent-workspace.php
          php -l tests/admin-command-dashboard-contract.php
      - name: JavaScript syntax
        run: node --check js/admin-command-dashboard.js
      - name: Dashboard contract
        run: php tests/admin-command-dashboard-contract.php
