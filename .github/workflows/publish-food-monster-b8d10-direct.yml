name: Publish Food Monster B8D10 Direct Deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-food-monster-b8d10-direct.yml
  pull_request:
    paths:
      - .github/workflows/publish-food-monster-b8d10-direct.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-certified-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify release build reference
        run: test -n 'fb5c8e57400cc360382c99934b5577a969ce6c87'
      - name: Download exact merged-main full deployment
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download 40166569657 --repo davemt74-lang/gelato --name gelato-full-deploy --dir payload
          test -s payload/gelato-full-deploy.zip
          test -s payload/gelato-full-deploy.sha256

      - name: Verify archive, checksum, commit and root-level app layout
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          expected="$(sed -nE 's/^([0-9a-f]{64})[[:space:]]+.*gelato-full-deploy\.zip$/\1/p' gelato-full-deploy.sha256)"
          test "${#expected}" -eq 64
          printf '%s  gelato-full-deploy.zip\n' "$expected" | sha256sum --check -
          printf '%s  gelato-full-deploy.zip\n' "$expected" > gelato-full-deploy.sha256
          unzip -tq gelato-full-deploy.zip
          unzip -p gelato-full-deploy.zip DEPLOY_SHA.txt | grep -Fx 'fb5c8e57400cc360382c99934b5577a969ce6c87'
          for file in index.php upgrade.php api/agent-workspace.php config/food-monster-capability-map.json config/.htaccess tests/food-monster-b8d10-approvals.php includes/food-monster-b8d10-approvals.php database/20261217_food_monster_b8d8_action_receipts.sql database/20261218_food_monster_b8d10_approvals.sql api/food-monster-b8d10-approvals.php js/global-agent.js includes/food-monster-b8d3-tool-runtime.php api/food-monster-llm.php; do
            unzip -Z1 gelato-full-deploy.zip | grep -Fx "$file"
          done
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(config\.php$|\.env$|uploads/|storage/)'; then
            echo 'Deployment archive includes a private live path.'
            exit 1
          fi
          if unzip -Z1 gelato-full-deploy.zip | grep -Eq '^(gelato-full-deploy\.zip|deploy\.zip|package\.zip)$'; then
            echo 'Nested deployment ZIP detected.'
            exit 1
          fi

      - name: Publish one direct-download ZIP and checksum
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create gelato-food-monster-b8d10 \
            payload/gelato-full-deploy.zip \
            payload/gelato-full-deploy.sha256 \
            --repo davemt74-lang/gelato \
            --target fb5c8e57400cc360382c99934b5577a969ce6c87 \
            --title 'Gelato Food Monster B8D10 — Verified Vision Review Approval Layer' \
            --notes 'Verified single deploy ZIP from merged Gelato main (FM-B8D10). Model-selected Vision Lab sample review requests prepare durable, expiring, signed-in-user-bound approval proposals without executing changes. Agent Chat offers explicit Approve or Dismiss controls; server revalidates current permissions, tenant and thread ownership, sample state fingerprint, expiration and replay before applying an approved review, with audited receipt. Includes prior B8D3-B8D9 skills and SQL migrations. Deploy ZIP into Gelato app root preserving config.php, .env, uploads and storage; run upgrade.php; hard-refresh. SHA-256 manifest separate. No nested ZIP.'
