name: AR Glasses V10 Production Runtime

on:
  pull_request:
    paths:
      - 'includes/glasses-hardware-runtime.php'
      - 'includes/glasses-frame-pipeline.php'
      - 'includes/glasses-device-health.php'
      - 'includes/glasses-runtime-recovery.php'
      - 'includes/glasses-runtime-soak.php'
      - 'includes/glasses-cook-ux.php'
      - 'includes/glasses-production-pilot.php'
      - 'includes/glasses-v10-release.php'
      - 'database/20261126_v10_production_pilot_governance.sql'
      - 'includes/glasses-simulator.php'
      - 'api/glasses-simulator.php'
      - 'api/glasses-device.php'
      - 'api/glasses-vision-lab.php'
      - 'glasses-simulator.php'
      - 'assets/js/glasses-web-simulator.js'
      - 'assets/js/glasses-production-pilot.js'
      - 'assets/css/glasses-web-simulator.css'
      - 'tests/glasses-v10-hardware-runtime-adapter-contract.php'
      - 'tests/glasses-v10-frame-pipeline-contract.php'
      - 'tests/glasses-v10-device-health-contract.php'
      - 'tests/glasses-v10-runtime-recovery-contract.php'
      - 'tests/glasses-v10-station-soak-contract.php'
      - 'tests/glasses-v10-soak-harness.js'
      - 'tests/glasses-v10-cook-ux-contract.php'
      - 'tests/glasses-v10-cook-ux-harness.js'
      - 'tests/glasses-v10-production-pilot-governance-contract.php'
      - 'tests/glasses-v10-rc1-acceptance-contract.php'
      - 'docs/GLASSES-V10-HARDWARE-RUNTIME.md'
      - 'docs/GLASSES-V10-FRAME-PIPELINE.md'
      - 'docs/GLASSES-V10-DEVICE-HEALTH.md'
      - 'docs/GLASSES-V10-RUNTIME-RECOVERY.md'
      - 'docs/GLASSES-V10-STATION-SOAK.md'
      - 'docs/GLASSES-V10-COOK-UX.md'
      - 'docs/GLASSES-V10-PRODUCTION-PILOT.md'
      - 'docs/GLASSES-V10-RC1.md'
      - 'assets/js/glasses-v10-cook-ux-harness.js'
      - 'assets/js/glasses-v10-soak-harness.js'
      - '.github/workflows/glasses-v10.yml'
  push:
    branches: [main]

jobs:
  v10-production-runtime-rc:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          php -l includes/glasses-hardware-runtime.php
          php -l includes/glasses-frame-pipeline.php
          php -l includes/glasses-device-health.php
          php -l includes/glasses-runtime-recovery.php
          php -l includes/glasses-runtime-soak.php
          php -l includes/glasses-cook-ux.php
          php -l includes/glasses-production-pilot.php
          php -l includes/glasses-v10-release.php
          php -l includes/glasses-simulator.php
          php -l api/glasses-simulator.php
          php -l api/glasses-device.php
          php -l api/glasses-vision-lab.php
          php -l glasses-simulator.php
          php -l tests/glasses-v10-hardware-runtime-adapter-contract.php
          php -l tests/glasses-v10-frame-pipeline-contract.php
          php -l tests/glasses-v10-device-health-contract.php
          php -l tests/glasses-v10-runtime-recovery-contract.php
          php -l tests/glasses-v10-station-soak-contract.php
          node --check assets/js/glasses-v10-soak-harness.js
          node --check tests/glasses-v10-soak-harness.js
          php -l tests/glasses-v10-cook-ux-contract.php
          node --check assets/js/glasses-v10-cook-ux-harness.js
          node --check tests/glasses-v10-cook-ux-harness.js
          node --check assets/js/glasses-production-pilot.js
          php -l tests/glasses-v10-production-pilot-governance-contract.php
          php -l tests/glasses-v10-rc1-acceptance-contract.php
          node --check assets/js/glasses-web-simulator.js

      - name: Architecture guardrails
        run: |
          grep -q 'interface GlassesHardwareRuntimeAdapter' includes/glasses-hardware-runtime.php
          grep -q 'final class GlassesSimulatorHardwareAdapter' includes/glasses-hardware-runtime.php
          grep -q "requiredAdapterId'=>'air3.vendor.v1'" includes/glasses-hardware-runtime.php
          grep -q "'vendorRuntimeAvailable'=>false" includes/glasses-hardware-runtime.php
          grep -q "'onnx'" includes/glasses-hardware-runtime.php
          grep -q 'hardware.frame.prepare' includes/glasses-simulator.php
          grep -q 'hardwareRuntime' api/glasses-simulator.php
          ! grep -q 'kds_transition(' includes/glasses-hardware-runtime.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-hardware-runtime.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-hardware-runtime.php
          grep -q 'GLASSES_FRAME_PIPELINE_SCHEMA' includes/glasses-frame-pipeline.php
          grep -q "'drop_oldest'" includes/glasses-frame-pipeline.php
          grep -q 'function enqueueVisionFrame' assets/js/glasses-web-simulator.js
          grep -q 'function processFrameQueue' assets/js/glasses-web-simulator.js
          grep -q 'FRAME_INFERENCE_TIMEOUT' assets/js/glasses-web-simulator.js
          ! grep -q 'async function runVisionFrame()' assets/js/glasses-web-simulator.js
          ! grep -q 'kds_transition(' includes/glasses-frame-pipeline.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-frame-pipeline.php
          grep -q 'GLASSES_DEVICE_HEALTH_SCHEMA' includes/glasses-device-health.php
          grep -q 'function glasses_device_health_bundle' includes/glasses-device-health.php
          grep -q 'hardware.health.normalize' includes/glasses-simulator.php
          grep -q 'hardware.diagnostics.bundle' includes/glasses-simulator.php
          grep -q 'downloadDeviceDiagnostics' assets/js/glasses-web-simulator.js
          ! grep -q 'kds_transition(' includes/glasses-device-health.php
          ! grep -q 'glasses_build_confirm(' includes/glasses-device-health.php
          grep -q 'GLASSES_RUNTIME_RECOVERY_SCHEMA' includes/glasses-runtime-recovery.php
          grep -q 'function glasses_runtime_recovery_decide' includes/glasses-runtime-recovery.php
          grep -q 'hardware.recovery.contract' includes/glasses-simulator.php
          grep -q 'hardware.recovery.decide' includes/glasses-simulator.php
          grep -q 'rehydrateCanonicalBuild' assets/js/glasses-web-simulator.js
          grep -q 'RUNTIME_FRESH_BARRIER_MS' assets/js/glasses-web-simulator.js
          ! grep -q 'kds_transition(' includes/glasses-runtime-recovery.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-runtime-recovery.php
          grep -q 'GLASSES_RUNTIME_SOAK_SCHEMA' includes/glasses-runtime-soak.php
          grep -q 'function glasses_runtime_soak_evaluate' includes/glasses-runtime-soak.php
          grep -q 'hardware.soak.evaluate' includes/glasses-simulator.php
          grep -q 'maxConcurrentWorkers' assets/js/glasses-v10-soak-harness.js
          ! grep -q 'build.observe' assets/js/glasses-v10-soak-harness.js
          ! grep -q 'handoff.expo' assets/js/glasses-v10-soak-harness.js
          ! grep -q 'kds_transition(' includes/glasses-runtime-soak.php
          grep -q 'GLASSES_COOK_UX_SCHEMA' includes/glasses-cook-ux.php
          grep -q 'hardware.cook_ux.evaluate' includes/glasses-simulator.php
          grep -q 'hudCenterClear' glasses-simulator.php
          grep -q 'function stopCookVision' assets/js/glasses-web-simulator.js
          grep -q "Confirm Send to Expo" assets/js/glasses-web-simulator.js
          ! grep -q 'hud-leader-line' glasses-simulator.php
          ! grep -q 'kds_transition(' includes/glasses-cook-ux.php
          grep -q 'GLASSES_PRODUCTION_PILOT_SCHEMA' includes/glasses-production-pilot.php
          grep -q 'required_hardware_adapter_unavailable' includes/glasses-production-pilot.php
          grep -q 'glasses_vision_model_rollout_rollback' includes/glasses-production-pilot.php
          grep -q 'pilot.production_status' api/glasses-device.php
          grep -q 'productionMode' api/glasses-device.php
          grep -q 'pilot.kill_switch' api/glasses-vision-lab.php
          grep -q 'pilot.rollback_rollout' api/glasses-vision-lab.php
          ! grep -q 'kds_transition(' includes/glasses-production-pilot.php
          ! grep -q 'glasses_handoff_to_expo(' includes/glasses-production-pilot.php
          grep -q "GLASSES_V10_RELEASE='v10.0-rc1'" includes/glasses-v10-release.php
          grep -q "'futureVendorAdapter'=>'air3.vendor.v1'" includes/glasses-v10-release.php
          grep -q "'vendorSdkInstalled'=>false" includes/glasses-v10-release.php

      - name: Install schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot -proot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'root','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_restaurant_ai_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: V10 hardware runtime adapter contract
        run: php tests/glasses-v10-hardware-runtime-adapter-contract.php

      - name: V10 frame pipeline and backpressure contract
        run: php tests/glasses-v10-frame-pipeline-contract.php

      - name: V10 device health telemetry and diagnostics contract
        run: php tests/glasses-v10-device-health-contract.php

      - name: V10 disconnect reconnect recovery contract
        run: php tests/glasses-v10-runtime-recovery-contract.php

      - name: V10 station soak acceptance contract
        run: php tests/glasses-v10-station-soak-contract.php

      - name: V10 deterministic soak harness
        run: node tests/glasses-v10-soak-harness.js

      - name: V10 cook on-lens UX acceptance contract
        run: php tests/glasses-v10-cook-ux-contract.php

      - name: V10 cook UX deterministic harness
        run: node tests/glasses-v10-cook-ux-harness.js

      - name: V10 production pilot governance contract
        run: php tests/glasses-v10-production-pilot-governance-contract.php

      - name: V10 RC1 SDK integration readiness acceptance
        run: php tests/glasses-v10-rc1-acceptance-contract.php

      - name: Existing simulator regression
        run: php tests/glasses-web-simulator-contract.php

      - name: V9 RC1 regression
        run: php tests/glasses-vision-lab-v9-release-acceptance-contract.php
