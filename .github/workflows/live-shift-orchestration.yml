name: Live Shift Orchestration + POS Table Service Agent

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-shift-orchestration.yml'
      - 'table-service.php'
      - 'api/live-shift-agent.php'
      - 'api/agent-workspace.php'
      - 'api/brain-orchestrator.php'
      - 'api/brain-events.php'
      - 'api/pos-item-remove.php'
      - 'includes/live-shift-*.php'
      - 'includes/agent-node-registry.php'
      - 'includes/pos-item-actions.php'
      - 'js/table-service-agent-context.js'
      - 'js/table-cleaning-controls.js'
      - 'tests/live-shift-agent-contract.php'
      - 'tests/pos-ticket-agent-hardening-contract.php'
      - 'database/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-shift-agent:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: gelato_restaurant_ai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, fileinfo, sodium
          coverage: none

      - name: Syntax and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          php -l api/live-shift-agent.php
          php -l api/agent-workspace.php
          php -l api/brain-orchestrator.php
          php -l api/brain-events.php
          php -l api/pos-item-remove.php
          php -l includes/live-shift-agent-core.php
          php -l includes/live-shift-agent-hardening.php
          php -l includes/live-shift-brain.php
          php -l includes/pos-item-actions.php
          php -l tests/live-shift-agent-contract.php
          php -l tests/pos-ticket-agent-hardening-contract.php
          node --check js/table-service-agent-context.js
          node --check js/table-cleaning-controls.js
          grep -q "'live_shift'=>\[" includes/agent-node-registry.php
          grep -q "api/live-shift-agent.php" api/agent-workspace.php

      - name: Install database and run upgrader
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -uroot gelato_restaurant_ai_ci < database/install.sql
          cat > config.php <<'PHP'
          <?php
          return [
            'app'=>['name'=>'Gelato Restaurant AI CI','url'=>'http://127.0.0.1','timezone'=>'America/Phoenix','debug'=>false],
            'database'=>['host'=>'127.0.0.1','port'=>3306,'name'=>'gelato_restaurant_ai_ci','username'=>'root','password'=>'','charset'=>'utf8mb4'],
            'security'=>['session_name'=>'gelato_live_shift_ci','session_lifetime_seconds'=>28800,'cookie_secure'=>false,'cookie_samesite'=>'Lax'],
          ];
          PHP
          php <<'PHP'
          <?php
          require 'includes/bootstrap.php';
          require 'includes/UpgradeService.php';
          $s=new UpgradeService(app_pdo(),__DIR__);
          $s->ensureTrackingTables();
          $s->bootstrapLegacyHistory(null);
          $s->applyPending(null);
          if($s->pendingMigrations()) exit(1);
          PHP

      - name: Live Shift MariaDB behavior contract
        run: php tests/live-shift-agent-contract.php

      - name: POS shared-removal regression
        run: php tests/pos-ticket-agent-hardening-contract.php

      - name: Existing Table Service regression
        run: php tests/table-service-contract.php

      - name: Existing POS contextual Agent regression
        run: php tests/pos-contextual-agent-contract.php
